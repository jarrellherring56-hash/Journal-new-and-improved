# Codemagic build recipe for the Journal iOS app (Capacitor wrapper).
# Runs on a cloud Mac: installs deps, generates the native iOS project from the
# mobile/ Capacitor scaffold, signs it with your Apple account, builds an .ipa,
# and uploads it to TestFlight. The web app itself stays on Vercel — this only
# ships the native shell that bundles it.
#
# Signing is fully automatic: the App Store Connect API key (added in Codemagic
# as the "journal-asc-key" integration) is used to CREATE the distribution
# certificate and provisioning profile on the first build, so you never touch
# Xcode signing by hand.
#
# NOTE ON PUSH: this pipeline builds and ships the app. Turning on the APNs
# entitlement (aps-environment) is a one-time capability toggle done after the
# first successful build — see APP_STORE.md. Everything else (backend, cron,
# APNs credentials in Vercel) is already wired.

workflows:
  ios-journal:
    name: Journal iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: journal-asc-key   # must match the API key name added in Codemagic
    environment:
      # NOTE: no `ios_signing` block on purpose — that one only fetches an
      # EXISTING profile and fails the build before scripts run. Signing is
      # handled below by `fetch-signing-files --create`, which makes the cert
      # and profile automatically on first run.
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.jarrellherring.journal"
    scripts:
      - name: Install Capacitor deps & generate the iOS project
        script: |
          set -e
          cd mobile
          npm install
          # copies web assets into mobile/www, then creates mobile/ios/App
          npm run add-ios
      - name: Set app display name and build number
        script: |
          set -e
          PLIST="mobile/ios/App/App/Info.plist"
          # ITMS-90129: "Journal" as a display/bundle name is already taken on
          # the App Store, so use a unique home-screen name instead.
          plutil -replace CFBundleDisplayName -string "Lucid AI Journal" "$PLIST"
          plutil -replace CFBundleName        -string "Lucid AI Journal" "$PLIST"
          # bump the build number so Apple never sees a duplicate (builds 2-8 used)
          plutil -replace CFBundleVersion     -string "9"          "$PLIST"
          # voice-to-text records audio via getUserMedia, which WKWebView blocks
          # unless the app declares why it needs the microphone
          plutil -replace NSMicrophoneUsageDescription -string "Lucid uses the microphone so you can speak your journal entries instead of typing." "$PLIST"
      - name: Set the app icon (Lucid balloons)
        script: |
          set -e
          # Overwrite every icon in the generated Xcode AppIcon set with our
          # master, resized to whatever pixel size each slot expects. Works
          # whether the template uses a single 1024 icon or legacy multi-sizes.
          ICONSET="mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset"
          MASTER="icon-1024.png"
          if [ -d "$ICONSET" ]; then
            for f in "$ICONSET"/*.png; do
              [ -e "$f" ] || continue
              W=$(sips -g pixelWidth "$f" 2>/dev/null | awk '/pixelWidth/{print $2}')
              if [ -n "$W" ]; then sips -z "$W" "$W" "$MASTER" --out "$f" >/dev/null; else cp "$MASTER" "$f"; fi
            done
            echo "App icon updated ($(ls "$ICONSET"/*.png | wc -l) file(s))."
          else
            echo "AppIcon set not found at $ICONSET" >&2; exit 1
          fi
      # NOTE: native push (aps-environment entitlement) is intentionally NOT wired
      # here. It requires the App Store provisioning profile to carry the Push
      # capability; regenerating that reliably needs a one-time Apple Developer
      # portal step. Adding the entitlement without a push-enabled profile makes
      # the archive step fail to sign (builds 11-13). Ship the rest now; re-add
      # push once the profile is refreshed. Web push still works in the PWA.
      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd mobile/ios/App
          pod install
      - name: Set up code signing (auto-create cert + profile)
        script: |
          set -e
          keychain initialize
          # Apple caps Distribution certificates and returns 409 "you already
          # have a current Distribution certificate" once the cap is hit. This
          # pipeline generates a fresh key each run and can't reuse the existing
          # certs (their private keys were never saved), so revoke them first via
          # the App Store Connect API key. Safe: builds already uploaded to
          # TestFlight/App Store stay validly signed after revocation. Try a few
          # flag spellings across codemagic-cli-tools versions; best-effort.
          # Best-effort cert cleanup, guarded with `set +e` so a listing/deleting
          # hiccup can't abort the build (a false `test &&` under set -e was what
          # killed the previous run). Output is printed so failures are visible.
          set +e
          # Revoke ALL existing distribution certs so --create won't 409. Use the
          # CURRENT CLI form (`certificates list/delete`); the legacy
          # `list-certificates` prints a deprecation notice into stdout that breaks
          # JSON parsing. `sed -n '/^\[/,$p'` strips any leading non-JSON just in
          # case. Best-effort (set +e) so a hiccup can't abort the build.
          app-store-connect certificates list --json > /tmp/certs.json 2>/tmp/certs.err
          echo "--- certificates list stderr ---"; cat /tmp/certs.err 2>/dev/null
          IDS=$(sed -n '/^\[/,$p' /tmp/certs.json | jq -r '.[].id // empty' 2>/dev/null)
          echo "--- certificate IDs: ${IDS:-none} ---"
          for cid in $IDS; do
            if app-store-connect certificates delete "$cid" --yes; then echo "revoked $cid";
            elif app-store-connect certificates delete "$cid"; then echo "revoked $cid";
            else echo "FAILED to revoke $cid"; fi
          done
          set -e
          # generate a fresh RSA private key for the new distribution certificate
          openssl genrsa -out /tmp/cert_key.pem 2048
          # fetch-signing-files with --certificate-key + --create makes the
          # distribution certificate (from this key) AND the App Store
          # provisioning profile for the bundle id
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          # load the signing certificate (with its key) into the build keychain
          keychain add-certificates
          # point the Xcode project at the fetched profile
          xcode-project use-profiles
      - name: Build the iOS app (.ipa)
        script: |
          set -e
          cd mobile/ios/App
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "App"
    artifacts:
      # the ipa is produced inside mobile/ios/App (that's the build step's cwd),
      # so the glob must include that prefix or Codemagic finds nothing to publish
      - mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
