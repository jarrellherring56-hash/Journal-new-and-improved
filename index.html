const PIN_KEY = "daybook:pin:v1";
async function hashPin(pin) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("daybook:" + pin));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

// ---------- rewind: resurface a random past note (starred ones get a boost) ----------
function pickRewind(days) {
  const today = dayKey();
  const pool = [];
  for (const k of Object.keys(days)) {
    if (k === today) continue;
    for (const en of days[k].entries || []) {
      for (const s of en.segments || []) {
        if (!s.type || s.type === "text" || s.type === "qa") pool.push({ day: k, seg: s });
      }
    }
  }
  if (!pool.length) return null;
  const favs = pool.filter((p) => p.seg.fav);
  const src = favs.length && Math.random() < 0.5 ? favs : pool;
  return src[Math.floor(Math.random() * src.length)];
}

// ---------- date helpers ----------
const dayKey = (d = new Date()) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
};
const prettyDate = (key, short = false) => {
  const [y, m, d] = key.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  if (short) return date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const today = dayKey();
  const yest = dayKey(new Date(Date.now() - 86400000));
  const base = date.toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric",
    year: y !== new Date().getFullYear() ? "numeric" : undefined,
  });
  if (key === today) return `Today — ${base}`;
  if (key === yest) return `Yesterday — ${base}`;
  return base;
};

// ---------- linkify ----------
const URL_RE = /(https?:\/\/[^\s<>"')]+|www\.[^\s<>"')]+)/gi;
function Linkify({ text }) {
  const parts = String(text).split(URL_RE);
  return (
    <>
      {parts.map((part, i) => {
        if (!part) return null;
        if (part.match(URL_RE)) {
          const href = part.startsWith("http") ? part : `https://${part}`;
          return (
            <a key={i} href={href} target="_blank" rel="noopener noreferrer" className="xo-link">
              {part}
            </a>
          );
        }
        return <span key={i}>{part}</span>;
      })}
    </>
  );
}

// ---------- image compression ----------
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1000;
        let { width, height } = img;
        if (width > max || height > max) {
          const s = Math.min(max / width, max / height);
          width = Math.round(width * s);
          height = Math.round(height * s);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = () => reject(new Error("Couldn't read image"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Couldn't read file"));
    reader.readAsDataURL(file);
  });
}

// ---------- vibe profile ----------
// days structure: { "2026-07-20": { entries: [{id, time, segments:[{id,type,text,topic,emotion,...}]}] } }
function normalizeDays(d) {
  const out = {};
  let changed = false;
  for (const k of Object.keys(d || {})) {
    const day = d[k];
    if (day && Array.isArray(day.entries)) { out[k] = day; continue; }
    if (day && Array.isArray(day.sections)) {
      // legacy topic-section shape → one entry per old section
      changed = true;
      out[k] = {
        entries: day.sections.map((sec) => ({
          id: uid(),
          time: (sec.items[0] && sec.items[0].time) || "",
          segments: sec.items.map((it) => ({ ...it, topic: it.topic || sec.topic })),
        })),
      };
    }
  }
  return { days: out, changed };
}
function eachSegment(days, fn) {
  for (const k of Object.keys(days)) {
    for (const entry of days[k].entries || []) {
      for (const seg of entry.segments || []) fn(k, entry, seg);
    }
  }
}
function buildVibeProfile(days) {
  const topics = {};
  const moods = {};
  let count = 0;
  eachSegment(days, (k, entry, seg) => {
    count++;
    for (const t of segTags(seg)) topics[t] = (topics[t] || 0) + 1;
    const m = (seg.emotion || "neutral").toLowerCase();
    moods[m] = (moods[m] || 0) + 1;
  });
  const top = (obj, n) =>
    Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, n)
      .map(([k, v]) => `${k} (${v})`).join(", ");
  return {
    count,
    text: `Total items: ${count}. Frequent topics: ${top(topics, 5) || "none yet"}. Mood mix: ${top(moods, 4) || "none yet"}.`,
  };
}

// ---------- AI calls ----------
function extractJSONObject(raw) {
  const cleaned = raw.replace(/```json|```/g, "").trim();
  const s = cleaned.indexOf("{");
  const e = cleaned.lastIndexOf("}");
  if (s === -1 || e === -1 || e <= s) throw new Error("No JSON found in response");
  return JSON.parse(cleaned.slice(s, e + 1));
}

async function callClaude(prompt, maxTokens = 1000) {
  const token = window.__session && window.__session.access_token;
  const response = await fetch("/api/ai", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify({ prompt, max_tokens: maxTokens }),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || ("API request failed: " + response.status));
  return String(data.text || "").trim();
}

async function classifyEntry(text, vibeText, existingTopics = []) {
  const topicHint = existingTopics.length
    ? `\nIMPORTANT for organization: this journal already uses these tags: ${existingTopics.join(", ")}. If a segment fits one of them, REUSE that exact tag (same spelling) instead of inventing a near-duplicate. Only create a new tag when nothing existing fits.`
    : "";
  const raw = await callClaude(`You label journal writing. Split the entry below into segments wherever the subject or emotion shifts (often sentence by sentence, but keep consecutive sentences about the same thing together as one segment). Segments may contain links — keep them intact.

For each segment return:
- "text": the segment's exact text from the entry
- "tags": an array of 2-4 SPECIFIC tags describing what this segment is really about
- "emotion": exactly one of: happy, sad, anxious, calm, excited, angry, nostalgic, hopeful, frustrated, neutral${topicHint}

TAG RULES — this is the most important part:
- Each tag is 1-3 words, Title Case.
- Be SPECIFIC and personal, never generic. NEVER use vague filler tags like "Daily Reflection", "Journal Entry", "Personal Thoughts", "Reflection", "Notes", "Life", "Update", "Misc".
- Name the actual subject AND the emotional texture. Good examples: "Relationship Loss", "Family Frustration", "Money Stress", "Missing Her", "Work Burnout", "Self Doubt", "Late Night Spiral", "Old Friends", "Gym Progress", "Day Trading", "Grief", "Feeling Behind", "Small Win".
- Mix layers: at least one tag for the concrete subject (the person, place, activity) and at least one for the underlying feeling or theme. A segment about arguing with a parent might be ["Family Frustration", "Feeling Unheard", "Mom"].
- Tags should be reusable across entries so patterns build up over time.

Also write "tagline": one short line (under 14 words, no quotes, no emoji) for the top of this person's journal. Make it play off what they keep writing about and their overall vibe, in a cool, late-night tone that speaks to them directly. Their journal profile so far (including this entry): ${vibeText}

Respond with ONLY a raw JSON object: {"segments": [...], "tagline": "..."} — no markdown, no backticks.

Entry:
"""${text}"""`, 8000);
  const parsed = extractJSONObject(raw);
  const BAD_TAGS = ["daily reflection", "journal entry", "personal thoughts", "reflection", "notes", "note", "life", "update", "misc", "general", "thoughts", "entry"];
  const segments = (parsed.segments || [])
    .filter((s) => s && s.text)
    .map((s) => {
      let tags = Array.isArray(s.tags) ? s.tags : (s.topic ? [s.topic] : []);
      tags = tags
        .map((t) => String(t || "").trim())
        .filter(Boolean)
        .filter((t) => !BAD_TAGS.includes(t.toLowerCase()))
        .slice(0, 4);
      if (!tags.length) tags = ["Unsorted"];
      return {
        text: String(s.text).trim(),
        tags,
        topic: tags[0], // primary tag — keeps older code/data paths working
        emotion: String(s.emotion || "neutral").toLowerCase(),
      };
    });
  return { segments, tagline: String(parsed.tagline || "").trim() };
}

async function answerQuestion(question) {
  const raw = await callClaude(`You are the AI inside someone's personal journal. Answer their question below helpfully and warmly in a few sentences (under 120 words). Then, on the LAST line only, output a JSON object like {"topic": "1-3 word topic label", "emotion": "one of: happy, sad, anxious, calm, excited, angry, nostalgic, hopeful, frustrated, neutral"} describing the question. Do not use markdown.

Question:
"""${question}"""`);
  const lines = raw.split("\n").filter((l) => l.trim());
  let meta = { topic: "AI Answers", emotion: "neutral" };
  let answer = raw;
  try {
    const last = lines[lines.length - 1];
    if (last.trim().startsWith("{")) {
      meta = { ...meta, ...JSON.parse(last) };
      answer = lines.slice(0, -1).join("\n").trim();
    }
  } catch (e) { /* keep defaults */ }
  return { answer, topic: String(meta.topic || "AI Answers"), emotion: String(meta.emotion || "neutral").toLowerCase() };
}

// ---------- long-entry handling ----------
const CHUNK_SIZE = 4000;
function splitIntoChunks(text, max = CHUNK_SIZE) {
  if (text.length <= max) return [text];
  const chunks = [];
  let current = "";
  const paragraphs = text.split(/\n{2,}/);
  const pieces = [];
  for (const p of paragraphs) {
    if (p.length <= max) pieces.push(p);
    else {
      // split on sentence ends without regex lookbehind (Safari-safe)
      const parts = p.split(/([.!?]+\s+)/);
      const sents = [];
      for (let i = 0; i < parts.length; i += 2) {
        const sent = (parts[i] || "") + (parts[i + 1] || "");
        if (sent) sents.push(sent);
      }
      let buf = "";
      for (const sent of sents) {
        if ((buf + sent).length > max && buf) { pieces.push(buf.trim()); buf = sent; }
        else buf += sent;
      }
      if (buf.trim()) pieces.push(buf.trim());
    }
  }
  for (const piece of pieces) {
    if ((current + "\n\n" + piece).length > max && current) {
      chunks.push(current);
      current = piece;
    } else {
      current = current ? current + "\n\n" + piece : piece;
    }
  }
  if (current) chunks.push(current);
  return chunks;
}

async function withRetry(fn, tries = 2) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try { return await fn(); }
    catch (e) { lastErr = e; }
  }
  throw lastErr;
}

async function classifyLongEntry(text, vibeText, existingTopics = []) {
  const chunks = splitIntoChunks(text);
  const allSegments = [];
  let tagline = "";
  for (const chunk of chunks) {
    const result = await withRetry(() => classifyEntry(chunk, vibeText, existingTopics));
    allSegments.push(...result.segments);
    if (result.tagline) tagline = result.tagline;
  }
  return { segments: allSegments, tagline };
}

async function loadJSON(key, fallback, shared = false) {
  try {

  }
}

// ---------- insights helpers ----------
function dominantEmotionByDay(days) {
  const out = {};
  for (const k of Object.keys(days)) {
    const tally = {};
    for (const entry of days[k].entries || []) {
      for (const seg of entry.segments || []) {
        const m = (seg.emotion || "neutral").toLowerCase();
        tally[m] = (tally[m] || 0) + 1;
      }
    }
    const best = Object.entries(tally).sort((a, b) => b[1] - a[1])[0];
    if (best) out[k] = best[0];
  }
  return out;
}
function computeStreak(days) {
  let streak = 0;
  const d = new Date();
  if (!days[dayKey(d)]) d.setDate(d.getDate() - 1); // today not written yet doesn't break it
  while (days[dayKey(d)]) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}
function buildDigest(days, numDays = 7) {
  const keys = Object.keys(days).sort().slice(-numDays);
  let out = [];
  for (const k of keys) {
    for (const entry of days[k].entries || []) {
      const topics = [...new Set((entry.segments || []).flatMap(segTags))].join("/");
      const texts = (entry.segments || [])
        .filter((s) => !s.type || s.type === "text" || s.type === "qa")
        .map((s) => (s.type === "qa" ? s.q : s.text))
        .join(" | ")
        .slice(0, 220);
      if (texts) out.push(`${k} · ${topics}: ${texts}`);
    }
  }
  return out.join("\n").slice(0, 6000);
}
function itemPlainText(item) {
  if (item.type === "qa") return `Q: ${item.q}\nA: ${item.a}`;
  if (item.type === "image") return "[photo]";
  return item.text || "";
}

// ---------- mood trend line (last 30 days) ----------
function MoodTrend({ days }) {
  const pts = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    if (!days[k]) continue;
    let sum = 0, n = 0;
    for (const en of days[k].entries || []) {
      for (const s of en.segments || []) {
        const v = VALENCE[(s.emotion || "neutral").toLowerCase()];
        sum += v === undefined ? 0 : v; n++;
      }
    }
    if (n) pts.push({ v: sum / n, k });
  }
  if (pts.length < 2) {
    return <div className="xo-empty" style={{ padding: "18px 8px" }}>Journal a few more days and your mood line will draw itself.</div>;
  }
  const W = 620, H = 190, pl = 16, pr = 16, pt = 14, pb = 14;
  // space the days that have entries evenly across the width, so the chart always fills
  const X = (idx) => pl + (pts.length === 1 ? 0.5 : idx / (pts.length - 1)) * (W - pl - pr);
  const Y = (v) => pt + (2 - v) / 4 * (H - pt - pb);
  let dl = "M " + X(0) + " " + Y(pts[0].v);
  for (let j = 1; j < pts.length; j++) dl += " L " + X(j) + " " + Y(pts[j].v);
  const area = dl + " L " + X(pts.length - 1) + " " + Y(-2) + " L " + X(0) + " " + Y(-2) + " Z";
  return (
    <svg viewBox={"0 0 " + W + " " + H} width="100%">
      <defs>
        <linearGradient id="mtrend" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.25" />
          <stop offset="100%" stopColor="var(--accent)" stopOpacity="0" />
        </linearGradient>
      </defs>
      {[2, 0, -2].map((v) => (
        <line key={v} x1={pl} y1={Y(v)} x2={W - pr} y2={Y(v)} stroke="var(--line)" strokeDasharray={v === 0 ? "" : "3 5"} />
      ))}
      <text x={pl} y={Y(2) - 4} fill="var(--faint)" fontSize="9" letterSpacing="2">BRIGHTER</text>
      <text x={pl} y={Y(-2) + 11} fill="var(--faint)" fontSize="9" letterSpacing="2">HEAVIER</text>
      <path d={area} fill="url(#mtrend)" />
      <path d={dl} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinejoin="round" />
      {pts.map((p, j) => <circle key={p.k} cx={X(j)} cy={Y(p.v)} r="3" fill="var(--accent)"><title>{p.k}</title></circle>)}
    </svg>
  );
}

// ---------- year in pixels ----------
function YearPixels({ domEmotions }) {
  const year = new Date().getFullYear();
  const jan1 = new Date(year, 0, 1);
  const total = Math.round((new Date(year + 1, 0, 1) - jan1) / 86400000);
  const todayK = dayKey();
  const cells = [];
  for (let i = 0; i < jan1.getDay(); i++) cells.push(null);
  for (let i = 0; i < total; i++) cells.push(dayKey(new Date(year, 0, 1 + i)));
  return (
    <div className="xo-yearpixels">
      {cells.map((k, idx) => {
        if (k === null) return <i key={"pad" + idx} className="pad" />;
        const e = domEmotions[k] ? emotionOf(domEmotions[k]) : null;
        return (
          <i
            key={k}
            className={k > todayK ? "future" : ""}
            title={prettyDate(k, true) + (e ? " — " + e.label : "")}
            style={e ? { background: e.dot, borderColor: e.dot } : undefined}
          />
        );
      })}
    </div>
  );
}

        .xo-root.sk-neon .xo-kpi { border-radius: 14px; box-shadow: 0 0 26px rgba(var(--accent-rgb), 0.08); }
        .xo-root.sk-neon .xo-kpi .val { font-family: 'Syncopate', sans-serif; font-size: 20px; letter-spacing: 0; }
        .xo-root.sk-neon .xo-kpi.hero .val { font-size: 28px; text-shadow: 0 0 14px var(--glow); }
        .xo-root.sk-neon .xo-panel, .xo-root.sk-neon .xo-composer, .xo-root.sk-neon .xo-daycard, .xo-root.sk-neon .xo-goal, .xo-root.sk-neon .xo-wallpost { border-radius: 14px; }

        .xo-root.sk-neon .xo-composer:focus-within { border-color: rgba(var(--accent-rgb), 0.55); box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.25), 0 0 26px rgba(var(--accent-rgb), 0.14); }

        /* ================= PHONE OPTIMIZATION (any skin) ================= */
        @media (max-width: 700px) {
          .xo-root { padding: calc(14px + env(safe-area-inset-top, 0px))
                              calc(12px + env(safe-area-inset-right, 0px))
                              calc(88px + env(safe-area-inset-bottom, 0px))
                              calc(12px + env(safe-area-inset-left, 0px)); }

          /* header: brand + gear on top row, tabs as a swipeable segmented strip below */
          .xo-top { gap: 10px; margin-bottom: 10px; }
          .xo-brand { gap: 10px; }
          .xo-title { font-size: 18px; }
          .xo-tabs { order: 3; width: 100%; gap: 4px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; justify-content: flex-start; }
          .xo-tabs::-webkit-scrollbar { display: none; }
          .xo-tab { flex: 0 0 auto; padding: 8px 15px; font-size: 13px; }
          .xo-gear { padding: 7px 14px; font-size: 12px; }
          .xo-sub { margin: 4px 0 12px; }

          /* 16px inputs stop iOS from zooming on focus */
          .xo-composer textarea, .xo-search, .xo-panel input[type="text"], .xo-editbox textarea, .xo-chatrow input, .xo-goalnew input { font-size: 16px; }

          /* balanced 2×2 KPI grid — no orphaned card */
          .xo-kpis { grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
          .xo-kpi { padding: 13px 15px; border-radius: 16px; }
          .xo-kpi.hero { grid-column: span 1; }
          .xo-kpi h4 { margin-bottom: 5px; font-size: 9px; }
          .xo-kpi .val { font-size: 22px; }
          .xo-kpi.hero .val { font-size: 24px; }
          .xo-kpi .val.mood { font-size: 17px; }

          .xo-panel { padding: 15px; border-radius: 16px; }
          .xo-composer { padding: 13px; border-radius: 16px; }
          .xo-composer textarea { min-height: 78px; }
          .xo-hint { display: none; }
          .xo-composer-row { margin-top: 8px; }
          .xo-btns { width: 100%; justify-content: space-between; gap: 6px; }
          .xo-attach, .xo-mic, .xo-ask, .xo-add { padding: 10px 12px; }

          .xo-searchrow { margin-bottom: 8px; }
          .xo-topicchips { gap: 6px; margin-bottom: 10px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
          .xo-topicchips::-webkit-scrollbar { display: none; }
          .xo-topicchip { flex: 0 0 auto; }

          .xo-dayhead { padding: 12px 14px; gap: 8px; }
          .xo-daybody { padding: 0 10px 10px; }
          .xo-section { padding: 11px 12px; }
          .xo-seg { grid-template-columns: 1fr 56px; gap: 8px; }
          .xo-emolabel { font-size: 8.5px; letter-spacing: 0.05em; }
          .xo-sidetopic { max-width: 56px; }
          .xo-segacts { opacity: 1; gap: 0; }
          .xo-act { padding: 3px; font-size: 15px; }

          .xo-daycard, .xo-goal { border-radius: 16px; }

          /* touch devices: kill sticky hover-lift so nothing stays raised after a tap */
          .xo-kpi:hover, .xo-panel:hover, .xo-daycard:hover, .xo-goal:hover, .xo-wallpost:hover { transform: none; }
          .xo-gear:hover, .xo-panel-btn:hover, .xo-preset:hover, .xo-add:hover, .xo-attach:hover, .xo-mic:hover, .xo-ask:hover { transform: none; }

        /* ================= DESKTOP REFINEMENTS (phone layout untouched) ================= */
        @media (min-width: 701px) {
          /* header stays reachable while scrolling a long journal */
          .xo-top {
            position: sticky; top: 0; z-index: 30;
            padding: 14px 0 12px; margin-bottom: 10px;
            background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 92%, transparent) 58%, transparent);
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
          }

          /* the writing box is the main event */

          .xo-kpi { padding: 20px 22px; }

          .xo-kpi.hero::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }

          /* entries: tags read as the headline, roomier body */

        .xo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .xo-galtile { aspect-ratio: 1; width: 100%; height: 100%; object-fit: cover; border-radius: 14px; border: 1px solid var(--line); background: var(--inputbg); cursor: zoom-in; display: block; transition: transform .18s, border-color .18s; }
        img.xo-galtile:hover { transform: translateY(-2px); border-color: rgba(var(--accent-rgb), 0.5); }

            {allPhotos.length === 0 ? (
              <div className="xo-empty">
                <strong>No photos yet.</strong>
                Attach a photo to any journal entry — with the + Photo button or by pasting — and every picture you add will collect here.
              </div>
            ) : (
              <>
                <p className="xo-wallnote">{allPhotos.length} photo{allPhotos.length === 1 ? "" : "s"}, newest first. Tap any to view it full-size.</p>
                <div className="xo-gallery">
                  {allPhotos.map((p) => (
                    <Thumb key={p.imgKey} imgKey={p.imgKey} onOpen={() => setLightbox(p)} />
                  ))}
                </div>
              </>
            )}
          </>
        )}

        {view === "ask" && (
          <div className="xo-panel" style={{ maxWidth: 760 }}>
            <h3>Talk to your journal</h3>
            <p className="xo-note" style={{ marginBottom: 12 }}>
              Ask about anything you've written — moods, people, decisions, patterns. The AI answers from your own entries. Conversations aren't saved.
            </p>
            <div className="xo-chat">
              {askMsgs.length === 0 && !askBusy && (
                <div className="xo-empty" style={{ padding: "24px 8px" }}>
                  Try: "What was on my mind last week?" · "When did I last write about work?" · "What usually makes me anxious?"
                </div>
              )}
              {askMsgs.map((m, i) => (
                <div key={i} className={m.role === "u" ? "xo-msg u" : "xo-msg a"}>
                  {m.role === "a" && <span className="xo-aibadge">AI</span>}
                  <Linkify text={m.text} />
                </div>
              ))}
              {askBusy && (
                <div className="xo-msg a"><span className="xo-aibadge">AI</span><span style={{ opacity: 0.6, fontStyle: "italic" }}>reading back through your entries…</span></div>
              )}
            </div>
            <div className="xo-chatrow">
              <input
                className="xo-search"
                type="text"
                value={askInput}
                onChange={(e) => setAskInput(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") askJournal(); }}
                placeholder="Ask your journal anything…"
                disabled={askBusy}
              />
              <button className="xo-add" onClick={askJournal} disabled={askBusy || !askInput.trim()}>Ask</button>
            </div>
          </div>
        )}

        {view === "journal" && (
          <>
            {hasEntries && (
              <div className="xo-kpis">
                <div className="xo-kpi hero"><h4>Day streak</h4><div className="val">{streak}<span className="unit"> day{streak === 1 ? "" : "s"}</span></div></div>
                <div className="xo-kpi"><h4>Days journaled</h4><div className="val">{dayKeys.length}</div></div>
                <div className="xo-kpi"><h4>Notes</h4><div className="val">{totalNotes}</div></div>
                <div className="xo-kpi"><h4>Top mood — 7d</h4><div className="val mood" style={weekMood ? { color: weekMood.dot } : undefined}>{weekMood ? weekMood.label : "—"}</div></div>
              </div>
            )}
            <div className="xo-grid2">
            <div>
            {showPromptCard && (
              <div className="xo-promptcard">
                <b>{hasEntries ? "Been thinking about your last entries…" : "Tonight's prompt"}</b>
                <button className="xo-shuffle" title="Show me something else" aria-label="New prompt" onClick={genWelcome} disabled={welcomeBusy}>↻</button>
                {welcomeBusy ? <span style={{ opacity: 0.6, fontStyle: "italic" }}>reading back through what you wrote…</span> : welcome}
              </div>
            )}

            <div className="xo-composer">
              <textarea
                ref={textareaRef}
                value={draft}
                onChange={(e) => setDraft(e.target.value)}
                onPaste={onPaste}
                placeholder={"What's on your mind tonight? Write, talk, paste links or photos.\n\nStart with @ai to ask the AI a question. Cmd/Ctrl + Enter to send."}
                onKeyDown={(e) => {
                  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") submit();
                }}
                disabled={busy}
              />

              {pendingImgs.length > 0 && (
                <div className="xo-pending">
                  {pendingImgs.map((p) => (
                    <div className="xo-thumb" key={p.id}>
                      <img src={p.dataUrl} alt="Pending attachment" />
                      <button onClick={() => removePending(p.id)} aria-label="Remove photo">×</button>
                    </div>
                  ))}
                </div>
              )}

              <div className="xo-composer-row">
                <span className="xo-hint">Saves automatically — your entries are private to you.</span>
                <div className="xo-btns">
                  <input
                    ref={fileRef}
                    type="file"
                    accept="image/*"
                    multiple
                    style={{ display: "none" }}
                    onChange={(e) => { takeFiles(e.target.files); e.target.value = ""; }}
                  />
                  <button className="xo-attach" onClick={() => fileRef.current && fileRef.current.click()} disabled={busy} title="Add photos">
                    + Photo
                  </button>
                  <button
                    className={listening ? "xo-mic live" : "xo-mic"}
                    onClick={toggleMic}
                    disabled={busy}
                    title={listening ? "Stop listening" : "Speak your entry"}
                  >
                    {listening ? "● Listening" : "🎤 Talk"}
                  </button>
                  <button className="xo-ask" onClick={askAI} disabled={busy || !draft.trim()}>
                    {busy && busyMode === "ask" ? (<><span className="xo-spin" />Thinking…</>) : "Ask AI"}
                  </button>
                  <button className="xo-add" onClick={addEntry} disabled={busy || (!draft.trim() && !pendingImgs.length)}>
                    {busy && busyMode === "entry" ? (<><span className="xo-spin" />Sorting…</>) : "Add entry"}
                  </button>
                </div>
              </div>
              {error && <div className="xo-error">{error}</div>}
            </div>

            {hasEntries && (
              <>
                <div className="xo-searchrow">
                  <input
                    className="xo-search"
                    type="text"
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    placeholder="Search your journal…"
                  />
                </div>
                {(topTopics.length > 1 || anyFav) && (
                  <div className="xo-topicchips">
                    {anyFav && (
                      <button className={favFilter ? "xo-topicchip on" : "xo-topicchip"} onClick={() => setFavFilter(!favFilter)}>
                        ★ Favorites
                      </button>
                    )}
                    {topTopics.map((t) => (
                      <button
                        key={t}
                        className={topicFilter.toLowerCase() === t.toLowerCase() ? "xo-topicchip on" : "xo-topicchip"}
                        onClick={() => setTopicFilter(topicFilter.toLowerCase() === t.toLowerCase() ? "" : t)}
                      >
                        {t}
                      </button>
                    ))}
                    {(topicFilter || query || favFilter) && (
                      <button className="xo-topicchip" onClick={() => { setTopicFilter(""); setQuery(""); setFavFilter(false); }}>
                        ✕ clear
                      </button>
                    )}
                  </div>
                )}
              </>
            )}

            {!loaded && <div className="xo-empty">Opening your journal…</div>}

            {loaded && !hasEntries && (
              <div className="xo-empty">
                <strong>{neon ? "The city is quiet. The page is empty." : "A clean page."}</strong>
                Write your first entry above — or paste a photo or link straight into the box.
                Start a line with @ai to get an answer saved into your journal.
                {neon && <span className="jp">今夜、何を考えていますか</span>}
              </div>
            )}

            {loaded && hasEntries && filteredDays.length === 0 && (
              <div className="xo-empty">Nothing matches that search.</div>
            )}

            {loaded && filteredDays.map(({ key: k, entries }, di) => {
              const noteCount = entries.reduce((n, en) => n + en.segments.length, 0);
              const filtering = !!(q || topicFilter || favFilter);
              const open = filtering || (dayCollapsed[k] !== undefined ? !dayCollapsed[k] : di === 0);
              const dayTally = {};
              entries.forEach((en) => (en.segments || []).forEach((s) => { const mm = (s.emotion || "neutral").toLowerCase(); dayTally[mm] = (dayTally[mm] || 0) + 1; }));
              const domTop = Object.entries(dayTally).sort((a, b) => b[1] - a[1])[0];
              const de = domTop ? emotionOf(domTop[0]) : null;
              return (
              <section className={open ? "xo-daycard open" : "xo-daycard"} key={k}>
                <div className="xo-dayhead" onClick={() => setDayCollapsed((prev) => ({ ...prev, [k]: open }))}>
                  <span className="xo-chev">▶</span>
                  <h2>{prettyDate(k)}</h2>
                  {de && (
                    <span className="xo-chip" style={{ background: de.bg, color: de.text }}>
                      <i style={{ color: de.dot, background: de.dot }} />{de.label}
                    </span>
                  )}
                  <span className="xo-spacer" />
                  <span className="xo-daycount">{entries.length} entr{entries.length === 1 ? "y" : "ies"} · {noteCount} note{noteCount === 1 ? "" : "s"}</span>
                </div>
                {open && <div className="xo-daybody">
                {entries.map((entry) => {
                  const entryTags = [...new Set(entry.segments.flatMap(segTags))];
                  return (
                    <div className="xo-section" key={entry.id}>
                      <div className="xo-section-head">
                        {entryTags.map((t) => (
                          <button
                            key={t}
                            className={topicFilter.toLowerCase() === t.toLowerCase() ? "xo-tag on" : "xo-tag"}
                            title="Filter by this tag"
                            onClick={() => setTopicFilter(topicFilter.toLowerCase() === t.toLowerCase() ? "" : t)}
                          >
                            {t}
                          </button>
                        ))}
                        <span className="xo-entrytime">{entry.time}</span>
                      </div>
                      <div className="xo-flow">
                      {entry.segments.map((seg) => {
                        const e = emotionOf(seg.emotion);
                        const editing = editingId === seg.id;
                        return (
                          <div className="xo-seg" key={seg.id}>
                            <div className="xo-segmain">
                              {editing ? (
                                <div className="xo-editbox">
                                  <textarea value={editText} onChange={(ev) => setEditText(ev.target.value)} />
                                  <div className="xo-editrow">
                                    <button className="save" onClick={() => saveEdit(k, entry.id)}>Save</button>
                                    <button onClick={() => { setEditingId(null); setEditText(""); }}>Cancel</button>
                                  </div>
                                </div>
                              ) : (
                                <>
                                  {(!seg.type || seg.type === "text") && (
                                    <span
                                      className="xo-hl"
                                      style={{ background: e.bg, boxShadow: `inset 0 -2px 0 ${e.dot}88` }}
                                    >
                                      <Linkify text={seg.text} />
                                    </span>
                                  )}
                                  {seg.type === "image" && <StoredImage imgKey={seg.imgKey} />}
                                  {seg.type === "qa" && (
                                    <div className="xo-qa">
                                      <p className="xo-q">{seg.q}</p>
                                      <p className="xo-a"><span className="xo-aibadge">AI</span><Linkify text={seg.a} /></p>
                                    </div>
                                  )}
                                  {seg.type === "recap" && (
                                    <p className="xo-recap"><span className="xo-aibadge">RECAP</span>{seg.text}</p>
                                  )}
                                </>
                              )}
                            </div>
                            <div className="xo-segside">
                              <span className="xo-emolabel" style={{ color: e.dot }}>{e.label}</span>
                              {!editing && (
                                <span className="xo-segacts">
                                  <button
                                    className={seg.fav ? "xo-act star on" : "xo-act star"}
                                    title={seg.fav ? "Unfavorite" : "Favorite"}
                                    aria-label={seg.fav ? "Unfavorite" : "Favorite"}
                                    onClick={() => toggleFav(k, entry.id, seg.id)}
                                  >{seg.fav ? "★" : "☆"}</button>
                                  {(!seg.type || seg.type === "text") && (
                                    <button className="xo-act" title="Edit" aria-label="Edit" onClick={() => startEdit(seg)}>✎</button>
                                  )}
                                  <button className="xo-act del" title="Delete" aria-label="Delete" onClick={() => deleteItem(k, entry.id, seg.id)}>×</button>
                                </span>
                              )}
                            </div>
                          </div>
                        );
                      })}
                      </div>
                    </div>
                  );
                })}
                </div>}
              </section>
              );
            })}

            {loaded && hasEntries && (
              <div className="xo-footer">
                {confirmReset ? (
                  <>
                    <button className="xo-reset" style={{ color: "#FF8B96", borderColor: "rgba(255,75,92,0.4)" }} onClick={resetAll}>
                      Yes, erase everything
                    </button>
                    <button className="xo-reset" onClick={() => setConfirmReset(false)}>Keep my journal</button>
                  </>
                ) : (
                  <button className="xo-reset" onClick={() => setConfirmReset(true)}>
                    Erase all entries
                  </button>
                )}
              </div>
            )}
            </div>

            <div className="xo-side">
              <div className="xo-panel">
                <h3>Mood — last 5 weeks</h3>
                <div className="xo-minical">
                  {["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"].map((h) => <div className="mh" key={h}>{h}</div>)}
                  {Array.from({ length: calPadStart }).map((_, i) => <div className="xo-mc dim" key={"pad" + i} />)}
                  {calCells.map((c) => {
                    const e = c.emotion ? emotionOf(c.emotion) : null;
                    return (
                      <div
                        key={c.key}
                        className="xo-mc"
                        title={prettyDate(c.key, true) + (c.emotion ? " — " + emotionOf(c.emotion).label : "")}
                        style={e ? { background: e.bg, borderColor: e.dot } : undefined}
                      />
                    );
                  })}
                </div>
                <p className="xo-note" style={{ marginTop: 10, marginBottom: 0 }}>Each square is a day, colored by its dominant mood.</p>
              </div>
              {hasEntries && (
                <div className="xo-panel">
                  <h3>This week</h3>
                  <div className="xo-weekbars">
                    {last7.map((d) => (
                      <div className="wb" key={d.key} title={prettyDate(d.key, true) + " — " + d.n + " note" + (d.n === 1 ? "" : "s")}>
                        <div className="wbtrack"><div className="wbfill" style={{ height: Math.round(d.n / week7max * 100) + "%", opacity: d.n ? 1 : 0 }} /></div>
                        <span>{d.lbl}</span>
                      </div>
                    ))}
                  </div>
                  <p className="xo-note" style={{ marginTop: 10, marginBottom: 0 }}>{notes7} note{notes7 === 1 ? "" : "s"} in the last 7 days</p>
                </div>
              )}
              {moodMix.length > 0 && (
                <div className="xo-panel">
                  <h3>Mood mix</h3>
                  {moodMix.map(([m, n]) => {
                    const e = emotionOf(m);
                    return (
                      <div className="xo-statrow" key={m}>
                        <span className="name" style={{ color: e.text }}>{e.label}</span>
                        <span className="bar"><span className="fill" style={{ width: Math.round(n / moodMixMax * 100) + "%", background: e.dot }} /></span>
                        <span className="n">{n}</span>
                      </div>
                    );
                  })}
                </div>
              )}
              {rewind && (
                <div className="xo-panel">
                  <h3>Rewind{rewind.seg.fav ? " ★" : ""}</h3>
                  <p className="xo-note" style={{ marginBottom: 8 }}>
                    {prettyDate(rewind.day)}{segTags(rewind.seg).length ? " · " + segTags(rewind.seg).join(" · ") : ""}
                  </p>
                  <div className="xo-rewindtext">
                    {itemPlainText(rewind.seg).slice(0, 280)}{itemPlainText(rewind.seg).length > 280 ? "…" : ""}
                  </div>
                  <div className="xo-panel-row" style={{ marginTop: 10 }}>
                    <button className="xo-panel-btn" onClick={() => setRewind(pickRewind(days))}>Show another</button>
                  </div>
                </div>
              )}
              {recentPhotos.length > 0 && (
                <div className="xo-panel">
                  <h3>Recent photos</h3>
                  <div className="xo-photostrip">
                    {recentPhotos.map((pk) => <StoredImage key={pk} imgKey={pk} />)}
                  </div>
                </div>
              )}
              {topicRows.length > 0 && (
                <div className="xo-panel">
                  <h3>Top topics</h3>
                  {topicRows.map(([t, n]) => (
                    <div
                      className="xo-statrow click"
                      key={t}
                      title="Filter by this topic"
                      onClick={() => setTopicFilter(topicFilter.toLowerCase() === t.toLowerCase() ? "" : t)}
                    >
                      <span className="name">{t}</span>
                      <span className="bar"><span className="fill" style={{ width: Math.round(n / topicMax * 100) + "%", background: "var(--accent)" }} /></span>
                      <span className="n">{n}</span>
                    </div>
                  ))}
                </div>
              )}
              {otd.length > 0 && (
                <div className="xo-panel">
                  <h3>On this day</h3>
                  {otd.map((o) => {
                    const ens = days[o.key].entries || [];
                    const allSegs = ens.flatMap((en) => en.segments || []);
                    const topics = [...new Set(allSegs.flatMap(segTags))].slice(0, 2).join(", ");
                    const first = allSegs.find((s) => !s.type || s.type === "text");
                    return (
                      <p className="xo-note" key={o.key} style={{ margin: "0 0 8px" }}>
                        <b style={{ color: "var(--body)" }}>{o.label}</b> you wrote about <em style={{ color: "var(--accent)", fontStyle: "normal" }}>{topics || "your day"}</em>
                        {first ? <> — "{String(first.text).slice(0, 90)}{first.text.length > 90 ? "…" : ""}"</> : null}
                      </p>
                    );
                  })}
                </div>
              )}
            </div>
            </div>
          </>
        )}

        {view === "goals" && (
          <>
            <p className="xo-wallnote">
              Set real-life goals, check in when you follow through, and let the AI suggest goals based on what you write about.
            </p>

            <div className="xo-composer" style={{ marginBottom: 18 }}>
              <div className="xo-goalnew">
                <input
                  type="text"
                  className="xo-search"
                  style={{ borderRadius: 10 }}
                  value={newGoal}
                  onChange={(e) => setNewGoal(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") { addGoal(newGoal); setNewGoal(""); } }}
                  placeholder="Add a goal — e.g. Gym 3x this week, call Mom on Sundays…"
                />
                <button className="xo-add" onClick={() => { addGoal(newGoal); setNewGoal(""); }} disabled={!newGoal.trim()}>
                  Add goal
                </button>
              </div>
              <div className="xo-panel-row" style={{ marginTop: 12 }}>
                <button className="xo-panel-btn" onClick={suggestGoals} disabled={sugBusy || !hasEntries}>
                  {sugBusy ? "Reading your entries…" : "Suggest goals from my entries"}
                </button>
              </div>
              {goalSugs.length > 0 && (
                <div className="xo-sugs">
                  {goalSugs.map((sg, i) => (
                    <div className="xo-sug" key={i}>
                      <div className="xo-sugtext">
                        <b>{sg.goal}</b>
                        <span>{sg.why}</span>
                      </div>
                      <button className="xo-panel-btn" onClick={() => { addGoal(sg.goal, "ai"); setGoalSugs(goalSugs.filter((_, j) => j !== i)); }}>
                        Add
                      </button>
                    </div>
                  ))}
                </div>
              )}
              {error && view === "goals" && <div className="xo-error">{error}</div>}
            </div>

            {goals.length === 0 && (
              <div className="xo-empty">
                <strong>No goals yet.</strong>
                Add one above, or let the AI read your entries and suggest where to grow.
              </div>
            )}

            {goals.filter((g) => !g.done).map((g) => {
              const today = dayKey();
              const doneToday = g.checkins.includes(today);
              return (
                <div className="xo-goal" key={g.id}>
                  <div className="xo-goaltop">
                    <span className="xo-goaltext">{g.text}</span>
                    {g.from === "ai" && <span className="xo-aibadge" title="Suggested by the AI">AI</span>}
                  </div>
                  <div className="xo-goalmeta">
                    <span className="xo-goalweek">
                      {goalWeek(g).map((c) => (
                        <i key={c.key} className={c.hit ? "hit" : ""} title={prettyDate(c.key, true)} />
                      ))}
                    </span>
                    <span className="xo-goalstats">{weekCount(g)}/7 this week · {g.checkins.length} total</span>
                  </div>
                  <div className="xo-editrow" style={{ marginTop: 10 }}>
                    <button className="save" onClick={() => checkInGoal(g.id)} disabled={doneToday}>
                      {doneToday ? "✓ Checked in today" : "Check in today"}
                    </button>
                    <button onClick={() => toggleGoalDone(g.id)}>Mark complete</button>
                    <button onClick={() => deleteGoal(g.id)}>Delete</button>
                  </div>
                </div>
              );
            })}

            {goals.some((g) => g.done) && (
              <>
                <h3 className="xo-subhead">Completed</h3>
                {goals.filter((g) => g.done).map((g) => (
                  <div className="xo-goal done" key={g.id}>
                    <div className="xo-goaltop">
                      <span className="xo-goaltext">✓ {g.text}</span>
                    </div>
                    <div className="xo-goalstats">{g.checkins.length} check-in{g.checkins.length === 1 ? "" : "s"}</div>
                    <div className="xo-editrow" style={{ marginTop: 8 }}>
                      <button onClick={() => toggleGoalDone(g.id)}>Reopen</button>
                      <button onClick={() => deleteGoal(g.id)}>Delete</button>
                    </div>
                  </div>
                ))}
              </>
            )}
          </>
        )}

        {view === "trash" && (
          <>
            <p className="xo-wallnote">
              Deleted entries live here for {TRASH_DAYS} days before disappearing for good. Restore puts them back on their original day.
            </p>
            {trash.length === 0 && (
              <div className="xo-empty">
                <strong>Nothing in the void.</strong>
                Entries you delete will wait here for {TRASH_DAYS} days.
              </div>
            )}
            {trash.map((t) => {
              const e = emotionOf(t.item && t.item.emotion);
              return (
                <div className="xo-wallpost" key={t.tid}>
                  <div className="xo-wallmeta">
                    <span className="xo-topic" style={{ cursor: "default" }}>{t.topic}</span>
                    <span className="xo-chip" style={{ background: e.bg, color: e.text }}>
                      <i style={{ color: e.dot, background: e.dot }} />
                      {e.label}
                    </span>
                    <span className="xo-walldate">
                      from {prettyDate(t.day, true)} · deleted {new Date(t.deletedAt).toLocaleDateString(undefined, { month: "short", day: "numeric" })}
                    </span>
                  </div>
                  <div className="xo-body" style={{ whiteSpace: "pre-wrap" }}>
                    {t.item && t.item.type === "image"
                      ? <StoredImage imgKey={t.item.imgKey} />
                      : <Linkify text={itemPlainText(t.item || {})} />}
                  </div>
                  <div className="xo-editrow" style={{ marginTop: 10 }}>
                    <button className="save" onClick={() => restoreItem(t.tid)}>Restore</button>
                    <button onClick={() => purgeItem(t.tid)}>Delete forever</button>
                  </div>
                </div>
              );
            })}
            {trash.length > 0 && (
              <div className="xo-footer">
                <button className="xo-reset" onClick={emptyTrash}>Empty recently deleted</button>
              </div>
            )}
          </>
        )}

      </div>

      {lightbox && (
        <div className="xo-lightbox" onClick={() => setLightbox(null)}>
          <button className="xo-lightclose" aria-label="Close" onClick={() => setLightbox(null)}>×</button>
          <img
            className="xo-lightimg"
            src={imgCache[lightbox.imgKey]}
            alt="Journal photo"
            onClick={(e) => e.stopPropagation()}
          />
          <div className="xo-lightcap">{prettyDate(lightbox.day)}{lightbox.time ? " · " + lightbox.time : ""}</div>
        </div>
      )}
    </div>
  );
}


// ================= cloud storage (same API the app already uses) =================
function makeCloudStorage(sb, userId) {
  return {
    async get(key) {
      const { data, error } = await sb.from("kv").select("value").eq("key", key).maybeSingle();
      if (error) throw error;
      if (!data) throw new Error("not found");
      return { key, value: data.value };
    },
    async set(key, value) {
      const { error } = await sb.from("kv").upsert({ user_id: userId, key, value });
      if (error) throw error;
      return { key, value };
    },
    async delete(key) {
      const { error } = await sb.from("kv").delete().eq("key", key);
      if (error) throw error;
      return { key, deleted: true };
    },
    async list(prefix = "") {
      const { data, error } = await sb.from("kv").select("key").like("key", (prefix || "") + "%");
      if (error) throw error;
      return { keys: (data || []).map((r) => r.key) };
    },
  };
}

// ================= offline layer =================
// Write-through localStorage mirror around cloud storage: reads fall back to the
// mirror when offline, failed writes queue up and flush when the network returns.
function makeOfflineStorage(cloud, userId) {
  const pre = "daybook:mirror:" + userId + ":";
  const dirtyKey = "daybook:dirty:" + userId;
  // Photos are large base64 blobs — never mirror them to localStorage, or a handful
  // would exhaust the ~5MB quota and starve the essential text/settings cache.
  const isBig = (k) => k.startsWith(IMG_PREFIX);
  const getDirty = () => { try { return JSON.parse(localStorage.getItem(dirtyKey) || "[]"); } catch (e) { return []; } };
  const setDirty = (arr) => { try { localStorage.setItem(dirtyKey, JSON.stringify([...new Set(arr)])); } catch (e) { /* quota */ } };
  const flush = async () => {
    const dirty = getDirty();
    if (!dirty.length) return;
    const left = [];
    for (const k of dirty) {
      if (isBig(k)) continue; // photos aren't mirrored, so never sync them through the queue
      const v = localStorage.getItem(pre + k);
      try {
        if (v === null) await cloud.delete(k);
        else await cloud.set(k, v);
      } catch (e) { left.push(k); }
    }
    setDirty(left);
  };
  window.addEventListener("online", flush);
  setInterval(flush, 60000);
  flush();
  return {
    async get(key) {
      try {
        const r = await cloud.get(key);
        if (!isBig(key)) { try { localStorage.setItem(pre + key, r.value); } catch (e) { /* quota */ } }
        return r;
      } catch (err) {
        if (err && err.message === "not found") throw err;
        const v = localStorage.getItem(pre + key);
        if (v !== null) return { key, value: v };
        throw err;
      }
    },
    async set(key, value) {
      if (!isBig(key)) { try { localStorage.setItem(pre + key, value); } catch (e) { /* quota */ } }
      try {
        const r = await cloud.set(key, value);
        setDirty(getDirty().filter((k) => k !== key)); // success clears any stale queued write
        return r;
      } catch (err) {
        if (!isBig(key)) setDirty([...getDirty(), key]); // photos are best-effort; don't queue (can't recover the blob)
        return { key, value, queued: !isBig(key) };
      }
    },
    async delete(key) {
      try { localStorage.removeItem(pre + key); } catch (e) { }
      try {
        const r = await cloud.delete(key);
        setDirty(getDirty().filter((k) => k !== key));
        return r;
      } catch (err) { setDirty([...getDirty(), key]); return { key, deleted: true, queued: true }; }
    },
    async list(prefix) {
      try { return await cloud.list(prefix); }
      catch (err) {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const kk = localStorage.key(i);
          if (kk && kk.startsWith(pre)) {
            const rest = kk.slice(pre.length);
            if (rest.startsWith(prefix || "")) keys.push(rest);
          }
        }
        return { keys };
      }
    },
  };
}

// ================= login screen =================
function Login({ onDone }) {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [invite, setInvite] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  const go = async () => {
    if (busy) return;
    setBusy(true); setMsg("");
    try {
      if (mode === "signup") {
        const { error } = await window.__sb.auth.signUp({
          email: email.trim(),
          password: pw,
          options: { data: { invite: invite.trim() } },
        });
        if (error) throw error;
        const { error: e2 } = await window.__sb.auth.signInWithPassword({ email: email.trim(), password: pw });
        if (e2) { setMsg("Account created — now sign in."); setMode("signin"); }
        else onDone();
      } else {
        const { error } = await window.__sb.auth.signInWithPassword({ email: email.trim(), password: pw });
        if (error) throw error;
        onDone();
      }
    } catch (e) {
      setMsg(e.message || "Something went wrong");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="lg-root">
      <style>{LG_CSS}</style>
      <div className="lg-card">
        <p className="lg-title">Journal<span>/ ai</span></p>
        <p className="lg-sub">{mode === "signup" ? "Create your private journal" : "Welcome back"}</p>
        <label>Email</label>
        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" autoComplete="email" />
        <label>Password</label>
        <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} placeholder="••••••••"
          autoComplete={mode === "signup" ? "new-password" : "current-password"}
          onKeyDown={(e) => { if (e.key === "Enter" && mode === "signin") go(); }} />
        {mode === "signup" && (
          <>
            <label>Invite code</label>
            <input type="text" value={invite} onChange={(e) => setInvite(e.target.value)} placeholder="From whoever sent you here"
              onKeyDown={(e) => { if (e.key === "Enter") go(); }} />
          </>
        )}
        <button className="lg-go" onClick={go} disabled={busy || !email.trim() || pw.length < 6}>
          {busy ? "One sec…" : mode === "signup" ? "Create account" : "Sign in"}
        </button>
        {msg && <div className="lg-msg">{msg}</div>}
        <div className="lg-alt">
          {mode === "signup" ? (
            <>Already have an account?<button onClick={() => { setMode("signin"); setMsg(""); }}>Sign in</button></>
          ) : (
            <>First time here?<button onClick={() => { setMode("signup"); setMsg(""); }}>Create account</button></>
          )}
        </div>
      </div>
    </div>
  );
}

// ================= root: session gate =================
function AuthRoot() {
  const [session, setSession] = useState(undefined); // undefined = checking

  const refresh = async () => {
    const { data } = await window.__sb.auth.getSession();
    setSession(data.session || null);
  };

  useEffect(() => {
    refresh();
    const { data: sub } = window.__sb.auth.onAuthStateChange((_e, s) => setSession(s || null));
    return () => { sub && sub.subscription && sub.subscription.unsubscribe(); };
  }, []);

  if (session === undefined) {
    return <div style={{ minHeight: "100vh", background: "#0a0b0e", color: "#7c8390",
      display: "flex", alignItems: "center", justifyContent: "center",
      fontFamily: "Inter, system-ui, sans-serif" }}>Opening your journal…</div>;
  }
  if (!session) return <Login onDone={refresh} />;

  window.__session = session;
  if (window.__storageFor !== session.user.id) {
    window.storage = makeOfflineStorage(makeCloudStorage(window.__sb, session.user.id), session.user.id);
    window.__storageFor = session.user.id;
  }
  window.__signOut = async () => { await window.__sb.auth.signOut(); };

  return <XOJournal key={session.user.id} />;
}

const __CLEAN_URL = (function(){ try { return new URL(SUPABASE_URL).origin; } catch (e) { return String(SUPABASE_URL).replace(/\/(rest|auth)\/v1\/?$/, "").replace(/\/+$/, ""); } })();
window.__sb = supabase.createClient(__CLEAN_URL, SUPABASE_ANON_KEY);
ReactDOM.createRoot(document.getElementById("root")).render(<AuthRoot />);

</script>
