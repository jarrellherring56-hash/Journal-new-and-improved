// A streak survives ONE missed day per 7 (a "freeze"), as long as the days on
// both sides of the gap were written. Today not being written yet never breaks it.
function computeStreakInfo(days, freeze = true) {
  let streak = 0, since = 99, frozen = 0, lastFrozen = "";
  const d = new Date();
  if (!days[dayKey(d)]) d.setDate(d.getDate() - 1);
  for (let guard = 0; guard < 4000; guard++) {
    const k = dayKey(d);
    if (days[k]) { streak++; since++; }
    else {
      const p = new Date(d); p.setDate(p.getDate() - 1);
      if (freeze && since >= 7 && streak > 0 && days[dayKey(p)]) { since = 0; frozen++; if (!lastFrozen) lastFrozen = k; }
      else break;
    }
    d.setDate(d.getDate() - 1);
  }
  return { streak, frozen, lastFrozen };
}

// ----- tiny IndexedDB store for voice recordings made without a connection -----
const VQ_DB = "lucid-voice-queue";
function vqOpen() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") { reject(new Error("no idb")); return; }
    const r = indexedDB.open(VQ_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("q", { keyPath: "id" });
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function vqRun(mode, fn) {
  const db = await vqOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("q", mode);
    const res = fn(tx.objectStore("q"));
    tx.oncomplete = () => { db.close(); resolve(res && res.result !== undefined ? res.result : undefined); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

const vqAll = () => vqRun("readonly", (s) => s.getAll()).then((r) => r || []);

async function shareOrDownloadFile(blob, filename, text) {
  try {
    const file = new File([blob], filename, { type: blob.type || "application/octet-stream" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: text || "" });
      return "shared";
    }
  } catch (e) { if (e && e.name === "AbortError") return "cancelled"; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);

function buildBookMarkdown(days, settings, year, keys) {
  const out = ["# " + (settings.name || "Journal") + " — " + year, ""];
  keys.forEach((k) => {
    out.push("## " + prettyDate(k), "");
    (days[k].entries || []).forEach((en) => (en.segments || []).forEach((sg) => {
      if (sg.type === "image") return;
      const txt = itemPlainText(sg).trim(); if (!txt) return;
      const em = (sg.emotion || "neutral");
      out.push("**" + em + (en.time ? " · " + en.time : "") + "** — " + txt.replace(/\n/g, "  \n"), "");
    }));
  });
  return out.join("\n");
}

// ----- your year: one tile per day, coloured by that day's mood -----
function YearMap({ days, onClose, onOpenDay }) {
  const thisY = new Date().getFullYear();
  const ys = new Set(Object.keys(days).map((k) => parseInt(k.slice(0, 4), 10)).filter(Boolean));
  ys.add(thisY);
  const years = [...ys].sort((a, b) => a - b);
  const [yr, setYr] = useState(thisY);
  const [sel, setSel] = useState("");
  useEffect(() => {
    const k = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, []);
  const dom = React.useMemo(() => dominantEmotionByDay(days), [days]);
  const todayK = dayKey();
  const pad = (n) => String(n).padStart(2, "0");
  const tally = {};
  let written = 0, best = 0, run = 0;
  const months = [];
  for (let m = 0; m < 12; m++) {
    const dim = new Date(yr, m + 1, 0).getDate();
    const cells = [];
    let v = 0, n = 0;
    for (let d = 1; d <= dim; d++) {
      const k = yr + "-" + pad(m + 1) + "-" + pad(d);
      const has = !!days[k];
      const emo = has ? dom[k] : null;
      if (has) {
        written++; run++; if (run > best) best = run;
        if (emo) { tally[emo] = (tally[emo] || 0) + 1; if (emo in VALENCE) { v += VALENCE[emo]; n++; } }
      } else run = 0;
      cells.push({ k, has, emo, future: k > todayK });
    }
    months.push({ m, cells, avg: n >= 3 ? v / n : null });
  }
  const moods = Object.entries(tally).sort((a, b) => b[1] - a[1]);
  const brightest = months.filter((x) => x.avg !== null).sort((a, b) => b.avg - a.avg)[0];
  const monthName = (m) => new Date(2000, m, 1).toLocaleDateString([], { month: "short" });
  const selMem = sel ? memoryOf(days[sel]) : null;
  const selEmo = sel && dom[sel] ? emotionOf(dom[sel]) : null;
  return (
    <div className="lx-veil" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="lx-sheet" role="dialog" aria-modal="true" aria-label={"Your " + yr + " in moods"}>
        <div className="lx-sheethead">
          <button className="lx-x" aria-label="Previous year" onClick={() => { setSel(""); setYr((y) => Math.max(years[0], y - 1)); }}>‹</button>
          <b style={{ textAlign: "center" }}>{yr}</b>
          <button className="lx-x" aria-label="Next year" onClick={() => { setSel(""); setYr((y) => Math.min(years[years.length - 1], y + 1)); }}>›</button>
          <button className="lx-x" onClick={onClose} aria-label="Close">×</button>
        </div>
        <div className="lx-sheetbody">
          {written === 0 ? <p className="lx-hint">Nothing written in {yr} yet.</p> : (
            <div className="lx-ystats">
              <div><b>{written}</b><span>days written</span></div>
              <div><b>{best}</b><span>longest run</span></div>
              <div><b style={moods[0] ? { color: emotionOf(moods[0][0]).dot } : undefined}>{moods[0] ? emotionOf(moods[0][0]).label : "—"}</b><span>top mood</span></div>
              <div><b>{brightest ? monthName(brightest.m) : "—"}</b><span>brightest month</span></div>
            </div>
          )}
          <div className="lx-ygrid">
            {months.map((mo) => (
              <div className="lx-yrow" key={mo.m}>
                <span className="lx-ymo">{monthName(mo.m)}</span>
                <div className="lx-ycells">
                  {mo.cells.map((c) => c.has ? (
                    <button key={c.k} className={"lx-ycell on" + (c.k === todayK ? " today" : "") + (c.k === sel ? " sel" : "")}
                      style={{ background: c.emo ? emotionOf(c.emo).dot : "var(--accent)" }}
                      aria-label={prettyDate(c.k) + (c.emo ? ", " + emotionOf(c.emo).label : "")} onClick={() => setSel(c.k)} />
                  ) : <i key={c.k} className={"lx-ycell" + (c.future ? " future" : "") + (c.k === todayK ? " today" : "")} />)}
                </div>
              </div>
            ))}
          </div>
          {moods.length > 0 && (
            <div className="lx-yleg">
              {moods.slice(0, 8).map(([e, n]) => <span key={e}><i style={{ background: emotionOf(e).dot }} />{emotionOf(e).label} · {n}</span>)}
            </div>
          )}
          {sel ? (
            <div className="lx-ysel">
              <div className="lx-ysel-top"><b>{prettyDate(sel)}</b>{selEmo && <span style={{ color: selEmo.dot }}>{selEmo.label}</span>}</div>
              {selMem && <p>“{selMem.text}”</p>}

          ) : written > 0 && <p className="lx-hint">Tap a tile to peek at that day.</p>}
        </div>
      </div>
    </div>
  );
}

function GlobalSearch({ days, onClose, onOpenDay, onOpenNote }) {
  const [q, setQ] = useState("");
  const [notes, setNotes] = useState([]);
  const inputRef = useRef(null);
  useEffect(() => {
    let alive = true;
    (async () => {
      let keys = [];
      try { keys = ((await window.storage.list(NOTE_PREFIX)) || {}).keys || []; } catch (e) { }
      const got = await Promise.all(keys.map(async (k) => { try { return JSON.parse((await window.storage.get(k)).value); } catch (e) { return null; } }));
      if (alive) setNotes(got.filter((n) => n && n.id && typeof n.body === "string" && !n.deletedAt));
    })();
    if (inputRef.current) inputRef.current.focus();
    const k = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", k);
    return () => { alive = false; window.removeEventListener("keydown", k); };
  }, []);
  const ql = q.trim().toLowerCase();
  const around = (txt, idx, len) => {
    const s = Math.max(0, idx - 36), e = Math.min(txt.length, idx + len + 90);
    return { pre: (s > 0 ? "…" : "") + txt.slice(s, idx), hit: txt.slice(idx, idx + len), post: txt.slice(idx + len, e) + (e < txt.length ? "…" : "") };
  };
  const entryHits = React.useMemo(() => {
    if (ql.length < 2) return [];
    const out = [];
    for (const k of Object.keys(days).sort().reverse()) {
      for (const en of days[k].entries || []) for (const sg of en.segments || []) {
        const txt = itemPlainText(sg).replace(/\s+/g, " ");
        const i = txt.toLowerCase().indexOf(ql);
        if (i >= 0) out.push({ k, ...around(txt, i, ql.length) });
        if (out.length >= 40) return out;
      }
    }
    return out;
  }, [ql, days]);
  const noteHits = React.useMemo(() => {
    if (ql.length < 2) return [];
    const out = [];
    for (const n of notes) {
      const title = noteTitle(n);
      const body = n.locked ? "" : notePlain(n).replace(/\s+/g, " ");
      const ti = title.toLowerCase().indexOf(ql), bi = body.toLowerCase().indexOf(ql);
      const tagHit = (n.tags || []).some((t) => t.toLowerCase().includes(ql));
      if (ti >= 0 || bi >= 0 || tagHit) out.push({ n, title, snip: bi >= 0 ? around(body, bi, ql.length) : null });
      if (out.length >= 25) break;
    }
    return out;
  }, [ql, notes]);
  const Hi = ({ s }) => (<>{s.pre}<mark>{s.hit}</mark>{s.post}</>);
  const none = ql.length >= 2 && !entryHits.length && !noteHits.length;
  return (
    <div className="lx-veil" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="lx-sheet" role="dialog" aria-modal="true" aria-label="Search everything">
        <div className="lx-sheethead">
          <input ref={inputRef} className="lx-searchinput" type="search" placeholder="Search journal entries and notes" value={q}
            onChange={(e) => setQ(e.target.value)} aria-label="Search everything" />
          <button className="lx-x" onClick={onClose} aria-label="Close search">×</button>
        </div>
        <div className="lx-sheetbody">
          {ql.length < 2 && <p className="lx-hint">Type at least two letters. Locked notes show up by title only.</p>}
          {none && <p className="lx-hint">Nothing found for “{q.trim()}”.</p>}
          {entryHits.length > 0 && (
            <>
              <h4 className="lx-grp">Journal · {entryHits.length}{entryHits.length >= 40 ? "+" : ""}</h4>
              <ul className="lx-results">
                {entryHits.map((h, i) => (
                  <li key={h.k + i}><button onClick={() => onOpenDay(h.k, q.trim())}>
                    <b>{prettyDate(h.k)}</b><span><Hi s={h} /></span>
                  </button></li>
                ))}
              </ul>
            </>
          )}
          {noteHits.length > 0 && (
            <>
              <h4 className="lx-grp">Notes · {noteHits.length}</h4>
              <ul className="lx-results">
                {noteHits.map(({ n, title, snip }) => (
                  <li key={n.id}><button onClick={() => onOpenNote(n.id)}>
                    <b>{n.locked ? "🔒 " : ""}{title}</b>{snip && <span><Hi s={snip} /></span>}
                  </button></li>
                ))}
              </ul>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// ----- journal filter sheet -----
function JournalFilterSheet({ f, setF, onClose, views, onSaveView, onApplyView, onDeleteView, matchCount }) {
  const [name, setName] = useState("");
  const toggleEmo = (e) => setF((p) => ({ ...p, emotions: p.emotions.includes(e) ? p.emotions.filter((x) => x !== e) : [...p.emotions, e] }));
  useEffect(() => {
    const k = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, []);
  const active = jfActive(f);
  return (
    <div className="lx-veil" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="lx-sheet" role="dialog" aria-modal="true" aria-label="Filter your journal">
        <div className="lx-sheethead"><b>Filter your journal</b><button className="lx-x" onClick={onClose} aria-label="Close">×</button></div>
        <div className="lx-sheetbody">
          <h4 className="lx-grp">Mood</h4>
          <div className="lx-chipwrap">
            {Object.keys(EMOTIONS).map((e) => {
              const em = emotionOf(e);
              return (
                <button key={e} className={f.emotions.includes(e) ? "lx-fchip on" : "lx-fchip"} aria-pressed={f.emotions.includes(e)} onClick={() => toggleEmo(e)}>
                  <i style={{ background: em.dot }} />{em.label}
                </button>
              );
            })}
          </div>
          <h4 className="lx-grp">Dates</h4>
          <div className="lx-range">
            <label>From <input type="date" value={f.from} max={f.to || undefined} onChange={(e) => { const v = e.target.value; setF((p) => ({ ...p, from: v })); }} /></label>
            <label>To <input type="date" value={f.to} min={f.from || undefined} onChange={(e) => { const v = e.target.value; setF((p) => ({ ...p, to: v })); }} /></label>
          </div>
          <h4 className="lx-grp">Only show</h4>
          <div className="lx-chipwrap">
            <button className={f.photos ? "lx-fchip on" : "lx-fchip"} aria-pressed={f.photos} onClick={() => setF((p) => ({ ...p, photos: !p.photos }))}>Photos</button>
          </div>
          {views.length > 0 && (
            <>
              <h4 className="lx-grp">Saved views</h4>
              <div className="lx-chipwrap">
                {views.map((v) => (
                  <span key={v.id} className="lx-view">
                    <button onClick={() => onApplyView(v)}>★ {v.name}</button>
                    <button className="lx-viewx" aria-label={"Delete view " + v.name} onClick={() => onDeleteView(v.id)}>×</button>
                  </span>
                ))}
              </div>
            </>
          )}
          {active && (
            <form className="lx-saveview" onSubmit={(e) => { e.preventDefault(); if (name.trim()) { onSaveView(name.trim()); setName(""); } }}>
              <input placeholder="Save this filter as…" value={name} maxLength={30} onChange={(e) => setName(e.target.value)} aria-label="Name for saved view" />
              <button type="submit" disabled={!name.trim()}>Save view</button>
            </form>
          )}
          <div className="lx-foot">
            <button className="lx-link" onClick={() => setF({ ...JF_DEFAULT })}>Clear all</button>
            <button className="lx-primary" onClick={onClose}>Show {matchCount} day{matchCount === 1 ? "" : "s"}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

const FACEID_LS = "lucid:faceid:v1";
const getBio = () => (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.BiometricAuth) || null;
async function bioAvailable() {
  const B = getBio();
  if (!B || !B.checkBiometry) return false;
  try { const r = await B.checkBiometry(); return !!(r && r.isAvailable); } catch (e) { return false; }
}
async function bioAuthenticate() {
  const B = getBio();
  if (!B || !B.authenticate) return false;
  try { await B.authenticate({ reason: "Unlock your journal", cancelTitle: "Use PIN", allowDeviceCredential: false, iosFallbackTitle: "Use PIN" }); return true; }
  catch (e) { return false; }
}

// ---------- app ----------
function XOJournal() {
  const [days, setDays] = useState({});

  const [backupBusy, setBackupBusy] = useState(false);

  const [showCustomize, setShowCustomize] = useState(false);
  const [moreOpen, setMoreOpen] = useState(false);
  const sheetRef = useRef(null);

  const [dayCollapsed, setDayCollapsed] = useState({});

  const [schedTitle, setSchedTitle] = useState("");
  const [schedDate, setSchedDate] = useState(dayKey());
  const [schedTime, setSchedTime] = useState("");
  const [schedNote, setSchedNote] = useState("");
  const [editLayout, setEditLayout] = useState(false);
  const [dragId, setDragId] = useState(null);
  const [notepad, setNotepad] = useState(""); // old single-page notepad; NotepadPro moves it into a note once
  const [showAllTags, setShowAllTags] = useState(false);
  const [tagEdit, setTagEdit] = useState(null);
  const [tagEditVal, setTagEditVal] = useState("");
  const [tagOpen, setTagOpen] = useState(false);

  const tagDropRef = useRef(null);
  // close the tag dropdown on any outside click
  useEffect(() => {

  const LAYOUT_MQ = "(min-width: 1024px) and (pointer: fine)";
  const [isWide, setIsWide] = useState(() => window.matchMedia(LAYOUT_MQ).matches);
  useEffect(() => {
    const mq = window.matchMedia(LAYOUT_MQ);

  useEffect(() => {
    const mq = window.matchMedia(NARROW_MQ);
    const fn = (e) => setIsNarrow(e.matches);
    if (mq.addEventListener) mq.addEventListener("change", fn); else mq.addListener(fn);
    return () => { if (mq.removeEventListener) mq.removeEventListener("change", fn); else mq.removeListener(fn); };
  }, []);
  // quick capture: opening the app at /?new-note starts a fresh note
  const [npAutoNew, setNpAutoNew] = useState(() => /[?&]new-note\b/.test(location.search));
  useEffect(() => {
    if (!npAutoNew) return;

  }, []);
  const [askMsgs, setAskMsgs] = useState([]);
  const [askInput, setAskInput] = useState("");
  const [askBusy, setAskBusy] = useState(false);
  const [favFilter, setFavFilter] = useState(false);
  const [locked, setLocked] = useState(() => !!localStorage.getItem(PIN_KEY));
  const [pinField, setPinField] = useState("");
  const [hasPin, setHasPin] = useState(() => !!localStorage.getItem(PIN_KEY));
  const [query, setQuery] = useState("");
  const [topicFilter, setTopicFilter] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editText, setEditText] = useState("");
  const [listening, setListening] = useState(false);
  const [transcribing, setTranscribing] = useState(false);
  const [recap, setRecap] = useState("");
  const [recapBusy, setRecapBusy] = useState(false);
  const [wrapped, setWrapped] = useState(null);
  const [wrappedBusy, setWrappedBusy] = useState(false);
  const [wrapPeriod, setWrapPeriod] = useState("month");
  const [sharingCard, setSharingCard] = useState(false);
  const [celebrate, setCelebrate] = useState(null); // {n} streak milestone reveal
  const [welcome, setWelcome] = useState("");
  const [welcomeBusy, setWelcomeBusy] = useState(false);
  const [goals, setGoals] = useState([]);
  const [newGoal, setNewGoal] = useState("");
  const [goalSugs, setGoalSugs] = useState([]);
  const [sugBusy, setSugBusy] = useState(false);
  // ----- extras: search, journal filters, offline voice, Face ID, year book -----
  const [showSearch, setShowSearch] = useState(false);
  const [showYear, setShowYear] = useState(false);
  const [npOpenId, setNpOpenId] = useState(null);
  // long journals: draw the newest days first and load older ones on request (keeps typing snappy)
  const DAY_PAGE = 30;
  const [dayLimit, setDayLimit] = useState(DAY_PAGE);
  const [jf, setJfState] = useState(() => {
    try { const f = JSON.parse(localStorage.getItem(JF_LS) || "null"); if (f && typeof f === "object") return { ...JF_DEFAULT, ...f }; } catch (e) { }
    return { ...JF_DEFAULT };
  });
  const jfRef = useRef(jf);
  // accepts a value or an updater, so quick consecutive taps never overwrite each other
  const setJf = (fOrFn) => {
    const next = typeof fOrFn === "function" ? fOrFn(jfRef.current) : fOrFn;
    jfRef.current = next;
    setJfState(next);
    try { localStorage.setItem(JF_LS, JSON.stringify(next)); } catch (e) { }
  };
  const [showJF, setShowJF] = useState(false);
  const [voiceInfo, setVoiceInfo] = useState("");
  const [voiceQueued, setVoiceQueued] = useState(0);
  const processingVoice = useRef(false);
  const [bioAvail, setBioAvail] = useState(false);
  const [bioOn, setBioOn] = useState(() => { try { return localStorage.getItem(FACEID_LS) === "1"; } catch (e) { return false; } });
  const [bookYear, setBookYear] = useState(new Date().getFullYear());
  const [bookBusy, setBookBusy] = useState(false);
  useEffect(() => {
    const el = document.querySelector(".xo-shell");
    if (!el) return;
    el.classList.remove("lx-vin"); void el.offsetWidth; el.classList.add("lx-vin"); // gentle fade/rise on tab change
  }, [view]);
  useEffect(() => {
    document.body.classList.toggle("lx-overlay-open", showSearch || showJF || showYear);
    return () => document.body.classList.remove("lx-overlay-open");
  }, [showSearch, showJF, showYear]);
  useEffect(() => { bioAvailable().then(setBioAvail); }, []);
  useEffect(() => { if (!voiceInfo) return; const t = setTimeout(() => setVoiceInfo(""), 8000); return () => clearTimeout(t); }, [voiceInfo]);
  const textareaRef = useRef(null);
  const fileRef = useRef(null);
  const recRef = useRef(null);            // legacy Web Speech fallback
  const mediaRecRef = useRef(null);       // MediaRecorder for accurate Whisper capture
  const audioChunksRef = useRef([]);
  const micStreamRef = useRef(null);
  const micCapRef = useRef(null);         // safety auto-stop timer
  const micSinkRef = useRef(null);        // where transcribed text goes when not the composer (Notepad)
  const promptRequested = useRef(false);
  const shownAngleRef = useRef(null); // which prompt angle is on screen, for the silent learn-loop

  // ----- initial load -----
  const pullCloud = useRef(null);
  useEffect(() => {
    let alive = true;
    const pull = async () => {
      const [d, s, t, g, sc, np] = await Promise.all([
        loadJSON(STORAGE_KEY, {}),
        loadJSON(SETTINGS_KEY, DEFAULT_SETTINGS),
        loadJSON(TRASH_KEY, []),
        loadJSON(GOALS_KEY, []),
        loadJSON(SCHED_KEY, []),
        loadJSON(NOTEPAD_KEY, ""),
      ]);
      if (!alive) return;
      setGoals(g);
      setSched(Array.isArray(sc) ? sc : []);
      setNotepad(typeof np === "string" ? np : "");
      const merged = { ...DEFAULT_SETTINGS, ...s };
      const norm = normalizeDays(d);
      if (norm.changed) saveJSON(STORAGE_KEY, norm.days);
      // auto-purge trash older than TRASH_DAYS
      const cutoff = Date.now() - TRASH_DAYS * 86400000;
      const kept = [];
      for (const entry of t) {
        const when = entry.deletedAt || Date.now(); // missing timestamp = keep, never assume old
        if (when >= cutoff) kept.push(entry.deletedAt ? entry : { ...entry, deletedAt: when });
        else if (entry.item && entry.item.type === "image" && entry.item.imgKey) {
          window.storage.delete(entry.item.imgKey).catch(() => {});
        }
      }
      if (kept.length !== t.length) saveJSON(TRASH_KEY, kept);
      setDays(norm.days);
      setTrash(kept);
      setSettings(merged);
      setLoaded(true);
    };
    pullCloud.current = pull;
    pull();
    return () => { alive = false; pullCloud.current = null; };
  }, []);

  // ----- cross-device refresh -----
  // Another device (phone vs laptop) can write while this tab sits open. Re-read
  // the cloud whenever the tab comes back to the foreground so both stay in step.
  // Skipped mid-work: an in-flight AI call or an unsaved draft must not be
  // stomped by a background pull.
  useEffect(() => {
    if (!loaded) return;
    const onWake = async () => {
      if (document.hidden) return;
      if (busy || draft.trim()) return;
      // push anything written while offline first, so the pull below doesn't
      // show us an older cloud copy than what this device is still holding
      try { if (window.storage.flush) await window.storage.flush(); } catch (e) { }
      if (pullCloud.current) pullCloud.current();
    };
    document.addEventListener("visibilitychange", onWake);
    window.addEventListener("focus", onWake);
    window.addEventListener("online", onWake);
    return () => {
      document.removeEventListener("visibilitychange", onWake);
      window.removeEventListener("focus", onWake);
      window.removeEventListener("online", onWake);
    };
  }, [loaded, busy, draft]);

  // ----- style pack: fonts & layout follow the picked theme; plain colors stay clean -----
  const theme = THEMES[settings.theme] || THEMES.green;
  const bgTheme = BACKGROUNDS[settings.bg] || BACKGROUNDS.black;
  const pack = theme.pack || "clean";
  const neon = pack === "neon";

  // ----- keep the browser/native status bar in sync with the chosen backdrop -----
  useEffect(() => {
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", bgTheme.bg);
    // Native: flip status-bar text between light/dark so the clock stays visible.
    // Capacitor StatusBar.Style.Dark = light text; Light = dark text.
    const lightBg = ["snow", "lavender", "blush"].includes(settings.bg);
    const SB = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar;
    if (SB) SB.setStyle({ style: lightBg ? "LIGHT" : "DARK" }).catch(() => {});
  }, [settings.bg]);

  // Close the phone "More" sheet whenever the view changes.
  useEffect(() => { setMoreOpen(false); }, [view]);

  // iOS-style sticky nav: hairline border appears once the page is scrolled.
  useEffect(() => {
    const fn = () => {
      const el = document.querySelector(".xo-top");
      if (el) el.classList.toggle("scrolled", window.scrollY > 4);
    };
    window.addEventListener("scroll", fn, { passive: true });
    return () => window.removeEventListener("scroll", fn);
  }, []);

  // Desktop keyboard shortcuts — skipped while typing (except Esc, which blurs).
  useEffect(() => {
    const onKey = (e) => {
      const el = document.activeElement;
      const typing = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
      if (e.key === "Escape") {
        if (typing) { el.blur(); return; }
        if (lightbox) return setLightbox(null);
        if (moreOpen) return setMoreOpen(false);
        if (tagOpen) return setTagOpen(false);
        if (showCustomize) return setShowCustomize(false);
        if (celebrate) return setCelebrate(null);
        if (rewind) return setRewind(null);
        return;
      }
      if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "/") {
        e.preventDefault();
        setView("journal");
        setTimeout(() => { const s = document.getElementById("xo-journal-search"); if (s) s.focus(); }, 30);
      } else if (e.key === "n") {
        e.preventDefault();
        setView("journal");
        setTimeout(() => { textareaRef.current && textareaRef.current.focus(); }, 30);
      } else if (e.key >= "1" && e.key <= "5") {
        e.preventDefault();
        setView(["journal", "schedule", "goals", "ask", "insights"][Number(e.key) - 1]);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [lightbox, moreOpen, tagOpen, showCustomize, celebrate, rewind]);

  // ----- the AI's name (declared early: render-time helpers below depend on it) -----
  const aiName = String(settings.aiName || "").trim();
  const aiLabel = aiName || "AI";
  // "@ai …" always works; if you've named it, "<name>, …" works too
  const askRe = new RegExp("^(@ai\\b|hey ai\\b|ai[,:]" + (aiName ? "|@?" + escapeRe(aiName) + "\\b[,:]?" : "") + ")\\s*", "i");
  const aiIdentity = aiName
    ? `Your name is ${aiName}. They may address you as ${aiName} — answer to it naturally, and never mention being an AI model or assistant.`
    : "";
  // Web search is on by default; set it to false in Customize to turn it off.
  const webSearch = settings.webSearch !== false;
  // Mirrors the AI data-sharing consent so the Customize switch stays in sync with the gate.
  const [aiConsent, setAiConsentView] = useState(getAIConsent());
  useEffect(() => {
    const on = () => setAiConsentView(getAIConsent());
    window.addEventListener("lucid-ai-consent", on);
    return () => window.removeEventListener("lucid-ai-consent", on);
  }, []);

  const updateSettings = (patch) => {
    setSettings((prev) => {
      const next = { ...prev, ...patch };
      saveJSON(SETTINGS_KEY, next);
      return next;
    });
  };

  // ----- reminders / push notifications -----
  const [pushMsg, setPushMsg] = useState("");
  const [pushBusy, setPushBusy] = useState(false);
  const toggleReminders = async (on) => {
    setPushBusy(true); setPushMsg("");
    if (on) {
      const err = await enablePush(settings.reminderTime || "20:00");
      if (err) { setPushMsg(err); setPushBusy(false); return; }
      updateSettings({ remindersOn: true });
    } else {
      await disablePush();
      updateSettings({ remindersOn: false });
    }
    setPushBusy(false);
  };
  // when reminders are on and the nudge time changes, re-register so the server
  // gets the new time (and refreshes this device's timezone while we're at it)
  const changeReminderTime = async (t) => {
    updateSettings({ reminderTime: t });
    if (settings.remindersOn) { setPushBusy(true); await enablePush(t); setPushBusy(false); }
  };
  // Reminders default ON, so this device registers itself with no trip to
  // settings. Apple still requires the permission prompt to come from a real
  // user gesture, so we piggy-back on the FIRST tap/keypress anywhere in the app
  // (tapping the textarea, switching tabs, etc). The user never hunts for a
  // switch — the OS "Allow?" popup just appears the moment they start using it.
  // (Tapping "Allow" on that system popup is Apple's own step; nothing can skip it.)
  const autoPushRef = useRef(false);
  useEffect(() => {
    if (!loaded || autoPushRef.current) return;
    autoPushRef.current = true;
    if (!settings.remindersOn) return;
    // Native iOS app: register through APNs (no service worker, no gesture rule).
    if (isNativeApp()) {
      enablePush(settings.reminderTime || "20:00").then((err) => { if (err) setPushMsg(err); });
      return;
    }
    if (!pushSupported()) return;
    if (Notification.permission === "denied") return;
    if (Notification.permission === "granted") {
      enablePush(settings.reminderTime || "20:00"); // already allowed: silent re-register
      return;
    }
    const onFirst = () => {
      document.removeEventListener("pointerdown", onFirst, true);
      document.removeEventListener("keydown", onFirst, true);
      // must call requestPermission synchronously inside the gesture (iOS rule)
      enablePush(settings.reminderTime || "20:00").then((err) => {
        if (err && Notification.permission === "denied") setPushMsg(err);
      });
    };
    document.addEventListener("pointerdown", onFirst, true);
    document.addEventListener("keydown", onFirst, true);
    return () => {
      document.removeEventListener("pointerdown", onFirst, true);
      document.removeEventListener("keydown", onFirst, true);
    };
  }, [loaded]);

  // ----- owner-only member stats (who's writing, never what) -----
  const [isAdmin, setIsAdmin] = useState(false);
  const [adminData, setAdminData] = useState(null);
  const [adminBusy, setAdminBusy] = useState(false);
  const loadMembers = async () => {
    setAdminBusy(true);
    try {
      const token = window.__session && window.__session.access_token;
      const r = await fetch(API_BASE + "/api/admin", { headers: { Authorization: "Bearer " + token } });
      if (r.ok) setAdminData(await r.json());
    } catch (e) { /* ignore */ }
    setAdminBusy(false);
  };
  // probe once on load: only the owner's account gets the Members tab
  useEffect(() => {
    if (!loaded) return;
    const token = window.__session && window.__session.access_token;
    if (!token) return;
    fetch(API_BASE + "/api/admin?probe=1", { headers: { Authorization: "Bearer " + token } })
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => { if (d && d.admin) setIsAdmin(true); })
      .catch(() => {});
  }, [loaded]);

  // ----- welcome-back note (every open; the ↻ button re-rolls it) -----
  const genWelcome = () => {
    const vibe = buildVibeProfile(days);
    if (vibe.count === 0) {
      // No entries yet to riff on — generate a fresh, never-repeating prompt.
      // Falls back to the static list if the AI is unreachable (offline).
      setWelcomeBusy(true);
      (async () => {
        try { setWelcome(await genFreshPrompt()); }
        catch (e) { setWelcome(STARTER_PROMPTS[Math.floor(Math.random() * STARTER_PROMPTS.length)]); }
        finally { setWelcomeBusy(false); }
      })();
      return;
    }
    // how long they've been away
    const today = dayKey();
    const sortedKeys = Object.keys(days).sort();
    const lastKey = sortedKeys[sortedKeys.length - 1];
    let awayText = "for a little while";
    if (lastKey === today) awayText = "since earlier today";
    else if (lastKey) {
      const [y, m, d] = lastKey.split("-").map(Number);
      const daysAway = Math.max(1, Math.round((Date.now() - new Date(y, m - 1, d).getTime()) / 86400000));
      awayText = daysAway <= 1 ? "since yesterday" : `for ${daysAway} days`;
    }
    const digest = buildDigest(days, 10, 420, 7000);
    const tone = recentTone(days);
    const pctx = buildPromptContext(days);
    const recentP = promptHistory().slice(-8);

    // Follow up on things THEY chose to put in the app — goals + calendar.
    // Only their own words/plans, never inferred behaviour.
    const ctxBits = [];
    const soonKey = dayKey(new Date(Date.now() + 2 * 86400000));
    const pastKey = dayKey(new Date(Date.now() - 3 * 86400000));
    const justHad = (sched || []).filter((s) => s.date && s.date < today && s.date >= pastKey).map((s) => s.title).filter(Boolean);
    const comingUp = (sched || []).filter((s) => s.date && s.date >= today && s.date <= soonKey && !s.done)
      .map((s) => s.title + (s.date === today ? " (today)" : "")).filter(Boolean);
    const activeGoals = (goals || []).filter((g) => !g.done && g.text).slice(0, 3).map((g) => g.text);
    if (justHad.length) ctxBits.push("On their calendar just now: " + justHad.join("; ") + " — you may gently ask how it went.");
    if (comingUp.length) ctxBits.push("Coming up for them: " + comingUp.join("; ") + " — you may ask how they're feeling going in.");
    if (activeGoals.length) ctxBits.push("Goals they set for themselves: " + activeGoals.join("; ") + ".");
    const focus = Array.isArray(settings.focus) && settings.focus.length
      ? `They've asked you to nudge them on: ${settings.focus.join(", ")}. Lean that way if it fits naturally — never force it.` : "";

    const userId = (window.__session && window.__session.user && window.__session.user.id) || "local";
    const angleIdx = pickAngle(userId);
    shownAngleRef.current = angleIdx;
    bumpAngle(userId, angleIdx, "shown");

    setWelcomeBusy(true);

  const allTagRows = Object.entries(allTopics).sort((a, b) => b[1] - a[1]);
  // dropdown list: favourites pinned to the top, then most-used, filtered by the menu's search box
  const menuTags = (() => {
    const q2 = tagQuery.trim().toLowerCase();
    const rows = allTagRows.filter(([t]) => !q2 || t.toLowerCase().includes(q2));
    return [...rows.filter(([t]) => favTags.includes(t)), ...rows.filter(([t]) => !favTags.includes(t))];
  })();

  const q = query.trim().toLowerCase();
  const jfOn = jfActive(jf);
  const segMatches = (seg) => {
    const topicOk = !topicFilter || segTags(seg).some((t) => t.toLowerCase() === topicFilter.toLowerCase());
    const textOk = !q || itemPlainText(seg).toLowerCase().includes(q);
    const favOk = !favFilter || seg.fav;
    const moodOk = !jf.emotions.length || jf.emotions.includes((seg.emotion || "neutral").toLowerCase());
    const photoOk = !jf.photos || seg.type === "image";
    return topicOk && textOk && favOk && moodOk && photoOk;
  };
  const filteredDays = dayKeys
    .filter((k) => (!jf.from || k >= jf.from) && (!jf.to || k <= jf.to))
    .map((k) => {
      const entries = (days[k].entries || []).filter((en) => (en.segments || []).some(segMatches));
      return { key: k, entries };
    })
    .filter((d) => d.entries.length > 0);

  // on this day
  const now = new Date();
  const monthAgo = new Date(now); monthAgo.setMonth(now.getMonth() - 1);
  const yearAgo = new Date(now); yearAgo.setFullYear(now.getFullYear() - 1);
  const otd = [
    { label: "One month ago", key: dayKey(monthAgo) },
    { label: "One year ago", key: dayKey(yearAgo) },
  ].filter((o) => days[o.key]);

  // mood calendar (last 35 days)
  const domEmotions = dominantEmotionByDay(days);
  const calCells = [];
  for (let i = 34; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    calCells.push({ key: k, emotion: domEmotions[k] || null });
  }
  const streakInfo = computeStreakInfo(days, settings.streakFreeze !== false);
  const entryFont = ["serif", "hand", "type"].includes(settings.entryFont) ? settings.entryFont : "sans";
  const entryPaper = ["lined", "dots"].includes(settings.entryPaper) ? settings.entryPaper : "none";
  const streak = streakInfo.streak;

  let totalNotes = 0;
  eachSegment(days, () => totalNotes++);
  const weekTally = {};
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    for (const en of (days[dayKey(d)] && days[dayKey(d)].entries) || []) {
      for (const s of en.segments || []) {
        const mm = (s.emotion || "neutral").toLowerCase();
        weekTally[mm] = (weekTally[mm] || 0) + 1;
      }
    }
  }
  const weekMoodTop = Object.entries(weekTally).sort((a, b) => b[1] - a[1])[0];
  const weekMood = weekMoodTop ? emotionOf(weekMoodTop[0]) : null;
  const calPadStart = (() => { const d = new Date(); d.setDate(d.getDate() - 34); return d.getDay(); })();

  const last7 = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k2 = dayKey(d);
    let n = 0;
    for (const en of (days[k2] && days[k2].entries) || []) n += (en.segments || []).length;
    last7.push({ key: k2, n, lbl: ["S", "M", "T", "W", "T", "F", "S"][d.getDay()] });
  }
  const week7max = Math.max(1, ...last7.map((x) => x.n));
  const notes7 = last7.reduce((s, x) => s + x.n, 0);
  const moodTallyAll = {};
  eachSegment(days, (k2, en, sg) => { const mm = (sg.emotion || "neutral").toLowerCase(); moodTallyAll[mm] = (moodTallyAll[mm] || 0) + 1; });
  const moodMix = Object.entries(moodTallyAll).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const moodMixMax = moodMix.length ? moodMix[0][1] : 1;
  const topicRows = Object.entries(allTopics).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const topicMax = topicRows.length ? topicRows[0][1] : 1;
  const allPhotos = [];
  for (const k of dayKeys) {
    for (const en of days[k].entries || []) {
      for (const s of en.segments || []) {
        if (s.type === "image" && s.imgKey) allPhotos.push({ imgKey: s.imgKey, day: k, time: s.time || en.time || "" });
      }
    }
  }
  const recentPhotos = allPhotos.slice(0, 6).map((p) => p.imgKey);
  let anyFav = false;
  eachSegment(days, (k2, en, sg) => { if (sg.fav) anyFav = true; });

  // ----- schedule grouping -----
  const todayKey = dayKey();
  const tomorrowKey = dayKey(new Date(Date.now() + 86400000));
  const schedSorted = [...sched].sort((a, b) => (a.date + (a.time || "99:99")).localeCompare(b.date + (b.time || "99:99")));
  const schedOpen = schedSorted.filter((s) => !s.done);
  const schedOpenCount = schedOpen.filter((s) => s.date <= todayKey).length;
  const schedGroups = [
    { key: "overdue", label: "Overdue", items: schedOpen.filter((s) => s.date < todayKey) },
    { key: "today", label: "Today", items: schedOpen.filter((s) => s.date === todayKey) },
    { key: "tomorrow", label: "Tomorrow", items: schedOpen.filter((s) => s.date === tomorrowKey) },
    { key: "upcoming", label: "Upcoming", items: schedOpen.filter((s) => s.date > tomorrowKey) },
    { key: "done", label: "Done", items: schedSorted.filter((s) => s.done) },
  ].filter((g) => g.items.length > 0);

  // Sidebar panels as data, so they can be reordered / collapsed / hidden on desktop.
  const sidePanels = [
    {
      id: "mood", title: "Mood — last 5 weeks", show: true,
      body: (
        <>
          <div className="xo-minical">
            {["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"].map((h) => <div className="mh" key={h}>{h}</div>)}
            {Array.from({ length: calPadStart }).map((_, i) => <div className="xo-mc dim" key={"pad" + i} />)}
            {calCells.map((c) => {
              const e = c.emotion ? emotionOf(c.emotion) : null;
              return (
                <div
                  key={c.key}
                  className="xo-mc"
                  title={prettyDate(c.key, true) + (c.emotion ? " — " + emotionOf(c.emotion).label : "")}
                  style={e ? { background: e.bg, borderColor: e.dot } : undefined}
                />
              );
            })}
          </div>
          <p className="xo-note" style={{ marginTop: 10, marginBottom: 0 }}>Each square is a day, colored by its dominant mood.</p>
        </>
      ),
    },
    {
      id: "week", title: "This week", show: hasEntries,
      body: (
        <>
          <div className="xo-weekbars">
            {last7.map((d) => (
              <div className="wb" key={d.key} title={prettyDate(d.key, true) + " — " + d.n + " note" + (d.n === 1 ? "" : "s")}>
                <div className="wbtrack"><div className="wbfill" style={{ height: Math.round(d.n / week7max * 100) + "%", opacity: d.n ? 1 : 0 }} /></div>
                <span>{d.lbl}</span>
              </div>
            ))}
          </div>
          <p className="xo-note" style={{ marginTop: 10, marginBottom: 0 }}>{notes7} note{notes7 === 1 ? "" : "s"} in the last 7 days</p>
        </>
      ),
    },
    {
      id: "moodmix", title: "Mood mix", show: moodMix.length > 0,
      body: moodMix.map(([m, n]) => {
        const e = emotionOf(m);
        return (
          <div className="xo-statrow" key={m}>
            <span className="name" style={{ color: e.text }}>{e.label}</span>
            <span className="bar"><span className="fill" style={{ width: Math.round(n / moodMixMax * 100) + "%", background: e.dot }} /></span>
            <span className="n">{n}</span>
          </div>
        );
      }),
    },
    {
      id: "rewind", title: "Rewind" + (rewind && rewind.seg.fav ? " ★" : ""), show: !!rewind,
      body: rewind ? (
        <>
          <p className="xo-note" style={{ marginBottom: 8 }}>
            {prettyDate(rewind.day)}{segTags(rewind.seg).length ? " · " + segTags(rewind.seg).join(" · ") : ""}
          </p>
          <div className="xo-rewindtext">
            {snippet(itemPlainText(rewind.seg), 280)}
          </div>
          <div className="xo-panel-row" style={{ marginTop: 10 }}>
            <button className="xo-panel-btn" onClick={() => setRewind(pickRewind(days))}>Show another</button>
          </div>
        </>
      ) : null,
    },
    {
      id: "photos", title: "Recent photos", show: recentPhotos.length > 0,
      body: <div className="xo-photostrip">{recentPhotos.map((pk) => <StoredImage key={pk} imgKey={pk} />)}</div>,
    },
    {
      id: "topics", title: "Top topics", show: topicRows.length > 0,
      body: topicRows.map(([t, n]) => (
        <div
          className="xo-statrow click"
          key={t}
          title="Filter by this tag"
          onClick={() => setTopicFilter(topicFilter.toLowerCase() === t.toLowerCase() ? "" : t)}
        >
          <span className="name">{t}</span>
          <span className="bar"><span className="fill" style={{ width: Math.round(n / topicMax * 100) + "%", background: "var(--accent)" }} /></span>
          <span className="n">{n}</span>
        </div>
      )),
    },
    {
      id: "otd", title: "On this day", show: otd.length > 0,
      body: otd.map((o) => {
        const ens = days[o.key].entries || [];
        const allSegs = ens.flatMap((en) => en.segments || []);
        const topics = [...new Set(allSegs.flatMap(segTags))].slice(0, 2).join(", ");
        const first = allSegs.find((s) => !s.type || s.type === "text");
        return (
          <p className="xo-note" key={o.key} style={{ margin: "0 0 8px" }}>
            <b style={{ color: "var(--body)" }}>{o.label}</b> you wrote about <em style={{ color: "var(--accent)", fontStyle: "normal" }}>{topics || "your day"}</em>
            {first ? <> — "{snippet(first.text, 90)}"</> : null}
          </p>
        );
      }),
    },
  ];

  const showPromptCard =
    loaded && view === "journal" && (welcome || welcomeBusy);

  if (locked) return <LockScreen onUnlock={() => setLocked(false)} />;

  return (
    <div
      className={"xo-root sk-" + pack + " m-" + (settings.theme || "") + (entryFont !== "sans" ? " ef-on ef-" + entryFont : "") + (entryPaper !== "none" ? " ep-" + entryPaper : "")}
      style={{
        "--entryfont": ENTRY_FONTS[entryFont],
        "--accent": theme.accent,

        "--body": bgTheme.body,
        "--faint": bgTheme.faint,

        "--placeholder": bgTheme.placeholder,
      }}
    >

                   calc(clamp(16px, 4vw, 56px) + env(safe-area-inset-left, 0px));
        }
        .xo-root ::selection { background: var(--accent); color: var(--btn-text); }

        .xo-schednote, .xo-schedtitle, .xo-memory p, .xo-win p, .xo-goaltext,
        .xo-sub, .xo-promptcard, .xo-empty, .xo-note, .xo-sugtext,

        /* ---------- header ---------- */

        .xo-panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px; margin: 0 0 14px; transition: border-color .25s; }

        .xo-panel input[type="text"] { width: 100%; box-sizing: border-box; background: var(--inputbg); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); font: 13.5px var(--bodyfont); padding: 9px 12px; outline: none; caret-color: var(--accent); transition: border-color .2s; }

        .xo-danger { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,107,129,0.25); }

        .xo-wrapped-brand .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.7); }
        /* on this day + wins */
        .xo-memory { padding: 10px 0; border-bottom: 1px solid var(--line); }
        .xo-memory:last-child { border-bottom: none; }
        .xo-memory b { display: block; font: 600 10px var(--bodyfont); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
        .xo-memory p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--body); }
        .xo-wins { display: flex; flex-direction: column; gap: 11px; }
        .xo-win { display: flex; gap: 10px; }
        .xo-win .wdot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 99px; margin-top: 6px; }
        .xo-win p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--body); }
        .xo-win span { font: 500 10.5px var(--bodyfont); color: var(--faint); }
        .xo-winshare { background: none; border: none; padding: 0; color: var(--accent); font: 600 10.5px var(--bodyfont); cursor: pointer; }
        .xo-winshare:hover { text-decoration: underline; }
        /* wrapped card reveal */
        .xo-wrapped { animation: xo-rise .55s cubic-bezier(.2,.7,.2,1) both; }
        @keyframes xo-rise { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
        /* milestone celebration */
        .xo-celebrate { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center;
          background: rgba(4,6,8,0.72); backdrop-filter: blur(6px); animation: xo-fade .3s ease both;
          padding: calc(20px + env(safe-area-inset-top,0)) 20px calc(20px + env(safe-area-inset-bottom,0)); }
        @keyframes xo-fade { from { opacity: 0; } to { opacity: 1; } }
        .xo-celebrate-card { position: relative; width: 100%; max-width: 380px; text-align: center; padding: 44px 30px;
          border-radius: 26px; border: 1px solid rgba(var(--accent-rgb),0.4); overflow: hidden;
          background: radial-gradient(120% 90% at 50% 0%, rgba(var(--accent-rgb),0.18), transparent 60%), var(--card);
          animation: xo-pop .5s cubic-bezier(.2,.9,.3,1.2) both; }
        @keyframes xo-pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
        .xo-celebrate-card .ring { position: absolute; top: 40px; left: 50%; width: 120px; height: 120px; margin-left: -60px;
          border: 2px solid var(--accent); border-radius: 999px; opacity: 0; transform: scale(.4); }
        .xo-celebrate-card .r1 { animation: xo-ring 2.4s ease-out .1s infinite; }
        .xo-celebrate-card .r2 { animation: xo-ring 2.4s ease-out .7s infinite; }
        .xo-celebrate-card .r3 { animation: xo-ring 2.4s ease-out 1.3s infinite; }
        @keyframes xo-ring { 0% { opacity: .55; transform: scale(.4); } 80% { opacity: 0; transform: scale(2.4); } 100% { opacity: 0; } }
        .xo-cel-num { position: relative; font: 700 96px var(--disp); color: var(--accent); line-height: 1;
          text-shadow: 0 0 18px rgba(var(--accent-rgb),0.35); animation: xo-num .6s cubic-bezier(.2,.9,.3,1.3) both; }
        @keyframes xo-num { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }
        .xo-cel-lbl { font: 600 13px var(--bodyfont); letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); margin-top: 6px; }
        .xo-cel-msg { font: 400 15px/1.55 var(--bodyfont); color: var(--body); margin: 18px 0 24px; }
        .xo-cel-btns { display: flex; flex-direction: column; gap: 10px; }
        .xo-cel-share { padding: 14px; border: none; border-radius: 12px; background: var(--accent); color: var(--btn-text);
          font: 600 15px var(--bodyfont); cursor: pointer; }
        .xo-cel-done { padding: 12px; border: none; background: none; color: var(--faint); font: 500 14px var(--bodyfont); cursor: pointer; }
        @media (prefers-reduced-motion: reduce) { .xo-celebrate-card .ring { display: none; } .xo-wrapped, .xo-celebrate-card, .xo-cel-num { animation: none; } }

        .xo-promptcard { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 14px; padding: 14px 18px; margin: 0 0 14px; color: var(--body); font-size: 13.5px; line-height: 1.6; transition: transform .2s; }

        .xo-promptcard b { display: block; font: 600 10px var(--bodyfont); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

        /* ---------- search + topics ---------- */
        .xo-searchrow { display: flex; gap: 10px; margin: 0 0 10px; }
        .xo-search { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; color: var(--ink); font: 13.5px var(--bodyfont); outline: none; caret-color: var(--accent); transition: border-color .2s; }

        .xo-search::placeholder { color: var(--placeholder); }
        .xo-topicchips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .xo-topicchip { border: 1px solid var(--line); background: var(--card); color: var(--faint); font: 500 12px var(--bodyfont); padding: 5px 12px; border-radius: 99px; cursor: pointer; transition: all .2s; }
        .xo-topicchip:hover { color: var(--ink); }
        .xo-topicchip.on { color: var(--accent); border-color: rgba(var(--accent-rgb), 0.45); background: var(--soft); }

        /* ---------- composer ---------- */
        .xo-composer { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin: 0 0 14px; transition: border-color .25s; }
        .xo-composer:focus-within { border-color: rgba(var(--accent-rgb), 0.55); }
        .xo-composer textarea { width: 100%; border: none; outline: none; resize: vertical; min-height: 92px; font: 14.5px/1.6 var(--bodyfont); color: var(--ink); background: transparent; box-sizing: border-box; caret-color: var(--accent); }
        .xo-composer textarea::placeholder { color: var(--placeholder); }

        .xo-pending { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .xo-thumb { position: relative; }
        .xo-thumb img { height: 64px; width: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--dash); display: block; }
        .xo-thumb button { position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%; border: none; background: var(--card); color: #ff6b81; font-size: 12px; line-height: 1; cursor: pointer; box-shadow: 0 0 0 1px var(--line); }

        .xo-composer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
        .xo-hint { color: var(--faint); font-size: 12px; flex: 1; min-width: 160px; }
        .xo-btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .xo-attach, .xo-mic, .xo-ask { background: transparent; border: 1px solid var(--dash); color: var(--faint); font: 500 12.5px var(--bodyfont); padding: 9px 15px; border-radius: 99px; cursor: pointer; transition: all .2s; }
        .xo-attach:hover:not(:disabled), .xo-mic:hover:not(:disabled), .xo-ask:hover:not(:disabled) { color: var(--ink); border-color: var(--faint); transform: translateY(-1px); }
        .xo-mic.live { background: var(--accent); border-color: var(--accent); color: var(--btn-text); font-weight: 600; animation: xopulse 1.4s infinite; }
        @media (prefers-reduced-motion: reduce) { .xo-mic.live { animation: none; } }
        .xo-attach:focus-visible, .xo-mic:focus-visible, .xo-ask:focus-visible, .xo-add:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .xo-add { background: var(--accent); border: 1px solid var(--accent); color: var(--btn-text); font: 600 12.5px var(--bodyfont); padding: 10px 18px; border-radius: 99px; cursor: pointer; transition: all .2s; }
        .xo-add:hover:not(:disabled) { box-shadow: 0 4px 24px rgba(var(--accent-rgb), 0.35); transform: translateY(-1px); }
        .xo-ask:disabled, .xo-attach:disabled, .xo-mic:disabled, .xo-add:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }
        .xo-error { color: #ff6b81; font-size: 13px; margin-top: 10px; }

        /* ---------- day cards ---------- */
        .xo-daycard { background: var(--card); border: 1px solid var(--line); border-radius: 20px; margin-bottom: 14px; overflow: hidden; transition: border-color .25s; }
        .xo-daycard:hover { border-color: var(--dash); }

        .xo-chev { color: var(--faint); font-size: 10px; transition: transform .25s; }

        .xo-daycount { color: var(--faint); font-size: 12px; white-space: nowrap; }

        @media (prefers-reduced-motion: reduce) { .xo-daybody { animation: none; } }

        .xo-section { background: var(--inputbg); border: 1px solid var(--line); border-left: 3px solid rgba(var(--accent-rgb), 0.55); border-radius: 14px; padding: 13px 15px; margin-bottom: 10px; }

        .xo-flow { display: flex; flex-direction: column; gap: 2px; }

          cursor: pointer; white-space: nowrap; transition: all .15s; }

        .xo-tag:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
        .xo-chip { display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px var(--bodyfont); padding: 3px 10px; border-radius: 99px; }
        .xo-chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

        .xo-act { border: none; background: none; color: var(--faint); cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 6px; }

        .xo-editbox textarea { width: 100%; box-sizing: border-box; background: var(--card); border: 1px solid rgba(var(--accent-rgb), 0.45); border-radius: 10px; color: var(--ink); font: 14px/1.5 var(--bodyfont); padding: 8px 10px; outline: none; resize: vertical; min-height: 60px; caret-color: var(--accent); }
        .xo-editrow { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        .xo-link { color: var(--accent); text-decoration: none; border-bottom: 1px dotted rgba(var(--accent-rgb), 0.6); word-break: break-all; }

        .xo-qa .xo-q { font-weight: 600; color: var(--strong); margin: 0 0 6px; }
        .xo-qa .xo-a, .xo-recap { margin: 0; padding: 10px 12px; border-radius: 10px; background: rgba(var(--accent-rgb), 0.07); border: 1px solid rgba(var(--accent-rgb), 0.25); white-space: pre-wrap; }
        .xo-aibadge { display: inline-block; font: 600 9.5px var(--bodyfont); letter-spacing: 0.12em; color: var(--btn-text); background: var(--accent); border-radius: 4px; padding: 2px 6px; margin-right: 8px; vertical-align: 1px; }

        /* ---------- trash ---------- */
        .xo-wallpost { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; transition: border-color .25s; }
        .xo-wallpost:hover { border-color: var(--dash); }

        .xo-walldate { color: var(--faint); font-size: 12px; }
        .xo-wallnote { color: var(--faint); font-size: 12.5px; margin: 2px 0 16px; line-height: 1.6; }

        @keyframes xospin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .xo-spin { animation: none; } }

        /* ================= THEME STYLE PACKS — fonts + layout follow the chosen theme ================= */
        /* clean (default / custom colors): base --disp Space Grotesk + --bodyfont Inter, unchanged */

        /* serif — Trilogy: editorial, elegant */
        .xo-root.sk-serif { --disp: 'Playfair Display', Georgia, serif; }
        .sk-serif .xo-title { letter-spacing: 0; font-weight: 700; }
        .sk-serif .xo-panel, .sk-serif .xo-composer, .sk-serif .xo-daycard, .sk-serif .xo-kpi, .sk-serif .xo-goal { border-radius: 22px; }
        .sk-serif .xo-dayhead h2 { font-style: italic; }

        /* chrome — Starboy: futurism from tracking, not letterforms */
        .xo-root.sk-chrome { --disp: 'Space Grotesk', 'Inter', sans-serif; }
        .sk-chrome .xo-title { text-transform: uppercase; letter-spacing: 0.16em; font-weight: 600; font-size: 16px; }
        .sk-chrome .xo-panel h3 { letter-spacing: 0.04em; }

        /* soft — Melancholy: quiet serif display */
        .xo-root.sk-soft { --disp: 'Cormorant Garamond', Georgia, serif; }
        .sk-soft .xo-title { letter-spacing: 0; font-weight: 600; font-size: 24px; }
        .sk-soft .xo-kpi .val { font-size: 32px; font-weight: 700; }
        .sk-soft .xo-kpi.hero .val { font-size: 48px; }
        .sk-soft .xo-panel h3, .sk-soft .xo-dayhead h2 { font-weight: 600; font-size: 17px; letter-spacing: 0; }

        /* retro — Dawn FM: rounded broadcast (soft radii are the signature) */
        .xo-root.sk-retro { --disp: 'Space Grotesk', 'Inter', sans-serif; }
        .sk-retro .xo-title { letter-spacing: 0.08em; font-weight: 500; }

        .xo-root.sk-neon .xo-panel h3, .xo-root.sk-neon .xo-subhead, .xo-root.sk-neon .xo-dayhead h2, .xo-root.sk-neon .xo-empty strong { font-family: 'Space Grotesk', sans-serif; font-weight: 600; letter-spacing: 0.11em; text-transform: uppercase; }
        .xo-root.sk-neon .xo-panel h3, .xo-root.sk-neon .xo-subhead, .xo-root.sk-neon .xo-dayhead h2 { font-size: 12.5px; }

        /* ================= PHONE OPTIMIZATION (any skin) ================= */

          .xo-btns { width: 100%; justify-content: space-between; gap: 6px; }

          .xo-topicchips::-webkit-scrollbar { display: none; }

          .xo-segacts { opacity: 1; gap: 0; }
          .xo-act { padding: 3px; font-size: 15px; }

          .xo-kpi:hover, .xo-panel:hover, .xo-daycard:hover, .xo-goal:hover, .xo-wallpost:hover { transform: none; }
          .xo-gear:hover, .xo-panel-btn:hover, .xo-preset:hover, .xo-add:hover, .xo-attach:hover, .xo-mic:hover, .xo-ask:hover { transform: none; }
        }

        /* ================= DESKTOP REFINEMENTS (phone layout untouched) ================= */
        @media (min-width: 701px) {
          /* header stays reachable while scrolling a long journal */
          /* the safe-area pad keeps the title below the iPad status bar once the

          .xo-top {
            position: sticky; top: 0; z-index: 30;
            padding: calc(14px + env(safe-area-inset-top, 0px)) 0 12px; margin-bottom: 10px;
            margin-top: calc(-1 * env(safe-area-inset-top, 0px));
            background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 92%, transparent) 58%, transparent);
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
          }

          /* the writing box is the main event */
          .xo-composer { padding: 20px; }

          .xo-segmain { font-size: 14.5px; }
          .xo-daycard:hover { border-color: rgba(var(--accent-rgb), 0.3); }

        /* ================= TABLET / iPad (701–1024px) ================= */
        @media (min-width: 701px) and (max-width: 1024px) {
          .xo-root { padding: calc(20px + env(safe-area-inset-top, 0px))
                              calc(22px + env(safe-area-inset-right, 0px))

                              calc(22px + env(safe-area-inset-left, 0px)); }

          .xo-gear:hover, .xo-panel-btn:hover, .xo-preset:hover, .xo-add:hover, .xo-attach:hover,

        /* ================= SIDEBAR STATS ================= */
        .xo-weekbars { display: flex; gap: 6px; height: 92px; }

        .xo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .xo-galtile { aspect-ratio: 1; width: 100%; height: 100%; object-fit: cover; border-radius: 14px; border: 1px solid var(--line); background: var(--inputbg); cursor: zoom-in; display: block; transition: transform .18s, border-color .18s; }

                <div className="xo-sugs">

                    <div className="xo-sug" key={i}>
                      <div className="xo-sugtext">
                        <b>{sg.goal}</b>
                        <span>{sg.why}</span>
                      </div>
                      <button className="xo-panel-btn" onClick={() => { addGoal(sg.goal, "ai"); setGoalSugs(goalSugs.filter((_, j) => j !== i)); }}>

                    </div>
                  ))}
                </div>

              {error && view === "goals" && <div className="xo-error">{error}</div>}
            </div>

            {goals.length === 0 && (
              <div className="xo-empty">
                <strong>No goals yet.</strong>
                Add one above, or let the AI read your entries and suggest where to grow.
              </div>
            )}

            {goals.filter((g) => !g.done).map((g) => {
              const today = dayKey();
              const doneToday = g.checkins.includes(today);
              return (
                <div className="xo-goal" key={g.id}>
                  <div className="xo-goaltop">
                    <span className="xo-goaltext">{g.text}</span>
                    {g.from === "ai" && <span className="xo-aibadge" title="Suggested by the AI">AI</span>}

                  <div className="xo-goalmeta">
                    <span className="xo-goalweek">
                      {goalWeek(g).map((c) => (
                        <i key={c.key} className={c.hit ? "hit" : ""} title={prettyDate(c.key, true)} />

                    </span>
                    <span className="xo-goalstats">{weekCount(g)}/7 this week · {g.checkins.length} total</span>
                  </div>
                  <div className="xo-editrow" style={{ marginTop: 10 }}>
                    <button className="save" onClick={() => checkInGoal(g.id)} disabled={doneToday}>
