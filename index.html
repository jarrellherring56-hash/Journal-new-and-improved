// ---------- push notification helpers ----------
const urlB64ToUint8 = (b64) => {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const s = (b64 + pad).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(s);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
};
const pushSupported = () =>
  "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

// Subscribe this device and tell the server (endpoint + timezone + nudge time).
// Running inside the native iOS app (Capacitor) rather than a browser/PWA?
const isNativeApp = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
// Ask iOS for permission and get an APNs device token via the Capacitor plugin.
async function nativePushToken() {
  const PN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
  if (!PN) return { error: "Notifications aren't available in this build." };
  const perm = await PN.requestPermissions();
  if (perm.receive !== "granted") return { error: "Notifications are off — turn them on in Settings → Journal → Notifications." };
  return await new Promise((resolve) => {
    let done = false;
    PN.addListener("registration", (t) => { if (!done) { done = true; try { localStorage.setItem("daybook:apns", t.value); } catch (e) {} resolve({ token: t.value }); } });
    PN.addListener("registrationError", () => { if (!done) { done = true; resolve({ error: "Couldn't register this device for notifications." }); } });
    PN.register();
    setTimeout(() => { if (!done) { done = true; resolve({ error: "Notification registration timed out — try again." }); } }, 15000);
  });
}

// Returns an error string, or "" on success.
async function enablePush(reminderTime) {
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
  const token = window.__session && window.__session.access_token;
  const save = async (subscription) => {
    const r = await fetch(API_BASE + "/api/push", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ subscription, tz, reminderTime }),
    });
    if (!r.ok) { const d = await r.json().catch(() => ({})); return d.error || "Could not turn on reminders."; }
    return "";
  };
  if (isNativeApp()) {
    const res = await nativePushToken();
    if (res.error) return res.error;
    return await save({ endpoint: res.token, platform: "ios", token: res.token });
  }
  if (!pushSupported()) return "This device can't do notifications. On iPhone, add the app to your Home Screen first.";
  const perm = await Notification.requestPermission();
  if (perm === "denied") return "Notifications are blocked — allow them in your phone/browser settings.";
  if (perm !== "granted") return "Tap Reminders → On to allow notifications on this device.";
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8(VAPID_PUBLIC),
    });
  }
  return await save(sub);
}

async function disablePush() {
  const token = window.__session && window.__session.access_token;
  const del = (subscription) => fetch(API_BASE + "/api/push", {
    method: "DELETE",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: JSON.stringify({ subscription }),
  }).catch(() => {});
  try {
    if (isNativeApp()) {
      let t = ""; try { t = localStorage.getItem("daybook:apns") || ""; } catch (e) {}
      if (t) await del({ endpoint: t });
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) { await del(sub); await sub.unsubscribe().catch(() => {}); }
  } catch (e) { /* best effort */ }
}

// ---------- privacy lock (per-device, stores only a hash) ----------
const PIN_KEY = "daybook:pin:v1";
async function hashPin(pin) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("daybook:" + pin));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

// ---------- rewind: resurface a random past note (starred ones get a boost) ----------
function pickRewind(days) {
  const today = dayKey();
  const pool = [];
  for (const k of Object.keys(days)) {
    if (k === today) continue;
    for (const en of days[k].entries || []) {
      for (const s of en.segments || []) {
        if ((!s.type || s.type === "text" || s.type === "qa") && s.topic !== "Check-in") pool.push({ day: k, seg: s });
      }
    }
  }
  if (!pool.length) return null;
  const favs = pool.filter((p) => p.seg.fav);
  const src = favs.length && Math.random() < 0.5 ? favs : pool;
  return src[Math.floor(Math.random() * src.length)];
}

// ---------- date helpers ----------
const dayKey = (d = new Date()) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
};
const prettyDate = (key, short = false) => {
  const [y, m, d] = key.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  if (short) return date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const today = dayKey();
  const yest = dayKey(new Date(Date.now() - 86400000));
  const base = date.toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric",
    year: y !== new Date().getFullYear() ? "numeric" : undefined,
  });
  if (key === today) return `Today — ${base}`;
  if (key === yest) return `Yesterday — ${base}`;
  return base;
};

// ---------- image compression ----------
function compressImage(file) {
  // Decode straight from the file via an object URL: a full-res camera shot as a
  // base64 data URL is tens of MB of string, which strains iPad webview memory.
  return new Promise((resolve, reject) => {
    let url = "";
    try { url = URL.createObjectURL(file); } catch (e) { url = ""; }
    const img = new Image();
    img.onload = () => {
      try {
        const max = 1000;
        let { width, height } = img;
        if (width > max || height > max) {
          const s = Math.min(max / width, max / height);
          width = Math.round(width * s);
          height = Math.round(height * s);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      } catch (e) {
        reject(new Error("Couldn't read image"));
      } finally {
        if (url) URL.revokeObjectURL(url);
      }
    };
    img.onerror = () => { if (url) URL.revokeObjectURL(url); reject(new Error("Couldn't read image")); };
    if (url) { img.src = url; return; }
    const reader = new FileReader();
    reader.onload = () => { img.src = reader.result; };
    reader.onerror = () => reject(new Error("Couldn't read file"));
    reader.readAsDataURL(file);
  });
}

// ---------- long-entry handling ----------
const CHUNK_SIZE = 4000;
function splitIntoChunks(text, max = CHUNK_SIZE) {
  if (text.length <= max) return [text];
  const chunks = [];
  let current = "";
  const paragraphs = text.split(/\n{2,}/);
  const pieces = [];
  for (const p of paragraphs) {
    if (p.length <= max) pieces.push(p);
    else {
      // split on sentence ends without regex lookbehind (Safari-safe)
      const parts = p.split(/([.!?]+\s+)/);
      const sents = [];
      for (let i = 0; i < parts.length; i += 2) {
        const sent = (parts[i] || "") + (parts[i + 1] || "");
        if (sent) sents.push(sent);
      }
      let buf = "";
      for (const sent of sents) {
        if ((buf + sent).length > max && buf) { pieces.push(buf.trim()); buf = sent; }
        else buf += sent;
      }
      if (buf.trim()) pieces.push(buf.trim());
    }
  }
  for (const piece of pieces) {
    if ((current + "\n\n" + piece).length > max && current) {
      chunks.push(current);
      current = piece;
    } else {
      current = current ? current + "\n\n" + piece : piece;
    }
  }
  if (current) chunks.push(current);
  return chunks;
}

async function withRetry(fn, tries = 2) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try { return await fn(); }
    catch (e) { lastErr = e; }
  }
  throw lastErr;
}

async function classifyLongEntry(text, vibeText, existingTopics = [], ctx = "") {
  const chunks = splitIntoChunks(text);
  const allSegments = [];
  const topics = existingTopics.slice();
  let tagline = "";
  for (let i = 0; i < chunks.length; i++) {
    const chunk = chunks[i];
    const part = chunks.length > 1 ? "\nThis is part " + (i + 1) + " of " + chunks.length + " of one long entry. Keep tag spelling consistent with the earlier parts." : "";
    const result = await withRetry(() => classifyEntry(chunk, vibeText, topics, ctx + part));
    allSegments.push(...result.segments);
    // later parts reuse the tags earlier parts just created
    result.segments.forEach((s) => (s.tags || []).forEach((t) => { if (!topics.includes(t) && t !== "Unsorted") topics.push(t); }));
    if (result.tagline) tagline = result.tagline;
  }
  return { segments: allSegments, tagline };
}

// ---------- insights helpers ----------
function dominantEmotionByDay(days) {
  const out = {};
  for (const k of Object.keys(days)) {
    const tally = {};
    for (const entry of days[k].entries || []) {
      for (const seg of entry.segments || []) {
        const m = (seg.emotion || "neutral").toLowerCase();
        tally[m] = (tally[m] || 0) + 1;
      }
    }
    const best = Object.entries(tally).sort((a, b) => b[1] - a[1])[0];
    if (best) out[k] = best[0];
  }
  return out;
}
function computeStreak(days, freeze = true) {
  return computeStreakInfo(days, freeze).streak;
}
function buildDigest(days, numDays = 7, perEntry = 220, cap = 6000) {
  const keys = Object.keys(days).sort().slice(-numDays);
  let out = [];
  for (const k of keys) {
    for (const entry of days[k].entries || []) {
      const topics = [...new Set((entry.segments || []).flatMap(segTags))].join("/");
      const texts = (entry.segments || [])
        .filter((s) => !s.type || s.type === "text" || s.type === "qa")
        .map((s) => (s.type === "qa" ? s.q : s.text))
        .join(" | ")
        .slice(0, perEntry);
      if (texts) out.push(`${k} · ${topics}: ${texts}`);
    }
  }
  return out.join("\n").slice(0, cap);
}
function itemPlainText(item) {
  if (item.type === "qa") return `Q: ${item.q}\nA: ${item.a}`;
  if (item.type === "image") return "[photo]";
  return item.text || "";
}

// Compact month-by-month mood + theme summary across ALL history. Lets the AI
// answer time/mood questions ("when was I happiest this year?", "when was I most
// stressed?") without needing every entry's full text in the prompt.
function buildMoodTimeline(days) {
  const months = {};
  eachSegment(days, (k, entry, seg) => {
    const ym = k.slice(0, 7);
    const m = months[ym] || (months[ym] = { n: 0, val: 0, moods: {}, tags: {} });
    m.n++;
    const emo = (seg.emotion || "neutral").toLowerCase();
    m.moods[emo] = (m.moods[emo] || 0) + 1;
    m.val += (VALENCE[emo] || 0);
    for (const t of segTags(seg)) m.tags[t] = (m.tags[t] || 0) + 1;
  });
  const topKey = (obj) => (Object.entries(obj).sort((a, b) => b[1] - a[1])[0] || ["—"])[0];
  const topN = (obj, n) => Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, n).map(([kk]) => kk).join("/");
  return Object.keys(months).sort().map((ym) => {
    const m = months[ym];
    const avg = (m.val / m.n);
    return `${ym}: ${m.n} notes, mostly ${topKey(m.moods)}, avg mood ${avg >= 0 ? "+" : ""}${avg.toFixed(1)}, themes: ${topN(m.tags, 3) || "—"}`;
  }).join("\n");
}

// "On this day" — resurface what you wrote at the same point in earlier months/years.
function onThisDay(days) {
  const now = new Date();
  const offsets = [
    { label: "a month ago", d: new Date(now.getFullYear(), now.getMonth() - 1, now.getDate()) },
    { label: "three months ago", d: new Date(now.getFullYear(), now.getMonth() - 3, now.getDate()) },
    { label: "six months ago", d: new Date(now.getFullYear(), now.getMonth() - 6, now.getDate()) },
    { label: "a year ago", d: new Date(now.getFullYear() - 1, now.getMonth(), now.getDate()) },
  ];
  const out = [];
  for (const o of offsets) {
    const key = dayKey(o.d);
    const day = days[key];
    if (!day || !(day.entries || []).length) continue;
    let text = "";
    for (const en of day.entries) {
      for (const sg of en.segments || []) { const t = itemPlainText(sg).trim(); if (t) { text = t; break; } }
      if (text) break;
    }
    if (text) out.push({ label: o.label, key, text: snippet(text, 220) });
  }
  return out;
}

// Shorten to a whole word and mark it, so a preview never ends mid-word
// ("on compensat") and reads like the text was cut off.
function snippet(text, max) {
  const t = String(text || "");
  if (t.length <= max) return t;
  const cut = t.slice(0, max);
  const sp = cut.lastIndexOf(" ");
  return (sp > max * 0.6 ? cut.slice(0, sp) : cut).replace(/[\s.,;:!?-]+$/, "") + "…";
}

// A running list of your brighter moments — segments the AI tagged with an
// uplifting mood — newest first. This is the "wins / gratitude" feed.
function buildWins(days) {
  const wins = [];
  const keys = Object.keys(days).sort().reverse();
  for (const k of keys) {
    for (const en of days[k].entries || []) {
      for (const sg of en.segments || []) {
        const emo = (sg.emotion || "").toLowerCase();
        const txt = itemPlainText(sg).trim();
        if (txt && sg.topic !== "Check-in" && (VALENCE[emo] || 0) >= 1) wins.push({ key: k, emotion: emo, text: snippet(txt, 200) });
      }
    }
    if (wins.length >= 40) break;
  }
  return wins;
}

// Stats for a "Wrapped" recap over the current calendar month or year.
function periodStats(days, period) {
  const now = new Date();
  const prefix = period === "year" ? String(now.getFullYear()) : dayKey(now).slice(0, 7);
  const daySet = new Set();
  const moods = {}, tags = {};
  let notes = 0, val = 0, valN = 0;
  for (const k of Object.keys(days)) {
    if (!k.startsWith(prefix)) continue;
    for (const en of days[k].entries || []) {
      for (const sg of en.segments || []) {
        notes++; daySet.add(k);
        const emo = (sg.emotion || "neutral").toLowerCase();
        moods[emo] = (moods[emo] || 0) + 1; val += (VALENCE[emo] || 0); valN++;
        for (const t of segTags(sg)) tags[t] = (tags[t] || 0) + 1;
      }
    }
  }
  const top = (o, n) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n);
  return { notes, days: daySet.size, topMoods: top(moods, 3), topTags: top(tags, 6), avgVal: valN ? val / valN : 0 };
}

}

        to tag moods and write replies, and <b>Groq</b>, which turns voice recordings into text. When web search is on,

// Blocking prompt shown once per account per device, before any AI call runs.
function AIConsentGate() {
  const [answer, setAnswer] = useState(getAIConsent());
  useEffect(() => {
    const on = () => setAnswer(getAIConsent());
    window.addEventListener("lucid-ai-consent", on);
    return () => window.removeEventListener("lucid-ai-consent", on);
  }, []);
  if (answer) return null;
  return (
    <div className="ac-veil" role="dialog" aria-modal="true" aria-labelledby="ac-title">
      <style>{AC_CSS}</style>
      <div className="ac-card">
        <h2 id="ac-title">Allow AI features?</h2>

// ---------- privacy lock screen ----------
function LockScreen({ onUnlock }) {
  const [val, setVal] = useState("");
  const [err, setErr] = useState(false);
  const [bio, setBio] = useState(false);
  useEffect(() => {
    let alive = true;
    (async () => {
      let on = false;
      try { on = localStorage.getItem(FACEID_LS) === "1"; } catch (e) { }
      if (!on || !(await bioAvailable()) || !alive) return;
      setBio(true);
      if (await bioAuthenticate()) onUnlock();
    })();
    return () => { alive = false; };
  }, []);
  const go = async () => {
    if (val.length < 4) return;
    if ((await hashPin(val.trim())) === localStorage.getItem(PIN_KEY)) onUnlock();
    else { setErr(true); setVal(""); }
  };
  return (
    <div className="lg-root">
      <style>{LG_CSS}</style>
      <div className="lg-card">
        <p className="lg-title">Journal<span>/ locked</span></p>
        <p className="lg-sub">Enter your PIN to open your journal.</p>
        <input
          type="password" inputMode="numeric" autoFocus value={val}
          style={{ textAlign: "center", letterSpacing: "0.4em", fontSize: 18 }}
          onChange={(e) => { setVal(e.target.value.replace(/\D/g, "")); setErr(false); }}
          onKeyDown={(e) => { if (e.key === "Enter") go(); }}
        />
        <button className="lg-go" onClick={go} disabled={val.length < 4}>Unlock</button>
        {bio && (
          <button className="lx-bio" onClick={async () => { if (await bioAuthenticate()) onUnlock(); }}>Use Face ID</button>
        )}
        {err && <div className="lg-msg">Wrong PIN — try again.</div>}
      </div>
    </div>
  );
}

// ---------- mood trend line (last 30 days) ----------
function MoodTrend({ days }) {
  const pts = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    if (!days[k]) continue;
    let sum = 0, n = 0;
    for (const en of days[k].entries || []) {
      for (const s of en.segments || []) {
        const v = VALENCE[(s.emotion || "neutral").toLowerCase()];
        sum += v === undefined ? 0 : v; n++;
      }
    }
    if (n) pts.push({ v: sum / n, k });
  }
  if (pts.length < 2) {
    return <div className="xo-empty" style={{ padding: "18px 8px" }}>Journal a few more days and your mood line will draw itself.</div>;
  }
  const W = 620, H = 190, pl = 16, pr = 16, pt = 14, pb = 14;
  // space the days that have entries evenly across the width, so the chart always fills
  const X = (idx) => pl + (pts.length === 1 ? 0.5 : idx / (pts.length - 1)) * (W - pl - pr);
  const Y = (v) => pt + (2 - v) / 4 * (H - pt - pb);
  let dl = "M " + X(0) + " " + Y(pts[0].v);
  for (let j = 1; j < pts.length; j++) dl += " L " + X(j) + " " + Y(pts[j].v);
  const area = dl + " L " + X(pts.length - 1) + " " + Y(-2) + " L " + X(0) + " " + Y(-2) + " Z";
  return (
    <svg viewBox={"0 0 " + W + " " + H} width="100%">
      <defs>
        <linearGradient id="mtrend" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.25" />
          <stop offset="100%" stopColor="var(--accent)" stopOpacity="0" />
        </linearGradient>
      </defs>
      {[2, 0, -2].map((v) => (
        <line key={v} x1={pl} y1={Y(v)} x2={W - pr} y2={Y(v)} stroke="var(--line)" strokeDasharray={v === 0 ? "" : "3 5"} />
      ))}
      <text x={pl} y={Y(2) - 4} fill="var(--faint)" fontSize="9" letterSpacing="2">BRIGHTER</text>
      <text x={pl} y={Y(-2) + 11} fill="var(--faint)" fontSize="9" letterSpacing="2">HEAVIER</text>
      <path d={area} fill="url(#mtrend)" />
      <path d={dl} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinejoin="round" />
      {pts.map((p, j) => <circle key={p.k} cx={X(j)} cy={Y(p.v)} r="3" fill="var(--accent)"><title>{p.k}</title></circle>)}
    </svg>
  );
}

// ---------- year in pixels ----------
function YearPixels({ domEmotions }) {
  const year = new Date().getFullYear();
  const jan1 = new Date(year, 0, 1);
  const total = Math.round((new Date(year + 1, 0, 1) - jan1) / 86400000);
  const todayK = dayKey();
  const cells = [];
  for (let i = 0; i < jan1.getDay(); i++) cells.push(null);
  for (let i = 0; i < total; i++) cells.push(dayKey(new Date(year, 0, 1 + i)));
  return (
    <div className="xo-yearpixels">
      {cells.map((k, idx) => {
        if (k === null) return <i key={"pad" + idx} className="pad" />;
        const e = domEmotions[k] ? emotionOf(domEmotions[k]) : null;
        return (
          <i
            key={k}
            className={k > todayK ? "future" : ""}
            title={prettyDate(k, true) + (e ? " — " + e.label : "")}
            style={e ? { background: e.dot, borderColor: e.dot } : undefined}
          />
        );
      })}
    </div>
  );
}

// ---------- web-search citations ----------
// Only ever hand an http(s) URL to an href. Web-search results are attacker-
// influenceable, and a "javascript:"/"data:" URL in an href is a click-to-run
// XSS. Anything that isn't plain http(s) is dropped to "#".
function safeUrl(u) {
  try {
    const parsed = new URL(String(u), window.location.origin);
    return (parsed.protocol === "http:" || parsed.protocol === "https:") ? parsed.href : "#";
  } catch (e) { return "#"; }
}
function Sources({ list }) {
  if (!Array.isArray(list) || !list.length) return null;
  return (
    <div className="xo-sources">
      <b>Sources</b>
      {list.slice(0, 6).map((s, i) => (
        <a key={s.url || i} href={safeUrl(s.url)} target="_blank" rel="noopener noreferrer" title={s.url}>
          {i + 1}. {s.title || s.url}
        </a>
      ))}
    </div>
  );
}

// "select" = light selection tick; "Light"/"Medium" = impact styles.
function haptic(type) {
  const H = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
  if (!H) return;
  try {
    if (type === "select") H.selectionStart().then(() => H.selectionEnd()).catch(() => {});
    else H.impact({ style: String(type || "light").toUpperCase() }).catch(() => {});
  } catch (e) {}
}

  let last = 0, m, i = 0;

    if (!ok) {
      const s = ta.selectionStart, e2 = ta.selectionEnd, v = ta.value;
      setBody(sel.id, v.slice(0, s) + v.slice(e2)); placeCaret(s);
    }
  };
  // replace whole lines [ls, le) with `next`, then put the caret/selection back
  const replaceLines = (ls, le, next, caret) => {
    const ta = taRef.current; if (!ta) return;
    ta.focus();
    ta.setSelectionRange(ls, le);
    if (next) insertText(next); else if (le > ls) deleteSelection();
    placeCaret(caret[0], caret[1]);
  };
  const lineRange = (v, s, e) => {
    const ls = v.lastIndexOf("\n", s - 1) + 1;
    let le = v.indexOf("\n", e > s && v[e - 1] === "\n" ? e - 1 : e);
    if (le < 0) le = v.length;
    return [ls, le];
  };
  // toolbar: toggle heading / bullet / checklist / numbered on every selected line
  const toggleLinePrefix = (kind) => {
    const ta = taRef.current; if (!ta) return;
    const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
    const [ls, le] = lineRange(v, s, e);
    const lines = v.slice(ls, le).split("\n");
    const has = (l) => {
      const c = (l.match(LIST_PREFIX_RE) || [])[2] || "";
      return kind === "check" ? c.includes("[") : kind === "h" ? c.startsWith("#") : kind === "bullet" ? /^[-*•] $/.test(c) : /^\d+\. $/.test(c);
    };
    const multi = lines.length > 1;
    const allHave = lines.every((l) => (multi && !l.trim()) || has(l));
    let n = 0;
    const out = lines.map((l) => {
      if (multi && !l.trim()) return l;
      const m = l.match(LIST_PREFIX_RE);
      const ind = m[1], cur = m[2] || "";
      const rest = l.slice(ind.length + cur.length);
      if (allHave) return ind + rest;
      n++;
      const pre = kind === "check" ? "[ ] " : kind === "h" ? "# " : kind === "bullet" ? "- " : n + ". ";
      return (kind === "h" ? "" : ind) + pre + rest;
    });
    const next = out.join("\n");
    if (next === lines.join("\n")) return;
    if (multi) replaceLines(ls, le, next, [ls, ls + next.length]);
    else replaceLines(ls, le, next, [ls + next.length, ls + next.length]);
  };
  const onEditorKeyDown = (e) => {
    if (e.nativeEvent && e.nativeEvent.isComposing) return;
    const ta = e.target, v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
    // Tab / Shift+Tab indent list items (plain text lets Tab move focus as usual)
    if (e.key === "Tab" && !e.altKey && !e.metaKey && !e.ctrlKey) {
      const [ls, le] = lineRange(v, s, en);
      const lines = v.slice(ls, le).split("\n");
      const isItem = (l) => /^\s*((?:[-*•] )?\[( |x|X)\] |[-*•] |\d+\. )/.test(l);
      if (!lines.some(isItem)) return;
      e.preventDefault();
      const out = lines.map((l) => (e.shiftKey ? l.replace(/^ {1,2}/, "") : (l.trim() ? "  " + l : l)));
      const next = out.join("\n");
      if (next === lines.join("\n")) return;
      const shift = out[0].length - lines[0].length;
      replaceLines(ls, le, next, s === en ? [Math.max(ls, s + shift), Math.max(ls, s + shift)] : [ls, ls + next.length]);
      return;
    }
    if (e.key === "Backspace" && s === en) {
      // backspace right after an empty list marker removes the marker, not a character
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      const before = v.slice(ls, s);
      const m = before.match(/^(\s*)((?:[-*•] )?\[( |x|X)\] |[-*•] |\d+\. )$/);
      if (m) { e.preventDefault(); ta.setSelectionRange(ls + m[1].length, s); deleteSelection(); }
      return;
    }
    if (e.key !== "Enter" || e.shiftKey || e.altKey || e.metaKey || e.ctrlKey) return;
    if (s !== en) return;
    const ls = v.lastIndexOf("\n", s - 1) + 1;
    const before = v.slice(ls, s);
    const m = before.match(/^(\s*)((?:[-*•] )?\[( |x|X)\] |[-*•] |(\d+)\. )/);
    if (!m) return;
    e.preventDefault();
    const le = v.indexOf("\n", s);
    const after = v.slice(s, le < 0 ? v.length : le);
    if (!before.slice(m[0].length).trim() && !after.trim()) {
      ta.setSelectionRange(ls, s); deleteSelection(); // Enter on an empty item ends the list
      return;
    }
    let next = m[2];
    if (m[2].includes("[")) next = m[2].replace(/\[(x|X)\]/, "[ ]");
    if (m[4]) next = (parseInt(m[4], 10) + 1) + ". ";
    insertText("\n" + m[1] + next);
  };
  const editAtLine = (i) => {
    if (!sel) return;
    const lines = noteLines(sel.body);
    let off = 0; for (let k = 0; k < i && k < lines.length; k++) off += lines[k].length + 1;
    const at = Math.min(off + (lines[i] || "").length, sel.body.length);
    caretRef.current = [at, at];
    setMode("write");
  };

  // photos / voice land where the cursor last was if the note is open, else at the end
  const insertIntoNote = (id, text) => {
    const cur = notesRef.current.find((n) => n.id === id);
    if (!cur) return;
    const ta = taRef.current;
    if (sel && sel.id === id && mode === "write" && ta) {
      if (document.activeElement !== ta && lastCaret.current != null) {
        try { ta.focus(); ta.setSelectionRange(lastCaret.current, lastCaret.current); } catch (e) { }
      }
      insertText(text);
      return;
    }
    const base = cur.body.replace(/\s+$/, "");
    setBody(id, base + (text.startsWith("\n") || !base ? text : " " + text));
  };
  // photos go to their own storage key, referenced from the note by a token line
  const addPhotos = async (files) => {
    if (!sel) return;
    const id = sel.id;
    for (const f of [...(files || [])].filter((x) => x.type && x.type.startsWith("image/"))) {
      try {
        const dataUrl = await compressImage(f);
        const key = IMG_PREFIX + "n" + uid() + uid();
        imgCache[key] = dataUrl;
        await window.storage.set(key, dataUrl);
        insertIntoNote(id, "\n![photo](" + key + ")\n");
      } catch (e) { say("Couldn't add that photo"); }
    }
  };
  const removePhoto = (key) => {
    if (!sel) return;
    setBody(sel.id, noteLines(sel.body).filter((l) => { const m = l.match(IMG_TOKEN_RE); return !(m && m[1] === key); }).join("\n").replace(/\n{3,}/g, "\n\n"));
  };

  // voice → text lands in the note that was open when you started talking
  useEffect(() => { if (!mic.listening && !mic.transcribing) setMicMine(false); }, [mic.listening, mic.transcribing]);
  const talk = () => {
    if (!sel) return;
    const id = sel.id;
    if (!mic.listening) setMicMine(true);
    mic.toggle((text) => insertIntoNote(id, text));
  };

  // title box grows to fit a long title instead of hiding the end of it
  const fitTitle = () => { const t = titleRef.current; if (t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; } };
  React.useLayoutEffect(fitTitle);
  useEffect(() => { window.addEventListener("resize", fitTitle); return () => window.removeEventListener("resize", fitTitle); }, []);

  // ----- lock -----
  const askLock = (purpose, note) => { setSheetData({ purpose, note, code: "", code2: "", pass: "", err: "", busy: false }); setSheet("lock"); };
  const submitLock = async () => {
    const d = sheetData;
    if (!d || d.busy) return;
    const code = String(d.code || "").trim();
    const fail = (err) => setSheetData({ ...d, err, busy: false });
    if (d.purpose === "unlock") {
      if (!code) return fail("Enter your lock code.");
      if ((await hashNoteCode(code)) !== np.lockHash) return fail("That code doesn't match.");
      setUnlocked((s) => new Set(s).add(d.note.id));
      setSheet(null);
      return;
    }
    if (d.purpose === "reset") {
      if (!d.pass) return fail("Enter your account password.");
      setSheetData({ ...d, busy: true, err: "" });
      const email = window.__session && window.__session.user && window.__session.user.email;
      try {
        const { error } = await window.__sb.auth.signInWithPassword({ email, password: d.pass });
        if (error) return fail("That password isn't right.");
      } catch (e) { return fail("Couldn't check your password. Are you online?"); }
      setSheetData({ ...d, purpose: "set", pass: "", code: "", code2: "", err: "", busy: false });
      return;
    }
    if (code.length < 4) return fail("Use at least 4 characters.");
    if (code !== String(d.code2 || "").trim()) return fail("The two codes don't match.");
    saveNp({ lockHash: await hashNoteCode(code) });
    if (d.note) {
      updateNote(d.note.id, { locked: true }, { touch: false, now: true });
      setUnlocked((s) => { const t = new Set(s); t.delete(d.note.id); return t; });
    }
    setSheet(null);
    say(d.note ? "Note locked" : "Lock code saved");
  };
  const lockNote = (n) => {
    setSheet(null);
    if (!np.lockHash) { askLock("set", n); return; }
    updateNote(n.id, { locked: true }, { touch: false, now: true });
    setUnlocked((s) => { const t = new Set(s); t.delete(n.id); return t; });
    say("Note locked");
  };
  const relock = (n) => setUnlocked((s) => { const t = new Set(s); t.delete(n.id); return t; });
  const unlockForGood = (n) => { updateNote(n.id, { locked: false }, { touch: false, now: true }); setSheet(null); say("Lock removed"); };

  // ----- AI actions (only on tap; the consent gate applies) -----
  const runSummary = async (n) => {
    setSheetData({ busy: true, text: "", err: "" }); setSheet("summary");
    try {
      const text = await callClaude(`Summarize this personal note in 2-5 short bullet points ("- " at the start of each line). Keep the person's own words where you can. No intro, no markdown other than the dashes.\n\nNote:\n"""${notePlain(n).slice(0, 12000)}"""`, 500);
      setSheetData({ busy: false, text: text.trim(), err: "" });
    } catch (e) {
      setSheetData({ busy: false, text: "", err: aiErrMsg(e, "The AI couldn't summarize this just now. Try again.") });
    }
  };
  const runTidy = async (n) => {
    setSheetData({ busy: true, text: "", err: "" }); setSheet("tidy");
    try {
      let text = await callClaude(`Tidy up this personal note. Fix spelling and grammar and organize it with this exact plain-text syntax: "# " for a heading, "- " for a bullet, "[ ] " for an open to-do, "[x] " for a finished to-do, "1. " for numbered steps. Keep ALL of the content and meaning, keep the writer's voice, and don't add new information. Copy any line that looks like ![photo](...) exactly as it is. Output only the tidied note, with no intro and no code fences.\n\nNote:\n"""${n.body.slice(0, 16000)}"""`, 3000);
      text = text.replace(/^```[a-z]*\n?|\n?```$/g, "").trim();
      const imgs = noteImages(n).filter((k) => !text.includes(k));
      if (imgs.length) text += "\n" + imgs.map((k) => "![photo](" + k + ")").join("\n");
      setSheetData({ busy: false, text, err: "" });
    } catch (e) {
      setSheetData({ busy: false, text: "", err: aiErrMsg(e, "The AI couldn't tidy this just now. Try again.") });
    }
  };

  // ----- checklist → schedule (dates guessed by simple rules, you confirm) -----
  const openScheduleSheet = (n) => {
    const rows = noteTodos(n).filter((t) => !t.done && t.text.trim()).map((t) => {
      const g = npGuessWhen(t.text);
      return { line: t.line, text: t.text.trim(), include: !!g.date, date: g.date, time: g.time };
    });
    setSheetData({ note: n, rows }); setSheet("schedule");
  };
  const openHistory = async (n) => {
    setSheetData({ loading: true, list: [], pick: null }); setSheet("history");
    const h = await loadHistory(n.id);
    setSheetData({ loading: false, list: h.slice().reverse(), pick: null });
  };

  const share = async (n) => {
    const text = notePlain(n);
    setSheet(null);
    try { if (navigator.share) { await navigator.share({ title: noteTitle(n), text }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(text); say("Copied to clipboard"); } catch (e) { say("Couldn't share this note"); }
  };

  // ----- tags on a note (typed by you, never by the AI) -----
  const addTag = (n, raw) => {
    const t = String(raw || "").replace(/^#+/, "").replace(/,/g, " ").trim().slice(0, 40);
    if (!t) return;
    if ((n.tags || []).some((x) => x.toLowerCase() === t.toLowerCase())) return;
    const existing = allTags.find(([x]) => x.toLowerCase() === t.toLowerCase());
    updateNote(n.id, { tags: [...(n.tags || []), existing ? existing[0] : t] }, { touch: false });
  };
  const removeTag = (n, t) => updateNote(n.id, { tags: (n.tags || []).filter((x) => x !== t) }, { touch: false });

  // ----- manual reordering in the list (drag the grip) -----
  const startReorder = (e, n) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const start = visible.findIndex((x) => x.id === n.id);
    reorderRef.current = { id: n.id, over: start };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { }
    setReorder({ id: n.id, over: start });
  };
  const onReorderMove = (e) => {
    if (!reorderRef.current) return;
    let over = visible.length;
    for (let i = 0; i < visible.length; i++) {
      const el = rowRefs.current[visible[i].id];
      if (!el) continue;
      const r = el.getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) { over = i; break; }
    }
    reorderRef.current.over = over; // read on drop (state may lag a quick drag)
    setReorder((r) => (r && r.over !== over ? { ...r, over } : r));
  };
  const onReorderEnd = (e) => {
    if (e && e.type === "pointerup") onReorderMove(e); // count the final position
    const r = reorderRef.current; reorderRef.current = null; setReorder(null);
    if (!r) return;
    const ids = visible.map((n) => n.id);
    const from = ids.indexOf(r.id);
    if (from < 0) return;
    ids.splice(from, 1);
    ids.splice(r.over > from ? r.over - 1 : r.over, 0, r.id);
    ids.forEach((id, i) => {
      const n = notesRef.current.find((x) => x.id === id);
      if (n && n.order !== i * 10) updateNote(id, { order: i * 10 }, { touch: false });
    });
    if (filter.sort !== "manual") setFilter({ ...filter, sort: "manual" });
  };

  // ----- blocks -----
  const chips = npActiveChips(filter);
  const renderFilters = () => (
    <div className="np-filters">
      <div className="np-frow">
        <label className="np-searchwrap">
          <NpIcon name="search" />
          <input className="np-search" type="search" placeholder="Search notes" value={filter.q}
            onChange={(e) => setFilter({ ...filter, q: e.target.value })} aria-label="Search notes" />
        </label>
        <button className={chips.length ? "np-btn on" : "np-btn"} onClick={() => setSheet("filters")}>
          <NpIcon name="filter" />Filters{chips.length ? <span className="np-badge">{chips.length}</span> : null}
        </button>
        <button className="np-btn" onClick={() => setSheet("sort")} aria-label={"Sort notes: " + NP_SORTS[filter.sort]}>
          <NpIcon name="sort" />{NP_SORTS[filter.sort] || NP_SORTS.manual}
        </button>
        <button className="np-btn" onClick={() => { setSheetData(null); setSheet("calendar"); }} aria-label="Notes by day">
          <NpIcon name="calendar" />Calendar
        </button>
      </div>
      {(savedViews.length > 0 || chips.length > 0) && (
        <div className="np-chiprow">
          {savedViews.map((v) => (
            <span key={v.id} className="np-view">
              <button onClick={() => setFilter({ ...NP_DEFAULT_FILTER, ...v.f, q: filter.q })} title="Apply this saved view">★ {v.name}</button>
              <button className="np-viewx" aria-label={"Delete saved view " + v.name} onClick={() => saveNp({ savedFilters: (npRef.current.savedFilters || []).filter((x) => x.id !== v.id) })}><NpIcon name="close" size={12} /></button>
            </span>
          ))}
          {chips.map((c) => (
            <button key={c.k} className="np-chip" onClick={() => setFilter(npDropChip(filter, c.k))} aria-label={"Remove filter: " + c.label}>
              {c.color && <i className="np-dot" style={{ background: c.color }} />}{c.label}<NpIcon name="close" size={12} />
            </button>
          ))}
          {chips.length > 0 && <button className="np-linkbtn" onClick={() => setFilter({ ...NP_DEFAULT_FILTER, q: filter.q, sort: filter.sort })}>Clear</button>}
          {chips.length > 0 && <button className="np-linkbtn" onClick={() => { setSheetData({ name: "" }); setSheet("saveview"); }}>Save as view</button>}
        </div>
      )}
    </div>
  );

  const renderPinned = () => (
    <div>
      <div className="np-blocklabel"><NpIcon name="pin" size={13} />Pinned</div>
      {!pins.length ? <p className="np-hint">Pin a note from its ⋯ menu to keep it up here.</p> : (
        <div className="np-pins">
          {pins.map((n) => (
            <button key={n.id} className={n.id === selId ? "np-pin on" : "np-pin"} onClick={() => openNote(n.id)} style={{ borderTopColor: NOTE_COLORS[n.color] || "var(--line)" }}>
              <b>{n.locked && <NpIcon name="lock" size={13} />}{noteTitle(n)}</b>
              {!n.locked && look.previews && notePreview(n) && <span>{notePreview(n)}</span>}
            </button>
          ))}
        </div>
      )}
    </div>
  );

  const renderList = () => (
    <div className="np-listwrap">
      <div className="np-listhead">
        <b>{filter.deleted ? "Recently deleted" : "Notes"}</b>
        <span className="np-count">{visible.length}</span>
        {filter.deleted
          ? (visible.length > 0 && <button className="np-linkbtn danger" onClick={() => { setSheetData({ confirmEmpty: true }); setSheet("confirm"); }}>Empty</button>)
          : visible.length > 0 && <button className="np-new sm" onClick={() => createNote()}><NpIcon name="plus" size={14} />New</button>}
      </div>
      {filter.deleted && <p className="np-hint">Deleted notes are removed for good after {NOTE_TRASH_DAYS} days.</p>}
      {!loaded ? <p className="np-hint">Loading your notes…</p> : visible.length === 0 ? (
        <div className="np-emptylist">
          {notes.filter((n) => !n.deletedAt).length === 0 && !filter.deleted
            ? <><p>No notes yet.</p><button className="np-new" onClick={() => createNote()}><NpIcon name="plus" size={14} />Write your first note</button></>
            : <><p>Nothing matches these filters.</p>{chips.length > 0 && <button className="np-btn" onClick={() => setFilter({ ...NP_DEFAULT_FILTER, q: "", sort: filter.sort })}>Clear filters</button>}</>}
        </div>
      ) : (
        <ul className={"np-list np-ls-" + look.listStyle} onPointerMove={onReorderMove} onPointerUp={onReorderEnd} onPointerCancel={onReorderEnd}>
          {visible.map((n, i) => {
            const open = !n.locked || unlocked.has(n.id);
            const td = open ? noteTodos(n) : [];
            const openTd = td.filter((t) => !t.done).length;
            const photos = open ? noteImages(n).length : 0;
            const prev = look.previews && look.listStyle !== "compact" && !n.locked ? notePreview(n) : "";
            return (
              <li key={n.id} ref={(el) => { rowRefs.current[n.id] = el; }}
                className={(n.id === selId ? "np-row on" : "np-row") + (reorder && reorder.over === i ? " dropbefore" : "") + (reorder && reorder.id === n.id ? " lifting" : "")}
                onClick={() => openNote(n.id)} onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openNote(n.id); } }}
                tabIndex={0} aria-current={n.id === selId ? "true" : undefined}>
                <i className="np-colorbar" style={{ background: NOTE_COLORS[n.color] || "transparent" }} />
                {filter.sort === "manual" && !filter.deleted && (
                  <span className="np-rgrip" onPointerDown={(e) => startReorder(e, n)} onClick={(e) => e.stopPropagation()} aria-hidden="true" title="Drag to reorder"><NpIcon name="grip" size={14} /></span>
                )}
                <div className="np-rowmain">
                  <div className="np-rowtitle">
                    {n.pinned && !filter.deleted && <span className="np-mark" title="Pinned"><NpIcon name="pin" size={13} /></span>}
                    {n.locked && <span className="np-mark" title="Locked"><NpIcon name="lock" size={13} /></span>}
                    <span>{noteTitle(n)}</span>
                  </div>
                  {prev && <div className="np-rowprev">{prev}</div>}
                  <div className="np-rowmeta">
                    <span>{filter.deleted ? "Deleted " : ""}{npWhen(n.deletedAt || n.updatedAt)}</span>
                    {td.length > 0 && <span className={openTd ? "np-metaic" : "np-metaic alldone"}><NpIcon name="check" size={12} />{td.length - openTd}/{td.length}</span>}
                    {photos > 0 && <span className="np-metaic"><NpIcon name="camera" size={12} />{photos}</span>}
                    {(n.tags || []).slice(0, 3).map((t) => <span key={t} className="np-tagmini">#{t}</span>)}
                    {(n.tags || []).length > 3 && <span className="np-tagmini">+{n.tags.length - 3}</span>}
                  </div>
                </div>
              </li>
            );
          })}
          {reorder && reorder.over === visible.length && <li className="np-row dropend" aria-hidden="true" />}
        </ul>
      )}
    </div>
  );

  const renderTodos = () => {
    const source = visible.filter((n) => !n.deletedAt && (!n.locked || unlocked.has(n.id)));
    const items = source.flatMap((n) => noteTodos(n).map((t) => ({ ...t, note: n })));
    const open = items.filter((t) => !t.done);
    const showDone = !!np.todosShowDone;
    const list = showDone ? items : open;
    return (
      <div className="np-todos">
        <div className="np-listhead">
          <b>To-dos</b><span className="np-count">{open.length} open</span>
          {items.length > open.length && <button className="np-linkbtn" onClick={() => saveNp({ todosShowDone: !showDone })}>{showDone ? "Hide done" : "Show done (" + (items.length - open.length) + ")"}</button>}
        </div>
        {list.length === 0 ? <p className="np-hint">{items.length ? "Everything's done. Nice." : "Checklist items from your notes gather here. Add one with the checklist button in the editor."}</p> : (
          <ul className="np-todolist">
            {list.map((t) => (
              <li key={t.note.id + ":" + t.line} className={t.done ? "done" : ""}>
                <input type="checkbox" checked={t.done} aria-label={t.text}
                  onChange={() => updateNote(t.note.id, { body: toggleTodoLine(t.note.body, t.line) })} />
                <span className="np-todotext">{npInline(t.text)}</span>
                <button className="np-todonote" onClick={() => openNote(t.note.id)}>{noteTitle(t.note)}</button>
              </li>
            ))}
          </ul>
        )}
      </div>
    );
  };

  const paperClass = "np-paper-" + look.paper;
  const renderEditor = (inFocus) => {
    // full screen, every state (even locked / empty) carries a way back
    const back = inFocus ? (
      <button className="np-back" onClick={() => setFocus(false)}><NpIcon name="back" size={18} />{editorHidden ? "Notes" : "Done"}</button>
    ) : null;
    const withBack = (content) => (inFocus ? <div className="np-edwrap"><div className="np-edtop">{back}</div>{content}</div> : content);
    if (!sel) {
      return withBack(
        <div className="np-edempty">
          {!loaded ? <p>Loading…</p> : notes.some((n) => !n.deletedAt)
            ? <p>Pick a note, or start a new one.</p>
            : <p>Your first note starts here.</p>}
          {loaded && <button className="np-new" onClick={() => createNote()}><NpIcon name="plus" size={14} />New note</button>}
        </div>
      );
    }
    if (sel.deletedAt) {
      return withBack(
        <div className="np-edempty">
          <p><b>{noteTitle(sel)}</b> is in Recently deleted.</p>
          <div className="np-row2">
            <button className="np-btn" onClick={() => restore(sel)}><NpIcon name="restore" />Restore</button>
            <button className="np-btn danger" onClick={() => { setSheetData({ note: sel }); setSheet("confirm"); }}><NpIcon name="trash" />Delete for good</button>
          </div>
        </div>
      );
    }
    if (!selOpen) {
      return withBack(
        <div className="np-edempty">
          <div className="np-lockicon"><NpIcon name="lock" size={28} /></div>
          <p><b>{noteTitle(sel)}</b> is locked.</p>
          <button className="np-new" onClick={() => askLock("unlock", sel)}><NpIcon name="unlock" size={14} />Unlock</button>
        </div>
      );
    }
    const imgs = noteImages(sel);
    const micOnHere = micMine && (mic.listening || mic.transcribing);
    return (
      <div className="np-ed">
        <div className="np-edtop">
          {back}
          <div className="np-edbtns">
            <NpChoice value={mode} onChange={setMode} label="Editor mode" options={[["write", "Write"], ["read", "Read"]]} />
            {sel.locked && <button className="np-icon" title="Lock now" aria-label="Lock now" onClick={() => relock(sel)}><NpIcon name="lock" /></button>}
            {!editorHidden && <button className="np-icon" title={inFocus ? "Exit focus" : "Focus"} aria-label={inFocus ? "Exit focus mode" : "Focus mode"} onClick={() => setFocus(!inFocus)}><NpIcon name={inFocus ? "collapse" : "expand"} /></button>}
            <button className="np-icon" title="Note options" aria-label="Note options" onClick={() => setSheet("menu")}><NpIcon name="more" /></button>
          </div>
        </div>
        <textarea ref={titleRef} rows={1} className="np-title" value={sel.title} placeholder="Title"
          onChange={(e) => updateNote(sel.id, { title: e.target.value.replace(/\n/g, " ") })} aria-label="Note title"
          onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); setMode("write"); setTimeout(() => taRef.current && taRef.current.focus(), 0); } }} />
        <div className="np-meta">
          {sel.color && <i className="np-dot" style={{ background: NOTE_COLORS[sel.color] }} title={sel.color} />}
          {(sel.tags || []).map((t) => (
            <span key={t} className="np-tag">#{t}<button aria-label={"Remove tag " + t} onClick={() => removeTag(sel, t)}><NpIcon name="close" size={11} /></button></span>
          ))}
          <input className="np-taginput" list="np-tags" placeholder="Add tag" value={tagDraft} aria-label="Add a tag"
            onChange={(e) => setTagDraft(e.target.value)} enterKeyHint="done"
            onKeyDown={(e) => {
              if (e.key === "Enter" || e.key === ",") { e.preventDefault(); addTag(sel, tagDraft); setTagDraft(""); }
              else if (e.key === "Backspace" && !tagDraft && (sel.tags || []).length) removeTag(sel, sel.tags[sel.tags.length - 1]);
            }}
            onBlur={() => { if (tagDraft.trim()) { addTag(sel, tagDraft); setTagDraft(""); } }} />
          <datalist id="np-tags">{allTags.map(([t]) => <option key={t} value={t} />)}</datalist>
          <span className="np-edited">{saving ? "Saving…" : "Saved"} · edited {npWhen(sel.updatedAt)}</span>
        </div>
        {mode === "write" && (
          <div className="np-toolbar" role="toolbar" aria-label="Formatting">
            <button onMouseDown={(e) => e.preventDefault()} onClick={() => toggleLinePrefix("h")} title="Heading" aria-label="Heading"><NpIcon name="heading" /></button>
            <button onMouseDown={(e) => e.preventDefault()} onClick={() => toggleLinePrefix("bullet")} title="Bulleted list" aria-label="Bulleted list"><NpIcon name="bullets" /></button>
            <button onMouseDown={(e) => e.preventDefault()} onClick={() => toggleLinePrefix("check")} title="Checklist" aria-label="Checklist"><NpIcon name="checks" /></button>
            <button onMouseDown={(e) => e.preventDefault()} onClick={() => toggleLinePrefix("num")} title="Numbered list" aria-label="Numbered list"><NpIcon name="numbers" /></button>
            <button onMouseDown={(e) => e.preventDefault()} onClick={() => insertText("\n---\n")} title="Divider" aria-label="Divider"><NpIcon name="divider" /></button>
            <span className="np-tsep" aria-hidden="true" />
            <button onClick={() => photoRef.current && photoRef.current.click()} title="Add photo" aria-label="Add photo"><NpIcon name="camera" /></button>
            <button className={micOnHere ? "live" : ""} onClick={talk} disabled={mic.transcribing} title={mic.listening && micMine ? "Stop and transcribe" : "Talk"} aria-label={mic.listening && micMine ? "Stop recording" : "Talk"}>
              {mic.transcribing && micMine ? <span className="xo-spin" /> : mic.listening && micMine ? <NpIcon name="stop" /> : <NpIcon name="mic" />}
            </button>
            <span className="np-tsep" aria-hidden="true" />
            <button onMouseDown={(e) => e.preventDefault()} onClick={() => { try { taRef.current.focus(); document.execCommand("undo"); } catch (e) { } }} title="Undo" aria-label="Undo"><NpIcon name="undo" /></button>
            <button onMouseDown={(e) => e.preventDefault()} onClick={() => { try { taRef.current.focus(); document.execCommand("redo"); } catch (e) { } }} title="Redo" aria-label="Redo"><NpIcon name="redo" /></button>
            <input ref={photoRef} type="file" accept="image/*" multiple style={{ display: "none" }}
              onChange={(e) => { addPhotos(e.target.files); e.target.value = ""; }} />
          </div>
        )}
        {micOnHere && <div className="np-micline" role="status">{mic.transcribing ? "Turning your voice into text…" : <><i className="np-recdot" />Listening… tap the red stop button when you're done.</>}</div>}
        {micMine && mic.error && <div className="xo-error" style={{ marginTop: 4 }}>{mic.error}</div>}
        <div className={"np-page " + paperClass}>
          {mode === "write" ? (
            <textarea ref={taRef} className="np-ta" value={sel.body} spellCheck="true" autoCapitalize="sentences"
              placeholder={"Start writing…\n\nTip: use the toolbar for checklists, lists and headings."}
              onChange={(e) => setBody(sel.id, e.target.value)} onKeyDown={onEditorKeyDown} aria-label="Note text"
              onBlur={(e) => { lastCaret.current = e.target.selectionStart; }} />
          ) : (
            <NpRead body={sel.body} onToggle={(i) => updateNote(sel.id, { body: toggleTodoLine(sel.body, i) })} onEditLine={editAtLine} />
          )}
        </div>
        {mode === "write" && imgs.length > 0 && (
          <div className="np-photostrip">
            {imgs.map((k) => (
              <div key={k} className="np-photothumb"><StoredImage imgKey={k} /><button onClick={() => removePhoto(k)} aria-label="Remove photo"><NpIcon name="close" size={12} /></button></div>
            ))}
          </div>
        )}
      </div>
    );
  };

  const blockBody = (id) => {
    if (id === "filters") return renderFilters();
    if (id === "pinned") return renderPinned();
    if (id === "list") return renderList();
    if (id === "todos") return renderTodos();
    if (id === "editor") {
      return focus
        ? <div className="np-edempty"><p>Editing in focus mode.</p><button className="np-btn" onClick={() => setFocus(false)}><NpIcon name="collapse" />Exit focus</button></div>
        : renderEditor(false);
    }
    return null;
  };

  // The app shell is its own stacking layer (z-index 1), so nothing inside it can
  // rise above the fixed bottom tab bar. While a sheet or focus mode is open, hide
  // the bar instead, so it never covers the bottom of a sheet or the editor.
  const overlayOpen = !!(sheet || focus);
  useEffect(() => {
    document.body.classList.toggle("np-overlay-open", overlayOpen);
    return () => document.body.classList.remove("np-overlay-open");
  }, [overlayOpen]);

  // ----- sheets -----
  const F = filter;
  const setF = (patch) => setFilter({ ...F, ...patch });
  const toggleIn = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);
  const renderSheet = () => {
    if (!sheet) return null;
    const close = () => setSheet(null);
    if (sheet === "filters") return (
      <NpSheet title="Filter your notes" onClose={close}>
        <p className="np-hint" style={{ marginTop: 0 }}>You choose what shows. Nothing here is sorted by the AI.</p>
        <div className="np-fsec"><h4>Tags</h4>
          {allTags.length === 0 ? <p className="np-hint">Add tags to a note (under its title) to filter by them.</p> : (
            <>
              <div className="np-chipwrap">
                {allTags.map(([t, c]) => (
                  <button key={t} className={F.tags.includes(t) ? "np-fchip on" : "np-fchip"} aria-pressed={F.tags.includes(t)} onClick={() => setF({ tags: toggleIn(F.tags, t) })}>#{t} <span>{c}</span></button>
                ))}
              </div>
              {F.tags.length > 1 && <div style={{ marginTop: 8 }}><NpChoice label="Tag matching" value={F.tagMode} onChange={(v) => setF({ tagMode: v })} options={[["any", "Match any"], ["all", "Match all"]]} /></div>}
            </>
          )}
        </div>
        <div className="np-fsec"><h4>Color</h4>
          <div className="np-chipwrap">
            {[["none", "No color"], ...Object.keys(NOTE_COLORS).map((c) => [c, c[0].toUpperCase() + c.slice(1)])].map(([c, label]) => (
              <button key={c} className={F.colors.includes(c) ? "np-fchip on" : "np-fchip"} aria-pressed={F.colors.includes(c)} onClick={() => setF({ colors: toggleIn(F.colors, c) })}>
                <i className="np-dot" style={{ background: NOTE_COLORS[c] || "transparent", borderColor: "var(--dash)" }} />{label}
              </button>
            ))}
          </div>
        </div>
        <div className="np-fsec"><h4>Show only</h4>
          <div className="np-chipwrap">
            <button className={F.pinned ? "np-fchip on" : "np-fchip"} aria-pressed={F.pinned} onClick={() => setF({ pinned: !F.pinned })}><NpIcon name="pin" size={13} />Pinned</button>
            <button className={F.photos ? "np-fchip on" : "np-fchip"} aria-pressed={F.photos} onClick={() => setF({ photos: !F.photos })}><NpIcon name="camera" size={13} />Has photos</button>
          </div>
        </div>
        <div className="np-fsec"><h4>Checklists</h4>
          <NpChoice label="Checklists" value={F.todo} onChange={(v) => setF({ todo: v })} options={[["any", "Any"], ["open", "Has open to-dos"], ["done", "All done"], ["none", "No checklist"]]} />
        </div>
        <div className="np-fsec"><h4>Locked notes</h4>
          <NpChoice label="Locked notes" value={F.locked} onChange={(v) => setF({ locked: v })} options={[["any", "Show"], ["only", "Only locked"], ["hide", "Hide"]]} />
        </div>
        <div className="np-fsec"><h4>Last edited</h4>
          <NpChoice label="Last edited" value={F.when} onChange={(v) => setF({ when: v })} options={[["any", "Any time"], ["today", "Today"], ["7d", "7 days"], ["30d", "30 days"], ["range", "Pick dates"]]} />
          {F.when === "range" && (
            <div className="np-range">
              <label>From <input type="date" value={F.from} max={F.to || undefined} onChange={(e) => setF({ from: e.target.value })} /></label>
              <label>To <input type="date" value={F.to} min={F.from || undefined} onChange={(e) => setF({ to: e.target.value })} /></label>
            </div>
          )}
        </div>
        <div className="np-fsec"><h4>Recently deleted</h4>
          <button className={F.deleted ? "np-fchip on" : "np-fchip"} aria-pressed={F.deleted} onClick={() => setF({ deleted: !F.deleted })}><NpIcon name="trash" size={13} />Show deleted notes ({deletedCount})</button>
        </div>
        <div className="np-sheetfoot">
          <button className="np-linkbtn" onClick={() => setFilter({ ...NP_DEFAULT_FILTER, q: F.q, sort: F.sort })}>Clear all</button>
          {npActiveChips(F).length > 0 && <button className="np-btn" onClick={() => { setSheetData({ name: "" }); setSheet("saveview"); }}>Save as view</button>}
          <button className="np-btn primary" onClick={close}>Show {visible.length} note{visible.length === 1 ? "" : "s"}</button>
        </div>
      </NpSheet>
    );
    if (sheet === "calendar") {
      const nowD = new Date();
      const cur = sheetData && sheetData.y != null ? sheetData : { y: nowD.getFullYear(), m: nowD.getMonth() };
      const first = new Date(cur.y, cur.m, 1);
      const dim = new Date(cur.y, cur.m + 1, 0).getDate();
      const counts = {};
      notes.forEach((n) => { if (!n.deletedAt) { const k = dayKey(new Date(n.updatedAt || n.createdAt || 0)); counts[k] = (counts[k] || 0) + 1; } });
      const cells = [];
      for (let i = 0; i < first.getDay(); i++) cells.push(null);
      for (let d = 1; d <= dim; d++) cells.push(d);
      const go = (delta) => { const d = new Date(cur.y, cur.m + delta, 1); setSheetData({ y: d.getFullYear(), m: d.getMonth() }); };
      const todayK = dayKey();
      return (
        <NpSheet title="Notes by day" onClose={close}>
          <div className="np-calhead">
            <button className="np-icon" onClick={() => go(-1)} aria-label="Previous month"><NpIcon name="back" /></button>
            <b>{first.toLocaleDateString([], { month: "long", year: "numeric" })}</b>
            <button className="np-icon" onClick={() => go(1)} aria-label="Next month" style={{ transform: "scaleX(-1)" }}><NpIcon name="back" /></button>
          </div>
          <div className="np-cal" role="grid">
            {["S", "M", "T", "W", "T", "F", "S"].map((l, i) => <span key={i} className="np-calwd">{l}</span>)}
            {cells.map((d, i) => {
              if (d == null) return <span key={"e" + i} />;
              const k = cur.y + "-" + String(cur.m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
              const c = counts[k] || 0;
              return (
                <button key={k} className={"np-calday" + (c ? " has" : "") + (k === todayK ? " today" : "")} disabled={!c}
                  aria-label={c ? c + " note" + (c === 1 ? "" : "s") + " on " + k : "No notes on " + k}
                  onClick={() => { setFilter({ ...NP_DEFAULT_FILTER, sort: filter.sort, when: "range", from: k, to: k }); close(); }}>
                  {d}{c > 0 && <i>{c}</i>}
                </button>
              );
            })}
          </div>
          <p className="np-hint">Days show when a note was last edited. Tap one to list just those notes.</p>
        </NpSheet>
      );
    }
    if (sheet === "sort") return (
      <NpSheet title="Sort notes" onClose={close}>
        <div className="np-menu" role="radiogroup" aria-label="Sort notes">
          {Object.entries(NP_SORTS).map(([k, label]) => (
            <button key={k} role="radio" aria-checked={F.sort === k} className={F.sort === k ? "on" : ""} onClick={() => { setF({ sort: k }); close(); }}>
              <span className="np-radio" aria-hidden="true">{F.sort === k && <NpIcon name="check" size={14} />}</span>{label}
            </button>
          ))}
        </div>
        <p className="np-hint">"My order" is the order you drag notes into.</p>
      </NpSheet>
    );
    if (sheet === "saveview") {
      const name = (sheetData && sheetData.name) || "";
      const save = () => {
        if (!name.trim()) return;
        const { q, ...rest } = F;
        saveNp({ savedFilters: [...(npRef.current.savedFilters || []), { id: uid(), name: name.trim(), f: rest }] });
        close(); say("Saved view");
      };
      return (
        <NpSheet title="Save this filter" onClose={close}>
          <p className="np-hint" style={{ marginTop: 0 }}>It'll sit next to the search box as a one-tap view.</p>
          <form onSubmit={(e) => { e.preventDefault(); save(); }}>
            <input className="np-input" autoFocus placeholder="Name, e.g. Work to-dos" value={name}
              onChange={(e) => setSheetData({ name: e.target.value })} maxLength={40} />
            <div className="np-sheetfoot">
              <button type="button" className="np-btn" onClick={close}>Cancel</button>
              <button type="submit" className="np-btn primary" disabled={!name.trim()}>Save view</button>
            </div>
          </form>
        </NpSheet>
      );
    }
    if (sheet === "look") return (
      <NpSheet title="Notepad look" onClose={close}>
        <div className={"np-sample " + paperClass} aria-hidden="true">
          <div className="np-rh np-rh2">Saturday</div>
          <div className="np-samplebody">[ ] farmers market before 10{"\n"}[x] call grandma{"\n"}Ideas for the week: slow mornings, more walks.</div>
        </div>
        <div className="np-fsec"><h4>Paper</h4>
          <NpChoice label="Paper" value={look.paper} onChange={(v) => saveLook({ paper: v })} options={[["plain", "Plain"], ["lined", "Lined"], ["dots", "Dots"], ["grid", "Grid"]]} />
        </div>
        <div className="np-fsec"><h4>Font</h4>
          <NpChoice label="Font" value={look.font} onChange={(v) => saveLook({ font: v })} options={[["sans", "Clean"], ["serif", "Serif"], ["mono", "Mono"], ["hand", "Handwritten"]]} />
        </div>
        <div className="np-fsec"><h4>Text size · {look.size}px{isNarrow && look.size < 16 ? " (16 on phones)" : ""}</h4>
          <input type="range" min="13" max="26" step="1" value={look.size} onChange={(e) => saveLook({ size: +e.target.value })} aria-label="Text size" />
        </div>
        <div className="np-fsec"><h4>Line spacing · {look.spacing.toFixed(1)}</h4>
          <input type="range" min="1.3" max="2.4" step="0.1" value={look.spacing} onChange={(e) => saveLook({ spacing: +e.target.value })} aria-label="Line spacing" />
        </div>
        <div className="np-fsec"><h4>Note list</h4>
          <NpChoice label="Note list style" value={look.listStyle} onChange={(v) => saveLook({ listStyle: v })} options={[["list", "List"], ["cards", "Cards"], ["compact", "Compact"]]} />
          <label className="np-check"><input type="checkbox" checked={look.previews} onChange={(e) => saveLook({ previews: e.target.checked })} /> Show previews</label>
        </div>
        <div className="np-sheetfoot">
          <button className="np-linkbtn" onClick={() => saveNp({ look: { ...NP_DEFAULT_LOOK } })}>Reset look</button>
          <button className="np-btn primary" onClick={close}>Done</button>
        </div>
      </NpSheet>
    );
    if (sheet === "menu" && sel) return (
      <NpSheet title={noteTitle(sel)} onClose={close}>
        <div className="np-fsec"><h4>Color</h4>
          <div className="np-swatches" role="radiogroup" aria-label="Note color">
            {[["", "None"], ...Object.keys(NOTE_COLORS).map((c) => [c, c[0].toUpperCase() + c.slice(1)])].map(([c, label]) => (
              <button key={c || "none"} role="radio" aria-checked={(sel.color || "") === c} aria-label={label} title={label}
                className={(sel.color || "") === c ? "np-swatch on" : "np-swatch"} style={{ "--sw": NOTE_COLORS[c] || "transparent" }}
                onClick={() => updateNote(sel.id, { color: c }, { touch: false })}>{!c && <NpIcon name="close" size={12} />}</button>
            ))}
          </div>
        </div>
        <div className="np-menu">
          <button onClick={() => { updateNote(sel.id, { pinned: !sel.pinned }, { touch: false }); close(); }}><NpIcon name="pin" />{sel.pinned ? "Unpin" : "Pin to the top"}</button>
          <button onClick={() => (sel.locked ? unlockForGood(sel) : lockNote(sel))}><NpIcon name={sel.locked ? "unlock" : "lock"} />{sel.locked ? "Remove lock" : "Lock this note"}</button>
          <button onClick={() => openScheduleSheet(sel)}><NpIcon name="calendar" />Checklist → Schedule</button>
          <button onClick={() => { onSendToJournal(notePlain(sel)); close(); }}><NpIcon name="journal" />Send to journal</button>
          <button onClick={() => runSummary(sel)}><NpIcon name="sparkle" />Summarize<small>AI</small></button>
          <button onClick={() => runTidy(sel)}><NpIcon name="sparkle" />Tidy up<small>AI</small></button>
          <button onClick={() => openHistory(sel)}><NpIcon name="history" />Version history</button>
          <button onClick={() => duplicate(sel)}><NpIcon name="copy" />Duplicate</button>
          <button onClick={() => share(sel)}><NpIcon name="share" />Share or copy</button>
          <button className="danger" onClick={() => softDelete(sel)}><NpIcon name="trash" />Delete</button>
        </div>
        <p className="np-hint">AI actions send only this note to the AI, and only when you tap them.</p>
      </NpSheet>
    );
    if (sheet === "history" && sel && sheetData) {
      const hist = sheetData.list || [];
      const pick = sheetData.pick != null ? hist[sheetData.pick] : null;
      return (
        <NpSheet title="Version history" onClose={close} wide>
          {sheetData.loading ? <p className="np-hint"><span className="xo-spin" /> Loading versions…</p>
            : hist.length === 0 ? <p className="np-hint">Earlier versions are kept automatically as you edit. There aren't any for this note yet.</p> : (
            <div className="np-hist">
              <ul>
                {hist.map((h, i) => (
                  <li key={h.t + ":" + i}>
                    <button className={sheetData.pick === i ? "on" : ""} onClick={() => setSheetData({ ...sheetData, pick: i })}>
                      <b>{new Date(h.t).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</b>
                      <span>{snippet(noteLines(h.body).filter((l) => !IMG_TOKEN_RE.test(l)).join(" ").trim(), 70) || "(empty)"}</span>
                    </button>
                  </li>
                ))}
              </ul>
              <div className="np-histview">
                {pick ? (
                  <>
                    {pick.title && <div className="np-rh np-rh1">{pick.title}</div>}
                    <NpRead body={pick.body} readOnly onToggle={() => {}} onEditLine={() => {}} />
                  </>
                ) : <p className="np-hint">Pick a version to preview it.</p>}
              </div>
            </div>
          )}
          {pick && (
            <div className="np-sheetfoot">
              <button className="np-btn primary" onClick={() => { updateNote(sel.id, { title: pick.title, body: pick.body }, { snapshot: true, now: true }); close(); setMode("read"); say("Restored that version"); }}><NpIcon name="restore" />Restore this version</button>
            </div>
          )}
        </NpSheet>
      );
    }
    if (sheet === "schedule" && sheetData) {
      const rows = sheetData.rows;
      const setRow = (i, patch) => setSheetData({ ...sheetData, rows: rows.map((r, k) => (k === i ? { ...r, ...patch } : r)) });
      const ready = rows.filter((r) => r.include && r.date);
      return (
        <NpSheet title="Checklist → Schedule" onClose={close}>
          {rows.length === 0 ? <p className="np-hint" style={{ marginTop: 0 }}>This note has no open checklist items yet.</p> : (
            <>
              <p className="np-hint" style={{ marginTop: 0 }}>Pick which to-dos go on your Schedule and when. Dates written in the item ("tomorrow at 3pm", "Fri", "9/30") are filled in for you.</p>
              <ul className="np-schedrows">
                {rows.map((r, i) => (
                  <li key={r.line}>
                    <label className="np-check"><input type="checkbox" checked={r.include} onChange={(e) => setRow(i, { include: e.target.checked })} /> <span>{r.text}</span></label>
                    <div className="np-schedwhen">
                      <input type="date" value={r.date} onChange={(e) => setRow(i, { date: e.target.value, include: !!e.target.value })} aria-label={"Date for " + r.text} />
                      <input type="time" value={r.time} onChange={(e) => setRow(i, { time: e.target.value })} aria-label={"Time for " + r.text} />
                    </div>
                    {r.include && !r.date && <p className="np-hint np-warn">Pick a date to add this one.</p>}
                  </li>
                ))}
              </ul>
            </>
          )}
          <div className="np-sheetfoot">
            <button className="np-btn" onClick={close}>Cancel</button>
            <button className="np-btn primary" disabled={!ready.length} onClick={() => {
              onAddSchedule(ready.map((r) => ({ title: r.text, date: r.date, time: r.time, note: "From note: " + noteTitle(sheetData.note) })));
              close(); say("Added " + ready.length + " to your Schedule");
            }}>{ready.length ? "Add " + ready.length + " to Schedule" : "Add to Schedule"}</button>
          </div>
        </NpSheet>
      );
    }
    if ((sheet === "summary" || sheet === "tidy") && sheetData && sel) return (
      <NpSheet title={sheet === "summary" ? "Summary" : "Tidy up"} onClose={close} wide={sheet === "tidy"}>
        {sheetData.busy ? <p className="np-hint"><span className="xo-spin" /> {sheet === "summary" ? "Summarizing…" : "Tidying…"}</p>
          : sheetData.err ? <p className="xo-error" style={{ marginTop: 0 }}>{sheetData.err}</p> : (
            <>
              {sheet === "tidy" && <p className="np-hint" style={{ marginTop: 0 }}>Here's the tidied version. If you use it, your original stays in version history.</p>}
              <div className={"np-aiout" + (sheet === "tidy" ? " " + paperClass : "")}><NpRead body={sheetData.text} readOnly onToggle={() => {}} onEditLine={() => {}} /></div>
              <div className="np-sheetfoot">
                {sheet === "summary" ? (
                  <>
                    <button className="np-btn" onClick={async () => { try { await navigator.clipboard.writeText(sheetData.text); say("Copied"); } catch (e) { say("Couldn't copy"); } }}><NpIcon name="copy" />Copy</button>
                    <button className="np-btn primary" onClick={() => { updateNote(sel.id, { body: "# Summary\n" + sheetData.text + "\n\n---\n" + sel.body }, { snapshot: true, now: true }); close(); }}>Add to top of note</button>
                  </>
                ) : (
                  <>
                    <button className="np-btn" onClick={close}>Keep mine</button>
                    <button className="np-btn primary" onClick={() => { updateNote(sel.id, { body: sheetData.text }, { snapshot: true, now: true }); close(); say("Tidied. Your original is in version history."); }}>Use tidied version</button>
                  </>
                )}
              </div>
            </>
          )}
      </NpSheet>
    );
    if (sheet === "lock" && sheetData) {
      const d = sheetData;
      const title = { unlock: "Unlock note", set: np.lockHash ? "Set a new lock code" : "Create a lock code", reset: "Reset your lock code" }[d.purpose];
      return (
        <NpSheet title={title} onClose={close}>
          {d.purpose === "set" && <p className="np-hint" style={{ marginTop: 0 }}>One code for all your locked notes, on every device you sign in to. It hides them behind the code; it isn't encryption.</p>}
          {d.purpose === "reset" && <p className="np-hint" style={{ marginTop: 0 }}>Confirm it's you with your account password, then choose a new code.</p>}
          <form onSubmit={(e) => { e.preventDefault(); submitLock(); }}>
            {d.purpose === "reset" ? (
              <input className="np-input" type="password" autoComplete="current-password" autoFocus placeholder="Account password"
                value={d.pass} onChange={(e) => setSheetData({ ...d, pass: e.target.value, err: "" })} />
            ) : (
              <input className="np-input" type="password" inputMode="numeric" autoComplete="off" autoFocus placeholder="Lock code"
                value={d.code} onChange={(e) => setSheetData({ ...d, code: e.target.value, err: "" })} />
            )}
            {d.purpose === "set" && (
              <input className="np-input" type="password" inputMode="numeric" autoComplete="off" placeholder="Type it again"
                value={d.code2} onChange={(e) => setSheetData({ ...d, code2: e.target.value, err: "" })} style={{ marginTop: 8 }} />
            )}
            {d.err && <p className="xo-error" role="alert">{d.err}</p>}
            <div className="np-sheetfoot">
              {d.purpose === "unlock" && <button type="button" className="np-linkbtn" onClick={() => setSheetData({ ...d, purpose: "reset", err: "", code: "" })}>Forgot code?</button>}
              <button type="button" className="np-btn" onClick={close}>Cancel</button>
              <button type="submit" className="np-btn primary" disabled={d.busy}>{d.busy ? "Checking…" : d.purpose === "unlock" ? "Unlock" : d.purpose === "reset" ? "Continue" : "Save code"}</button>
            </div>
          </form>
        </NpSheet>
      );
    }
    if (sheet === "confirm" && sheetData) return (
      <NpSheet title={sheetData.confirmEmpty ? "Empty Recently deleted?" : "Delete for good?"} onClose={close}>
        <p className="np-hint" style={{ marginTop: 0 }}>{sheetData.confirmEmpty ? "Every note in Recently deleted, and its photos, will be gone for good." : "This note and its photos will be gone for good. This can't be undone."}</p>
        <div className="np-sheetfoot">
          <button className="np-btn" onClick={close}>Cancel</button>
          <button className="np-btn danger" onClick={() => { if (sheetData.confirmEmpty) emptyTrash(); else deleteForever(sheetData.note); }}><NpIcon name="trash" />Delete for good</button>
        </div>
      </NpSheet>
    );
    return null;
  };

  const hiddenBlocks = baseLayout.filter((b) => b.hidden);
  // phones keep typing text at 16px+ so iOS never zooms the page when you tap in
  const textSize = isNarrow ? Math.max(16, look.size) : look.size;
  const rootStyle = {
    "--np-font": NP_FONTS[look.font] || NP_FONTS.sans,
    "--np-size": textSize + "px",
    "--np-lh": String(look.spacing),
    "--np-line": Math.round(textSize * look.spacing * 100) / 100 + "px",
  };

  return (
    <div className={"np-root" + (layoutMode ? " np-editing" : "")} style={rootStyle}>
      <style>{NP_CSS}</style>
      <div className="np-top">
        <h2>Notepad</h2>
        <div className="np-topr">
          <button className="np-new" onClick={() => createNote()}><NpIcon name="plus" size={15} />New note</button>
          <button className="np-btn" onClick={() => setSheet("look")}><NpIcon name="look" />Look</button>
          <button className={layoutMode ? "np-btn on" : "np-btn"} onClick={() => setLayoutMode(!layoutMode)} aria-pressed={layoutMode}><NpIcon name="layout" />Layout</button>
        </div>
      </div>
      <p className="np-privacy">Your notes are yours. The AI only reads a note when you tap an AI action on it.</p>

      {layoutMode && (
        <div className="np-layoutbar">
          <p>Drag a block's top bar to move it anywhere. Drag its corner to resize. <b>Auto height</b> makes a block grow to fit what's in it. {isNarrow ? "This phone layout" : "This layout"} is saved separately from your {isNarrow ? "iPad and computer" : "phone"} one.</p>
          <div className="np-row2">
            {hiddenBlocks.map((b) => <button key={b.id} className="np-btn" onClick={() => showBlock(b.id)}><NpIcon name="plus" />{NP_BLOCKS[b.id].label}</button>)}
            <button className="np-btn" onClick={() => commitLayout(npCompact(layout))}>Tidy gaps</button>
            <button className="np-btn" onClick={resetLayout}>Reset</button>
            <button className="np-btn primary" onClick={() => setLayoutMode(false)}>Done</button>
          </div>
        </div>
      )}

      <div className="np-grid" ref={gridRef} style={{ height: gridH }}>
        {layoutMode && drag && liveLayout && (() => {
          const b = liveLayout.find((x) => x.id === drag.id);
          return b ? <div className="np-ghost" style={blockStyle(b)} /> : null;
        })()}
        {shown.map((b) => (
          <section key={b.id} ref={blockRef(b.id)}
            className={"np-block np-b-" + b.id + (b.fit ? " fit" : "") + (drag && drag.id === b.id ? " dragging" : "")}
            style={blockStyle(b)} aria-label={NP_BLOCKS[b.id].label}>
            {layoutMode && (
              <div className="np-grip" tabIndex={0} role="button"
                aria-label={"Move " + NP_BLOCKS[b.id].label + ". Arrow keys move it, Shift and arrow keys resize it."}
                onPointerDown={(e) => startDrag(e, b, "move")} onPointerMove={onDragMove}
                onPointerUp={onDragEnd} onPointerCancel={onDragEnd} onKeyDown={(e) => nudge(e, b)}>
                <span className="np-griplabel"><NpIcon name="grip" size={14} />{NP_BLOCKS[b.id].label}</span>
                <span className="np-gripbtns">
                  {NP_BLOCKS[b.id].fit && (
                    <button className={b.fit ? "on" : ""} aria-pressed={!!b.fit} onPointerDown={(e) => e.stopPropagation()} onClick={() => toggleFit(b.id)} title="Grow to fit what's inside">
                      <NpIcon name="fit" size={13} />Auto height
                    </button>
                  )}
                  <button onPointerDown={(e) => e.stopPropagation()} onClick={() => hideBlock(b.id)} aria-label={"Hide " + NP_BLOCKS[b.id].label}><NpIcon name="hide" size={13} />Hide</button>
                </span>
              </div>
            )}
            <div className="np-bbody">
              {b.id === "editor" ? blockBody(b.id) : <div className="np-bin" ref={binRef(b.id)}>{blockBody(b.id)}</div>}
            </div>
            {layoutMode && (
              <div className="np-resize" aria-hidden="true" title="Drag to resize"
                onPointerDown={(e) => startDrag(e, b, "resize")} onPointerMove={onDragMove}
                onPointerUp={onDragEnd} onPointerCancel={onDragEnd}><NpIcon name="resize" size={16} /></div>
            )}
          </section>
        ))}
      </div>

      {focus && (
        <div className="np-focus" role="dialog" aria-modal="true" aria-label={sel ? noteTitle(sel) : "Note"}>
          <div className="np-focusbody">{renderEditor(true)}</div>
        </div>
      )}
      <React.Fragment key={sheet || "none"}>{renderSheet()}</React.Fragment>
      {toast && <div className="np-toast" role="status">{toast}</div>}
    </div>
  );
}
