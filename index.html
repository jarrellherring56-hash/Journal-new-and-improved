// ---------- push notification helpers ----------
const urlB64ToUint8 = (b64) => {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const s = (b64 + pad).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(s);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
};
const pushSupported = () =>
  "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

// Subscribe this device and tell the server (endpoint + timezone + nudge time).
// Running inside the native iOS app (Capacitor) rather than a browser/PWA?
const isNativeApp = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
// Ask iOS for permission and get an APNs device token via the Capacitor plugin.
async function nativePushToken() {
  const PN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
  if (!PN) return { error: "Notifications aren't available in this build." };
  const perm = await PN.requestPermissions();
  if (perm.receive !== "granted") return { error: "Notifications are off — turn them on in Settings → Journal → Notifications." };
  return await new Promise((resolve) => {
    let done = false;
    PN.addListener("registration", (t) => { if (!done) { done = true; try { localStorage.setItem("daybook:apns", t.value); } catch (e) {} resolve({ token: t.value }); } });
    PN.addListener("registrationError", () => { if (!done) { done = true; resolve({ error: "Couldn't register this device for notifications." }); } });
    PN.register();
    setTimeout(() => { if (!done) { done = true; resolve({ error: "Notification registration timed out — try again." }); } }, 15000);
  });
}

// Returns an error string, or "" on success.
async function enablePush(reminderTime) {
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
  const token = window.__session && window.__session.access_token;
  const save = async (subscription) => {
    const r = await fetch(API_BASE + "/api/push", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ subscription, tz, reminderTime }),
    });
    if (!r.ok) { const d = await r.json().catch(() => ({})); return d.error || "Could not turn on reminders."; }
    return "";
  };
  if (isNativeApp()) {
    const res = await nativePushToken();
    if (res.error) return res.error;
    return await save({ endpoint: res.token, platform: "ios", token: res.token });
  }
  if (!pushSupported()) return "This device can't do notifications. On iPhone, add the app to your Home Screen first.";
  const perm = await Notification.requestPermission();
  if (perm === "denied") return "Notifications are blocked — allow them in your phone/browser settings.";
  if (perm !== "granted") return "Tap Reminders → On to allow notifications on this device.";
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8(VAPID_PUBLIC),
    });
  }
  return await save(sub);
}

async function disablePush() {
  const token = window.__session && window.__session.access_token;
  const del = (subscription) => fetch(API_BASE + "/api/push", {
    method: "DELETE",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: JSON.stringify({ subscription }),
  }).catch(() => {});
  try {
    if (isNativeApp()) {
      let t = ""; try { t = localStorage.getItem("daybook:apns") || ""; } catch (e) {}
      if (t) await del({ endpoint: t });
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) { await del(sub); await sub.unsubscribe().catch(() => {}); }
  } catch (e) { /* best effort */ }
}

// ---------- privacy lock (per-device, stores only a hash) ----------
const PIN_KEY = "daybook:pin:v1";
async function hashPin(pin) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("daybook:" + pin));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

// ---------- rewind: resurface a random past note (starred ones get a boost) ----------
function pickRewind(days) {
  const today = dayKey();
  const pool = [];
  for (const k of Object.keys(days)) {
    if (k === today) continue;
    for (const en of days[k].entries || []) {
      for (const s of en.segments || []) {
        if (!s.type || s.type === "text" || s.type === "qa") pool.push({ day: k, seg: s });
      }
    }
  }
  if (!pool.length) return null;
  const favs = pool.filter((p) => p.seg.fav);
  const src = favs.length && Math.random() < 0.5 ? favs : pool;
  return src[Math.floor(Math.random() * src.length)];
}

// ---------- date helpers ----------
const dayKey = (d = new Date()) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
};
const prettyDate = (key, short = false) => {
  const [y, m, d] = key.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  if (short) return date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const today = dayKey();
  const yest = dayKey(new Date(Date.now() - 86400000));
  const base = date.toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric",
    year: y !== new Date().getFullYear() ? "numeric" : undefined,
  });
  if (key === today) return `Today — ${base}`;
  if (key === yest) return `Yesterday — ${base}`;
  return base;
};

  let v = 0, n = 0;
  for (const k of keys) for (const en of days[k].entries || []) for (const sg of en.segments || []) {
    const emo = (sg.emotion || "neutral").toLowerCase();
    if (emo in VALENCE) { v += VALENCE[emo]; n++; }
  }
  const avg = n ? v / n : 0;
  if (avg <= -0.7) return "They've been in a heavy stretch lately — keep the tone gentle, grounding and unhurried; do not be chirpy or push positivity, and do not point out that they've seemed down.";
  if (avg >= 0.9) return "They've been in a bright stretch lately — you can be a little warmer and more playful, and help them hold onto what's working.";
  return "Keep an even, warm, steady tone.";
}

// and quietly serve more of those. Device-local, invisible — never surfaced.
const angleStatsKey = (uid) => "daybook:angles:" + uid;
function getAngleStats(uid) { try { return JSON.parse(localStorage.getItem(angleStatsKey(uid)) || "{}"); } catch (e) { return {}; } }
function bumpAngle(uid, idx, field) {
  if (uid == null || idx == null) return;
  const s = getAngleStats(uid); const a = s[idx] || (s[idx] = { shown: 0, answered: 0 });
  a[field] = (a[field] || 0) + 1;
  try { localStorage.setItem(angleStatsKey(uid), JSON.stringify(s)); } catch (e) { }
}
function pickAngle(uid) {
  const s = getAngleStats(uid);
  // Laplace-smoothed answer-rate + a floor so every angle keeps getting tried.
  const weights = PROMPT_ANGLES.map((_, i) => {
    const a = s[i] || { shown: 0, answered: 0 };
    return (a.answered + 1) / (a.shown + 2) + 0.15;
  });
  const total = weights.reduce((x, y) => x + y, 0);
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r <= 0) return i; }
  return Math.floor(Math.random() * PROMPT_ANGLES.length);
}

const URL_RE = /(https?:\/\/[^\s<>"')]+|www\.[^\s<>"')]+)/gi;
function Linkify({ text }) {
  const parts = String(text).split(URL_RE);
  return (
    <>
      {parts.map((part, i) => {
        if (!part) return null;
        if (part.match(URL_RE)) {
          const href = safeUrl(part.startsWith("http") ? part : `https://${part}`);
          return (
            <a key={i} href={href} target="_blank" rel="noopener noreferrer" className="xo-link">
              {part}
            </a>
          );
        }
        return <span key={i}>{part}</span>;
      })}
    </>
  );
}

// ---------- image compression ----------
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1000;
        let { width, height } = img;
        if (width > max || height > max) {
          const s = Math.min(max / width, max / height);
          width = Math.round(width * s);
          height = Math.round(height * s);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = () => reject(new Error("Couldn't read image"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Couldn't read file"));
    reader.readAsDataURL(file);
  });
}

// days structure: { "2026-07-20": { entries: [{id, time, segments:[{id,type,text,topic,emotion,...}]}] } }
function normalizeDays(d) {
  const out = {};
  let changed = false;
  for (const k of Object.keys(d || {})) {
    const day = d[k];
    if (day && Array.isArray(day.entries)) { out[k] = day; continue; }
    if (day && Array.isArray(day.sections)) {
      // legacy topic-section shape → one entry per old section
      changed = true;
      out[k] = {
        entries: day.sections.map((sec) => ({
          id: uid(),
          time: (sec.items[0] && sec.items[0].time) || "",
          segments: sec.items.map((it) => ({ ...it, topic: it.topic || sec.topic })),
        })),
      };
    }
  }
  return { days: out, changed };
}
function eachSegment(days, fn) {
  for (const k of Object.keys(days)) {
    for (const entry of days[k].entries || []) {
      for (const seg of entry.segments || []) fn(k, entry, seg);
    }
  }
}
function buildVibeProfile(days) {
  const topics = {};
  const moods = {};
  let count = 0;
  eachSegment(days, (k, entry, seg) => {
    count++;
    for (const t of segTags(seg)) topics[t] = (topics[t] || 0) + 1;
    const m = (seg.emotion || "neutral").toLowerCase();
    moods[m] = (moods[m] || 0) + 1;
  });
  const top = (obj, n) =>
    Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, n)
      .map(([k, v]) => `${k} (${v})`).join(", ");
  return {
    count,
    text: `Total items: ${count}. Frequent topics: ${top(topics, 5) || "none yet"}. Mood mix: ${top(moods, 4) || "none yet"}.`,
  };
}

// ---------- AI calls ----------
function extractJSONObject(raw) {
  const cleaned = raw.replace(/```json|```/g, "").trim();
  const s = cleaned.indexOf("{");
  const e = cleaned.lastIndexOf("}");
  if (s === -1 || e === -1 || e <= s) throw new Error("No JSON found in response");
  return JSON.parse(cleaned.slice(s, e + 1));
}

// `web: true` asks the server to let the model search the web (costs extra —
// only the question-answering paths request it, never the tagging/recap ones).
async function callClaudeRaw(prompt, maxTokens = 1000, web = false) {
  const token = window.__session && window.__session.access_token;
  const response = await fetch(API_BASE + "/api/ai", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify({ prompt, max_tokens: maxTokens, web }),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || ("API request failed: " + response.status));
  return {
    text: String(data.text || "").trim(),
    sources: Array.isArray(data.sources) ? data.sources : [],
    webError: data.webError || null,
  };
}
async function callClaude(prompt, maxTokens = 1000) {
  return (await callClaudeRaw(prompt, maxTokens)).text;
}

async function classifyEntry(text, vibeText, existingTopics = []) {
  const topicHint = existingTopics.length
    ? `\nIMPORTANT for organization: this journal already uses these tags: ${existingTopics.join(", ")}. If a segment fits one of them, REUSE that exact tag (same spelling) instead of inventing a near-duplicate. Only create a new tag when nothing existing fits.`
    : "";
  const raw = await callClaude(`You label journal writing. Split the entry below into segments wherever the subject or emotion shifts (often sentence by sentence, but keep consecutive sentences about the same thing together as one segment). Segments may contain links — keep them intact.

For each segment return:
- "text": the segment's exact text from the entry
- "tags": an array of 2-4 SPECIFIC tags describing what this segment is really about
- "emotion": exactly one of: happy, sad, anxious, calm, excited, angry, nostalgic, hopeful, frustrated, neutral${topicHint}

TAG RULES — this is the most important part:
- Each tag is 1-3 words, Title Case.
- Be SPECIFIC and personal, never generic. NEVER use vague filler tags like "Daily Reflection", "Journal Entry", "Personal Thoughts", "Reflection", "Notes", "Life", "Update", "Misc".
- Name the actual subject AND the emotional texture. Good examples: "Relationship Loss", "Family Frustration", "Money Stress", "Missing Her", "Work Burnout", "Self Doubt", "Late Night Spiral", "Old Friends", "Gym Progress", "Day Trading", "Grief", "Feeling Behind", "Small Win".
- Mix layers: at least one tag for the concrete subject (the person, place, activity) and at least one for the underlying feeling or theme. A segment about arguing with a parent might be ["Family Frustration", "Feeling Unheard", "Mom"].
- Tags should be reusable across entries so patterns build up over time.

Also write "tagline": one short line (under 14 words, no quotes, no emoji) for the top of this person's journal. Make it play off what they keep writing about and their overall vibe, in a cool, late-night tone that speaks to them directly. Their journal profile so far (including this entry): ${vibeText}

Respond with ONLY a raw JSON object: {"segments": [...], "tagline": "..."} — no markdown, no backticks.

Entry:
"""${text}"""`, 8000);
  const parsed = extractJSONObject(raw);
  const BAD_TAGS = ["daily reflection", "journal entry", "personal thoughts", "reflection", "notes", "note", "life", "update", "misc", "general", "thoughts", "entry"];
  const segments = (parsed.segments || [])
    .filter((s) => s && s.text)
    .map((s) => {
      let tags = Array.isArray(s.tags) ? s.tags : (s.topic ? [s.topic] : []);
      tags = tags
        .map((t) => String(t || "").trim())
        .filter(Boolean)
        .filter((t) => !BAD_TAGS.includes(t.toLowerCase()))
        .slice(0, 4);
      if (!tags.length) tags = ["Unsorted"];
      return {
        text: String(s.text).trim(),
        tags,
        topic: tags[0], // primary tag — keeps older code/data paths working
        emotion: String(s.emotion || "neutral").toLowerCase(),
      };
    });
  return { segments, tagline: String(parsed.tagline || "").trim() };
}

async function answerQuestion(question, identity = "", web = false) {
  const res = await callClaudeRaw(`You are the AI inside someone's personal journal. ${identity} Answer their question below helpfully and warmly in a few sentences (under 120 words).${web ? " If answering well needs current information (news, prices, recent events, anything after your training), search the web first and answer from what you find." : ""} Then, on the LAST line only, output a JSON object like {"topic": "1-3 word topic label", "emotion": "one of: happy, sad, anxious, calm, excited, angry, nostalgic, hopeful, frustrated, neutral"} describing the question. Do not use markdown.

Question:
"""${question}"""`, 1000, web);
  const raw = res.text;
  const lines = raw.split("\n").filter((l) => l.trim());
  let meta = { topic: "AI Answers", emotion: "neutral" };
  let answer = raw;
  try {
    const last = lines[lines.length - 1];
    if (last.trim().startsWith("{")) {
      meta = { ...meta, ...JSON.parse(last) };
      answer = lines.slice(0, -1).join("\n").trim();
    }
  } catch (e) { /* keep defaults */ }
  return {
    answer,
    topic: String(meta.topic || "AI Answers"),
    emotion: String(meta.emotion || "neutral").toLowerCase(),
    sources: res.sources,
  };
}

// ---------- long-entry handling ----------
const CHUNK_SIZE = 4000;
function splitIntoChunks(text, max = CHUNK_SIZE) {
  if (text.length <= max) return [text];
  const chunks = [];
  let current = "";
  const paragraphs = text.split(/\n{2,}/);
  const pieces = [];
  for (const p of paragraphs) {
    if (p.length <= max) pieces.push(p);
    else {
      // split on sentence ends without regex lookbehind (Safari-safe)
      const parts = p.split(/([.!?]+\s+)/);
      const sents = [];
      for (let i = 0; i < parts.length; i += 2) {
        const sent = (parts[i] || "") + (parts[i + 1] || "");
        if (sent) sents.push(sent);
      }
      let buf = "";
      for (const sent of sents) {
        if ((buf + sent).length > max && buf) { pieces.push(buf.trim()); buf = sent; }
        else buf += sent;
      }
      if (buf.trim()) pieces.push(buf.trim());
    }
  }
  for (const piece of pieces) {
    if ((current + "\n\n" + piece).length > max && current) {
      chunks.push(current);
      current = piece;
    } else {
      current = current ? current + "\n\n" + piece : piece;
    }
  }
  if (current) chunks.push(current);
  return chunks;
}

async function withRetry(fn, tries = 2) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try { return await fn(); }
    catch (e) { lastErr = e; }
  }
  throw lastErr;
}

async function classifyLongEntry(text, vibeText, existingTopics = []) {
  const chunks = splitIntoChunks(text);
  const allSegments = [];
  let tagline = "";
  for (const chunk of chunks) {
    const result = await withRetry(() => classifyEntry(chunk, vibeText, existingTopics));
    allSegments.push(...result.segments);
    if (result.tagline) tagline = result.tagline;
  }
  return { segments: allSegments, tagline };
}

// ---------- insights helpers ----------
function dominantEmotionByDay(days) {
  const out = {};
  for (const k of Object.keys(days)) {
    const tally = {};
    for (const entry of days[k].entries || []) {
      for (const seg of entry.segments || []) {
        const m = (seg.emotion || "neutral").toLowerCase();
        tally[m] = (tally[m] || 0) + 1;

    const best = Object.entries(tally).sort((a, b) => b[1] - a[1])[0];
    if (best) out[k] = best[0];
  }
  return out;
}
function computeStreak(days) {
  let streak = 0;
  const d = new Date();
  if (!days[dayKey(d)]) d.setDate(d.getDate() - 1); // today not written yet doesn't break it
  while (days[dayKey(d)]) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}
function buildDigest(days, numDays = 7) {
  const keys = Object.keys(days).sort().slice(-numDays);
  let out = [];
  for (const k of keys) {
    for (const entry of days[k].entries || []) {
      const topics = [...new Set((entry.segments || []).flatMap(segTags))].join("/");
      const texts = (entry.segments || [])
        .filter((s) => !s.type || s.type === "text" || s.type === "qa")
        .map((s) => (s.type === "qa" ? s.q : s.text))
        .join(" | ")
        .slice(0, 220);
      if (texts) out.push(`${k} · ${topics}: ${texts}`);
    }
  }
  return out.join("\n").slice(0, 6000);
}
function itemPlainText(item) {
  if (item.type === "qa") return `Q: ${item.q}\nA: ${item.a}`;
  if (item.type === "image") return "[photo]";
  return item.text || "";
}

// Compact month-by-month mood + theme summary across ALL history. Lets the AI
// answer time/mood questions ("when was I happiest this year?", "when was I most
// stressed?") without needing every entry's full text in the prompt.
function buildMoodTimeline(days) {
  const months = {};
  eachSegment(days, (k, entry, seg) => {
    const ym = k.slice(0, 7);
    const m = months[ym] || (months[ym] = { n: 0, val: 0, moods: {}, tags: {} });
    m.n++;
    const emo = (seg.emotion || "neutral").toLowerCase();
    m.moods[emo] = (m.moods[emo] || 0) + 1;
    m.val += (VALENCE[emo] || 0);
    for (const t of segTags(seg)) m.tags[t] = (m.tags[t] || 0) + 1;
  });
  const topKey = (obj) => (Object.entries(obj).sort((a, b) => b[1] - a[1])[0] || ["—"])[0];
  const topN = (obj, n) => Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, n).map(([kk]) => kk).join("/");
  return Object.keys(months).sort().map((ym) => {
    const m = months[ym];
    const avg = (m.val / m.n);
    return `${ym}: ${m.n} notes, mostly ${topKey(m.moods)}, avg mood ${avg >= 0 ? "+" : ""}${avg.toFixed(1)}, themes: ${topN(m.tags, 3) || "—"}`;
  }).join("\n");
}

// "On this day" — resurface what you wrote at the same point in earlier months/years.
function onThisDay(days) {
  const now = new Date();
  const offsets = [
    { label: "a month ago", d: new Date(now.getFullYear(), now.getMonth() - 1, now.getDate()) },
    { label: "three months ago", d: new Date(now.getFullYear(), now.getMonth() - 3, now.getDate()) },
    { label: "six months ago", d: new Date(now.getFullYear(), now.getMonth() - 6, now.getDate()) },
    { label: "a year ago", d: new Date(now.getFullYear() - 1, now.getMonth(), now.getDate()) },
  ];
  const out = [];
  for (const o of offsets) {
    const key = dayKey(o.d);
    const day = days[key];
    if (!day || !(day.entries || []).length) continue;
    let text = "";
    for (const en of day.entries) {
      for (const sg of en.segments || []) { const t = itemPlainText(sg).trim(); if (t) { text = t; break; } }
      if (text) break;
    }
    if (text) out.push({ label: o.label, key, text: text.slice(0, 220) });
  }
  return out;
}

// A running list of your brighter moments — segments the AI tagged with an
// uplifting mood — newest first. This is the "wins / gratitude" feed.
function buildWins(days) {
  const wins = [];
  const keys = Object.keys(days).sort().reverse();
  for (const k of keys) {
    for (const en of days[k].entries || []) {
      for (const sg of en.segments || []) {
        const emo = (sg.emotion || "").toLowerCase();
        const txt = itemPlainText(sg).trim();
        if (txt && (VALENCE[emo] || 0) >= 1) wins.push({ key: k, emotion: emo, text: txt.slice(0, 200) });
      }
    }
    if (wins.length >= 40) break;
  }
  return wins;
}

// Stats for a "Wrapped" recap over the current calendar month or year.
function periodStats(days, period) {
  const now = new Date();
  const prefix = period === "year" ? String(now.getFullYear()) : dayKey(now).slice(0, 7);
  const daySet = new Set();
  const moods = {}, tags = {};
  let notes = 0, val = 0, valN = 0;
  for (const k of Object.keys(days)) {
    if (!k.startsWith(prefix)) continue;
    for (const en of days[k].entries || []) {
      for (const sg of en.segments || []) {
        notes++; daySet.add(k);
        const emo = (sg.emotion || "neutral").toLowerCase();
        moods[emo] = (moods[emo] || 0) + 1; val += (VALENCE[emo] || 0); valN++;
        for (const t of segTags(sg)) tags[t] = (tags[t] || 0) + 1;
      }
    }
  }
  const top = (o, n) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n);
  return { notes, days: daySet.size, topMoods: top(moods, 3), topTags: top(tags, 6), avgVal: valN ? val / valN : 0 };
}

// ================= shareable cards (the product markets itself) =================
// Renders a branded 1080x1350 card on a <canvas> — no libraries, no tainting.
// Shares are PRIVACY-SAFE: stats/mood cards carry no entry text; a quote card is
// only ever made from a line the user explicitly chose to share.
const CARD_ACCENT = "#35E0C0";
function wrapLines(ctx, text, maxW) {
  const words = String(text).split(/\s+/);
  const lines = []; let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
async function buildShareCard(opts) {

  const g = x.createRadialGradient(W * 0.82, H * 0.14, 0, W * 0.82, H * 0.14, 760);
  g.addColorStop(0, "rgba(53,224,192,0.18)"); g.addColorStop(1, "rgba(53,224,192,0)");
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  x.shadowColor = "rgba(53,224,192,0.7)"; x.shadowBlur = 18; x.beginPath(); x.arc(PAD + 8, 132, 9, 0, Math.PI * 2); x.fill(); x.shadowBlur = 0;
  x.font = "600 24px 'Space Grotesk', system-ui, sans-serif"; x.fillStyle = "#9BE9D8";
  x.save(); x.translate(PAD + 34, 140);
  for (const ch of "JOURNAL") { x.fillText(ch, 0, 0); x.translate(x.measureText(ch).width + 7, 0); }
  x.restore();

  let y = 300;
  if (opts.label) {
    x.font = "600 26px 'Space Grotesk', system-ui, sans-serif"; x.fillStyle = CARD_ACCENT;
    x.save(); x.translate(PAD, y);
    for (const ch of opts.label.toUpperCase()) { x.fillText(ch, 0, 0); x.translate(x.measureText(ch).width + 5, 0); }
    x.restore(); y += 54;
  }
  if (opts.title) {
    x.font = "700 64px 'Space Grotesk', system-ui, sans-serif"; x.fillStyle = "#F4F6F5";
    x.fillText(opts.title, PAD, y + 40); y += 108;
  }
  // stats row (Wrapped/streak) — numbers only, no text from entries
  if (opts.stats && opts.stats.length) {
    y += 20; const colW = (W - PAD * 2) / opts.stats.length;
    opts.stats.forEach((s, i) => {
      const cx = PAD + colW * i;
      x.textAlign = "left"; x.font = "700 84px 'Space Grotesk', system-ui, sans-serif"; x.fillStyle = "#F4F6F5";
      x.fillText(String(s.n), cx, y + 70);
      x.font = "500 24px 'Inter', system-ui, sans-serif"; x.fillStyle = "#8FB9AF";
      x.fillText(String(s.l).toUpperCase(), cx, y + 112);
    });
    y += 170;
  }
  // body / quote — big, auto-fitted, wrapped
  if (opts.body) {
    let fs = opts.bodySize || 58;
    const maxW = W - PAD * 2;
    let lines;
    for (; fs >= 30; fs -= 3) {
      x.font = (opts.quote ? "600 " : "500 ") + fs + "px " + (opts.quote ? "'Space Grotesk'" : "'Inter'") + ", system-ui, sans-serif";
      lines = wrapLines(x, opts.body, maxW);
      if (lines.length * fs * 1.32 < (opts.stats ? 360 : 640)) break;
    }
    x.fillStyle = opts.quote ? "#F4F6F5" : "#D7DEDC";
    if (opts.quote) { x.font = "700 90px 'Space Grotesk', system-ui, sans-serif"; x.fillStyle = CARD_ACCENT; x.fillText("“", PAD, y + 30); y += 40; x.font = "600 " + fs + "px 'Space Grotesk', system-ui, sans-serif"; x.fillStyle = "#F4F6F5"; }
    for (const ln of lines) { x.fillText(ln, PAD, y + fs); y += fs * 1.32; }
    y += 30;
  }
  // tag chips
  if (opts.tags && opts.tags.length) {
    x.font = "500 26px 'Inter', system-ui, sans-serif"; let tx = PAD;
    for (const t of opts.tags.slice(0, 6)) {
      const tw = x.measureText(t).width + 44;
      if (tx + tw > W - PAD) break;
      x.strokeStyle = "rgba(53,224,192,0.4)"; x.lineWidth = 1.5;
      x.beginPath(); x.roundRect(tx, y, tw, 52, 26); x.stroke();
      x.fillStyle = "#9BE9D8"; x.fillText(t, tx + 22, y + 35);
      tx += tw + 12;
    }
    y += 80;
  }
  // footer brand line
  x.font = "500 26px 'Inter', system-ui, sans-serif"; x.fillStyle = "#6E7A77";
  x.fillText(opts.note || "Written in Journal", PAD, H - 96);
  return await new Promise((res) => c.toBlob((b) => res(b), "image/png"));
}
// Hand a card image to the OS share sheet; fall back to a download.
async function shareCardImage(blob, filename, text) {
  try {
    const file = new File([blob], filename, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: text || "" });
      return "shared";
    }
  } catch (e) { if (e && e.name === "AbortError") return "cancelled"; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return "downloaded";
}

// ---------- mood trend line (last 30 days) ----------
function MoodTrend({ days }) {
  const pts = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    if (!days[k]) continue;
    let sum = 0, n = 0;
    for (const en of days[k].entries || []) {
      for (const s of en.segments || []) {
        const v = VALENCE[(s.emotion || "neutral").toLowerCase()];
        sum += v === undefined ? 0 : v; n++;
      }
    }
    if (n) pts.push({ v: sum / n, k });
  }
  if (pts.length < 2) {
    return <div className="xo-empty" style={{ padding: "18px 8px" }}>Journal a few more days and your mood line will draw itself.</div>;
  }
  const W = 620, H = 190, pl = 16, pr = 16, pt = 14, pb = 14;
  // space the days that have entries evenly across the width, so the chart always fills
  const X = (idx) => pl + (pts.length === 1 ? 0.5 : idx / (pts.length - 1)) * (W - pl - pr);
  const Y = (v) => pt + (2 - v) / 4 * (H - pt - pb);
  let dl = "M " + X(0) + " " + Y(pts[0].v);
  for (let j = 1; j < pts.length; j++) dl += " L " + X(j) + " " + Y(pts[j].v);
  const area = dl + " L " + X(pts.length - 1) + " " + Y(-2) + " L " + X(0) + " " + Y(-2) + " Z";
  return (
    <svg viewBox={"0 0 " + W + " " + H} width="100%">
      <defs>
        <linearGradient id="mtrend" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.25" />
          <stop offset="100%" stopColor="var(--accent)" stopOpacity="0" />
        </linearGradient>
      </defs>
      {[2, 0, -2].map((v) => (
        <line key={v} x1={pl} y1={Y(v)} x2={W - pr} y2={Y(v)} stroke="var(--line)" strokeDasharray={v === 0 ? "" : "3 5"} />
      ))}
      <text x={pl} y={Y(2) - 4} fill="var(--faint)" fontSize="9" letterSpacing="2">BRIGHTER</text>
      <text x={pl} y={Y(-2) + 11} fill="var(--faint)" fontSize="9" letterSpacing="2">HEAVIER</text>
      <path d={area} fill="url(#mtrend)" />
      <path d={dl} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinejoin="round" />
      {pts.map((p, j) => <circle key={p.k} cx={X(j)} cy={Y(p.v)} r="3" fill="var(--accent)"><title>{p.k}</title></circle>)}
    </svg>
  );
}

// ---------- year in pixels ----------
function YearPixels({ domEmotions }) {
  const year = new Date().getFullYear();
  const jan1 = new Date(year, 0, 1);
  const total = Math.round((new Date(year + 1, 0, 1) - jan1) / 86400000);
  const todayK = dayKey();
  const cells = [];
  for (let i = 0; i < jan1.getDay(); i++) cells.push(null);
  for (let i = 0; i < total; i++) cells.push(dayKey(new Date(year, 0, 1 + i)));
  return (
    <div className="xo-yearpixels">
      {cells.map((k, idx) => {
        if (k === null) return <i key={"pad" + idx} className="pad" />;
        const e = domEmotions[k] ? emotionOf(domEmotions[k]) : null;
        return (
          <i
            key={k}
            className={k > todayK ? "future" : ""}
            title={prettyDate(k, true) + (e ? " — " + e.label : "")}
            style={e ? { background: e.dot, borderColor: e.dot } : undefined}
          />
        );
      })}
    </div>
  );
}

// ---------- web-search citations ----------
// Only ever hand an http(s) URL to an href. Web-search results are attacker-
// influenceable, and a "javascript:"/"data:" URL in an href is a click-to-run
// XSS. Anything that isn't plain http(s) is dropped to "#".
function safeUrl(u) {
  try {
    const parsed = new URL(String(u), window.location.origin);
    return (parsed.protocol === "http:" || parsed.protocol === "https:") ? parsed.href : "#";
  } catch (e) { return "#"; }
}

          {i + 1}. {s.title || s.url}
        </a>
      ))}
    </div>
  );
}

// "select" = light selection tick; "Light"/"Medium" = impact styles.
function haptic(type) {
  const H = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
  if (!H) return;
  try {
    if (type === "select") H.selectionStart().then(() => H.selectionEnd()).catch(() => {});
    else H.impact({ style: type }).catch(() => {});
  } catch (e) {}
}

        loadJSON(TRASH_KEY, []),
        loadJSON(GOALS_KEY, []),

      const merged = { ...DEFAULT_SETTINGS, ...s };

      if (norm.changed) saveJSON(STORAGE_KEY, norm.days);
      // auto-purge trash older than TRASH_DAYS
      const cutoff = Date.now() - TRASH_DAYS * 86400000;
      const kept = [];
      for (const entry of t) {
        const when = entry.deletedAt || Date.now(); // missing timestamp = keep, never assume old
        if (when >= cutoff) kept.push(entry.deletedAt ? entry : { ...entry, deletedAt: when });

  useEffect(() => {

      // show us an older cloud copy than what this device is still holding
      try { if (window.storage.flush) await window.storage.flush(); } catch (e) { }
      if (pullCloud.current) pullCloud.current();
    };
    document.addEventListener("visibilitychange", onWake);
    window.addEventListener("focus", onWake);
    window.addEventListener("online", onWake);
    return () => {
      document.removeEventListener("visibilitychange", onWake);
      window.removeEventListener("focus", onWake);
      window.removeEventListener("online", onWake);
    };

  const theme = THEMES[settings.theme] || THEMES.green;
  const bgTheme = BACKGROUNDS[settings.bg] || BACKGROUNDS.black;
  const pack = theme.pack || "clean";
  const neon = pack === "neon";

  // ----- keep the browser/native status bar in sync with the chosen backdrop -----
  useEffect(() => {
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", bgTheme.bg);
    // Native: flip status-bar text between light/dark so the clock stays visible.
    // Capacitor StatusBar.Style.Dark = light text; Light = dark text.
    const lightBg = ["snow", "lavender", "blush"].includes(settings.bg);
    const SB = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar;

  }, [settings.bg]);

  useEffect(() => { setMoreOpen(false); }, [view]);

  // iOS-style sticky nav: hairline border appears once the page is scrolled.
  useEffect(() => {
    const fn = () => {
      const el = document.querySelector(".xo-top");
      if (el) el.classList.toggle("scrolled", window.scrollY > 4);
    };
    window.addEventListener("scroll", fn, { passive: true });
    return () => window.removeEventListener("scroll", fn);
  }, []);

  // Desktop keyboard shortcuts — skipped while typing (except Esc, which blurs).
  useEffect(() => {
    const onKey = (e) => {
      const el = document.activeElement;
      const typing = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
      if (e.key === "Escape") {
        if (typing) { el.blur(); return; }
        if (lightbox) return setLightbox(null);
        if (moreOpen) return setMoreOpen(false);
        if (tagOpen) return setTagOpen(false);
        if (showCustomize) return setShowCustomize(false);
        if (celebrate) return setCelebrate(null);
        if (rewind) return setRewind(null);
        return;
      }
      if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "/") {
        e.preventDefault();
        setView("journal");
        setTimeout(() => { const s = document.getElementById("xo-journal-search"); if (s) s.focus(); }, 30);
      } else if (e.key === "n") {
        e.preventDefault();
        setView("journal");
        setTimeout(() => { textareaRef.current && textareaRef.current.focus(); }, 30);
      } else if (e.key >= "1" && e.key <= "5") {
        e.preventDefault();
        setView(["journal", "schedule", "goals", "ask", "insights"][Number(e.key) - 1]);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [lightbox, moreOpen, tagOpen, showCustomize, celebrate, rewind]);

  // ----- the AI's name (declared early: render-time helpers below depend on it) -----
  const aiName = String(settings.aiName || "").trim();
  const aiLabel = aiName || "AI";
  // "@ai …" always works; if you've named it, "<name>, …" works too
  const askRe = new RegExp("^(@ai\\b|hey ai\\b|ai[,:]" + (aiName ? "|@?" + escapeRe(aiName) + "\\b[,:]?" : "") + ")\\s*", "i");
  const aiIdentity = aiName
    ? `Your name is ${aiName}. They may address you as ${aiName} — answer to it naturally, and never mention being an AI model or assistant.`
    : "";
  // Web search is on by default; set it to false in Customize to turn it off.
  const webSearch = settings.webSearch !== false;

  const updateSettings = (patch) => {
    setSettings((prev) => {
      const next = { ...prev, ...patch };
      saveJSON(SETTINGS_KEY, next);
      return next;
    });
  };

  // ----- reminders / push notifications -----
  const [pushMsg, setPushMsg] = useState("");
  const [pushBusy, setPushBusy] = useState(false);
  const toggleReminders = async (on) => {
    setPushBusy(true); setPushMsg("");
    if (on) {
      const err = await enablePush(settings.reminderTime || "20:00");
      if (err) { setPushMsg(err); setPushBusy(false); return; }
      updateSettings({ remindersOn: true });
    } else {
      await disablePush();
      updateSettings({ remindersOn: false });
    }
    setPushBusy(false);
  };
  // when reminders are on and the nudge time changes, re-register so the server
  // gets the new time (and refreshes this device's timezone while we're at it)
  const changeReminderTime = async (t) => {
    updateSettings({ reminderTime: t });
    if (settings.remindersOn) { setPushBusy(true); await enablePush(t); setPushBusy(false); }
  };
  // Reminders default ON, so this device registers itself with no trip to
  // settings. Apple still requires the permission prompt to come from a real
  // user gesture, so we piggy-back on the FIRST tap/keypress anywhere in the app
  // (tapping the textarea, switching tabs, etc). The user never hunts for a
  // switch — the OS "Allow?" popup just appears the moment they start using it.
  // (Tapping "Allow" on that system popup is Apple's own step; nothing can skip it.)
  const autoPushRef = useRef(false);
  useEffect(() => {
    if (!loaded || autoPushRef.current) return;
    autoPushRef.current = true;
    if (!settings.remindersOn) return;
    // Native iOS app: register through APNs (no service worker, no gesture rule).
    if (isNativeApp()) {
      enablePush(settings.reminderTime || "20:00").then((err) => { if (err) setPushMsg(err); });
      return;
    }
    if (!pushSupported()) return;
    if (Notification.permission === "denied") return;
    if (Notification.permission === "granted") {
      enablePush(settings.reminderTime || "20:00"); // already allowed: silent re-register
      return;
    }
    const onFirst = () => {
      document.removeEventListener("pointerdown", onFirst, true);
      document.removeEventListener("keydown", onFirst, true);
      // must call requestPermission synchronously inside the gesture (iOS rule)
      enablePush(settings.reminderTime || "20:00").then((err) => {
        if (err && Notification.permission === "denied") setPushMsg(err);
      });
    };
    document.addEventListener("pointerdown", onFirst, true);
    document.addEventListener("keydown", onFirst, true);
    return () => {
      document.removeEventListener("pointerdown", onFirst, true);
      document.removeEventListener("keydown", onFirst, true);
    };
  }, [loaded]);

  // ----- owner-only member stats (who's writing, never what) -----
  const [isAdmin, setIsAdmin] = useState(false);
  const [adminData, setAdminData] = useState(null);
  const [adminBusy, setAdminBusy] = useState(false);
  const loadMembers = async () => {
    setAdminBusy(true);
    try {
      const token = window.__session && window.__session.access_token;
      const r = await fetch(API_BASE + "/api/admin", { headers: { Authorization: "Bearer " + token } });
      if (r.ok) setAdminData(await r.json());
    } catch (e) { /* ignore */ }
    setAdminBusy(false);
  };
  // probe once on load: only the owner's account gets the Members tab
  useEffect(() => {
    if (!loaded) return;
    const token = window.__session && window.__session.access_token;
    if (!token) return;
    fetch(API_BASE + "/api/admin?probe=1", { headers: { Authorization: "Bearer " + token } })
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => { if (d && d.admin) setIsAdmin(true); })
      .catch(() => {});
  }, [loaded]);

  // ----- welcome-back note (every open; the ↻ button re-rolls it) -----
  const genWelcome = () => {
    const vibe = buildVibeProfile(days);
    if (vibe.count === 0) {
      // No entries yet to riff on — generate a fresh, never-repeating prompt.
      // Falls back to the static list if the AI is unreachable (offline).
      setWelcomeBusy(true);
      (async () => {
        try { setWelcome(await genFreshPrompt()); }
        catch (e) { setWelcome(STARTER_PROMPTS[Math.floor(Math.random() * STARTER_PROMPTS.length)]); }
        finally { setWelcomeBusy(false); }
      })();
      return;
    }
    // how long they've been away
    const today = dayKey();
    const sortedKeys = Object.keys(days).sort();
    const lastKey = sortedKeys[sortedKeys.length - 1];
    let awayText = "for a little while";
    if (lastKey === today) awayText = "since earlier today";
    else if (lastKey) {
      const [y, m, d] = lastKey.split("-").map(Number);
      const daysAway = Math.max(1, Math.round((Date.now() - new Date(y, m - 1, d).getTime()) / 86400000));
      awayText = daysAway <= 1 ? "since yesterday" : `for ${daysAway} days`;
    }
    const digest = buildDigest(days, 5);
    const tone = recentTone(days);

    // Follow up on things THEY chose to put in the app — goals + calendar.
    // Only their own words/plans, never inferred behaviour.
    const ctxBits = [];
    const soonKey = dayKey(new Date(Date.now() + 2 * 86400000));
    const pastKey = dayKey(new Date(Date.now() - 3 * 86400000));
    const justHad = (sched || []).filter((s) => s.date && s.date < today && s.date >= pastKey).map((s) => s.title).filter(Boolean);
    const comingUp = (sched || []).filter((s) => s.date && s.date >= today && s.date <= soonKey && !s.done)
      .map((s) => s.title + (s.date === today ? " (today)" : "")).filter(Boolean);
    const activeGoals = (goals || []).filter((g) => !g.done && g.text).slice(0, 3).map((g) => g.text);
    if (justHad.length) ctxBits.push("On their calendar just now: " + justHad.join("; ") + " — you may gently ask how it went.");
    if (comingUp.length) ctxBits.push("Coming up for them: " + comingUp.join("; ") + " — you may ask how they're feeling going in.");
    if (activeGoals.length) ctxBits.push("Goals they set for themselves: " + activeGoals.join("; ") + ".");
    const focus = Array.isArray(settings.focus) && settings.focus.length
      ? `They've asked you to nudge them on: ${settings.focus.join(", ")}. Lean that way if it fits naturally — never force it.` : "";

    const userId = (window.__session && window.__session.user && window.__session.user.id) || "local";
    const angleIdx = pickAngle(userId);
    shownAngleRef.current = angleIdx;
    bumpAngle(userId, angleIdx, "shown");

    setWelcomeBusy(true);
    (async () => {
      try {
        const q = await callClaude(`You are the AI living inside someone's private journal. They just opened it back up — they've been away ${awayText}, and you've been sitting with their recent entries in the meantime.

TONE: ${tone}

Write them a short note (2-3 sentences, 30-70 words total) that shows you were genuinely thinking about what they wrote: reference one or two SPECIFIC things they actually wrote about (name the real thing — the trade, the person, the memory — and use their own words where you can, not just a topic label), pick up a thread they left open if there is one, and then ${PROMPT_ANGLES[angleIdx]}. Ask only ONE question, specific to them — never generic. Only ever reference things they actually wrote or planned; never guess at feelings they didn't express or point out patterns like a data report. Speak directly to them. No markdown, no emoji, no quotes, no greeting like "hey" or "welcome back".
${ctxBits.length ? "\nThings they've told the app (safe to reference):\n" + ctxBits.join("\n") + "\n" : ""}${focus ? "\n" + focus + "\n" : ""}
Their recent entries:
"""${digest}"""

Their overall profile: ${vibe.text}`, 400);
        setWelcome(q.trim());
      } catch (err) {
        const idx = new Date().getDate() % STARTER_PROMPTS.length;
        setWelcome(STARTER_PROMPTS[idx]);
      } finally {
        setWelcomeBusy(false);
      }
    })();
  };
  useEffect(() => {
    if (!loaded || promptRequested.current) return;
    promptRequested.current = true;
    genWelcome();
  }, [loaded, days]);

  // ----- rewind: surface one past note per open -----
  useEffect(() => {
    if (loaded) setRewind(pickRewind(days));
  }, [loaded]);

  // ----- weekly letter: first open each Sunday, the AI writes the week up -----
  useEffect(() => {
    if (!loaded) return;
    const now = new Date();
    if (now.getDay() !== 0) return;
    const sundayK = dayKey(now);
    (async () => {
      const last = await loadJSON(LETTER_KEY, "");
      if (last === sundayK) return;
      const digest = buildDigest(days, 7);
      if (!digest) return;
      try {
        const text = await callClaude(`You are the AI living inside someone's private journal, writing them a short Sunday letter about their week. Below is a digest of their entries (dates, topic labels, snippets). Write 100-160 words: what they focused on, how their moods moved, one specific moment worth remembering, and one gentle thought for the week ahead. Speak directly to them ("you"), warm and honest, late-night tone. No markdown, no lists, no emoji, no greeting.

Their week:
"""${digest}"""`, 800);
        if (text) {
          const time = nowTime();
          pushEntry(sundayK, {
            id: uid(), time,
            segments: [{ id: uid(), type: "recap", text: text.trim(), topic: "Weekly Letter", emotion: "calm", time }],
          });
          saveJSON(LETTER_KEY, sundayK);
        }
      } catch (e) { /* try again next open */ }
    })();
  }, [loaded]);

  // ----- image intake -----
  const takeFiles = async (files) => {
    const imgs = [...files].filter((f) => f.type && f.type.startsWith("image/"));
    if (!imgs.length) return;
    setError("");
    try {
      const compressed = await Promise.all(imgs.map(compressImage));
      setPendingImgs((prev) => [
        ...prev,
        ...compressed.map((dataUrl) => ({ id: uid(), dataUrl })),
      ]);
    } catch (e) {
      console.error(e);
      setError("Couldn't read that image — try a different one.");
    }
  };

  const onPaste = (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    const files = [];
    for (const it of items) {
      if (it.kind === "file" && it.type.startsWith("image/")) {
        const f = it.getAsFile();
        if (f) files.push(f);
      }
    }
    if (files.length) {
      e.preventDefault();
      takeFiles(files);
    }
  };

  const removePending = (id) =>
    setPendingImgs((prev) => prev.filter((p) => p.id !== id));

  // ----- voice input -----
  const toggleMic = () => {
    if (listening) {
      try { recRef.current && recRef.current.stop(); } catch (e) { /* already stopped */ }
      setListening(false);
      return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setError("Voice input isn't supported in this browser — try Chrome.");
      return;
    }
    try {
      const r = new SR();
      r.continuous = true;
      r.interimResults = false;
      r.onresult = (e) => {
        let t = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) t += e.results[i][0].transcript;
        }
        if (t) setDraft((d) => (d ? d + " " : "") + t.trim());
      };
      r.onerror = (e) => {
        setListening(false);
        if (e.error === "not-allowed") setError("Microphone access was blocked — allow it in your browser settings.");
      };
      r.onend = () => setListening(false);
      r.start();
      recRef.current = r;
      setListening(true);
      setError("");
    } catch (e) {
      setError("Couldn't start the microphone.");
    }
  };

  // ----- merge helper -----
  // ----- add an entry to a day (kept whole, in order) -----
  const pushEntry = (key, entry) => {
    setDays((prev) => {
      const cur = prev[key] || { entries: [] };
      const next = { ...prev, [key]: { ...cur, entries: [...(cur.entries || []), entry] } };
      saveJSON(STORAGE_KEY, next);
      return next;
    });
  };

  // ----- add journal entry -----
  const addEntry = async () => {
    const text = draft.trim();
    if ((!text && !pendingImgs.length) || busy) return;
    // silent learn-loop: they wrote after seeing a prompt — credit that prompt's kind
    if (text && shownAngleRef.current != null) {
      const userId = (window.__session && window.__session.user && window.__session.user.id) || "local";
      bumpAngle(userId, shownAngleRef.current, "answered");
      shownAngleRef.current = null;
    }
    setBusy(true); setBusyMode("entry"); setError("");
    try {
      const time = nowTime();
      const entrySegments = [];

      if (text) {
        const vibe = buildVibeProfile(days);
        const existingTopics = {};
        eachSegment(days, (k2, en, sg) => {
          for (const t of segTags(sg)) existingTopics[t] = (existingTopics[t] || 0) + 1;
        });
        const topicList = Object.entries(existingTopics).sort((a, b) => b[1] - a[1]).slice(0, 20).map(([t]) => t);
        let segments = [], tagline = "";
        try {
          const result = await classifyLongEntry(text, vibe.text, topicList);
          segments = result.segments; tagline = result.tagline;
        } catch (aiErr) {
          console.error("Classification failed, saving unsorted:", aiErr);
          setError("Saved, but the AI couldn't sort it — " + (aiErr && aiErr.message ? aiErr.message : "unknown error"));
        }
        if (!segments.length) segments = [{ text, topic: "Notes", emotion: "neutral" }];
        for (const seg of segments) {
          entrySegments.push({ id: uid(), type: "text", text: seg.text, tags: seg.tags, topic: seg.topic, emotion: seg.emotion, time });
        }
        if (tagline) updateSettings({ tagline });
      }

      if (pendingImgs.length) {
        for (const p of pendingImgs) {
          const key = IMG_PREFIX + p.id;
          await window.storage.set(key, p.dataUrl);
          entrySegments.push({ id: uid(), type: "image", imgKey: key, topic: "Photos", emotion: "neutral", time });
        }
      }

      pushEntry(dayKey(), { id: uid(), time, segments: entrySegments });
      haptic("Light");
      setDraft("");
      setPendingImgs([]);
      textareaRef.current && textareaRef.current.focus();
    } catch (e) {
      console.error(e);
      setError("Couldn't save that entry — please try again.");
    } finally {
      setBusy(false); setBusyMode("");
    }
  };

  // ----- ask the AI -----
  const askAI = async () => {
    let text = draft.trim();
    if (!text || busy) return;
    text = text.replace(askRe, "");
    setBusy(true); setBusyMode("ask"); setError("");
    try {
      const { answer, topic, emotion, sources } = await withRetry(() => answerQuestion(text, aiIdentity, webSearch));
      const time = nowTime();
      pushEntry(dayKey(), {
        id: uid(), time,
        segments: [{ id: uid(), type: "qa", q: text, a: answer, topic, emotion, time, sources }],
      });
      setDraft("");
      textareaRef.current && textareaRef.current.focus();
    } catch (e) {
      console.error(e);
      setError("The AI couldn't answer just now — please try again.");
    } finally {
      setBusy(false); setBusyMode("");
    }
  };

  const looksLikeQuestion = askRe.test(draft.trim());
  const submit = () => (looksLikeQuestion ? askAI() : addEntry());

  // ----- talk to your journal (Ask tab) -----
  const askJournal = async () => {
    const question = askInput.trim();
    if (!question || askBusy) return;
    setAskMsgs((m) => [...m, { role: "u", text: question }]);
    setAskInput(""); setAskBusy(true);
    try {
      // pull notes that share words with the question, plus the recent digest
      const words = question.toLowerCase().split(/\W+/).filter((w) => w.length > 3);
      const hits = [];
      eachSegment(days, (k2, en, sg) => {
        const txt = itemPlainText(sg).toLowerCase();
        if (words.some((w) => txt.includes(w))) hits.push(k2 + ": " + itemPlainText(sg).slice(0, 160));
      });
      const relevant = hits.slice(-30).join("\n").slice(0, 4000);
      const digest = buildDigest(days, 30);
      const history = askMsgs.slice(-6).map((m) => (m.role === "u" ? "Them: " : "You: ") + m.text).join("\n");
      const res = await withRetry(() => callClaudeRaw(`You are the AI living inside someone's private journal. ${aiIdentity} They're asking you about their own life, and you have their entries below.${webSearch ? " If the question needs current outside information (news, prices, recent events), you may search the web and blend it with what they wrote — say which part came from the web." : ""} Answer from their entries — quote or reference specific dates and things they actually wrote. If the entries don't contain the answer, say so honestly instead of guessing. Under 150 words, warm and direct, no markdown.

Conversation so far:
${history || "(first question)"}

Month-by-month mood timeline across their whole history (use this for "when" / "happiest" / "most stressed" / trend questions):
"""${buildMoodTimeline(days) || "no entries yet"}"""

Notes matching their question:
"""${relevant || "none found"}"""

Their recent entries:
"""${digest || "no entries yet"}"""

Their question: "${question}"`, 700, webSearch));
      setAskMsgs((m) => [...m, { role: "a", text: res.text, sources: res.sources, webError: res.webError }]);
    } catch (e) {
      setAskMsgs((m) => [...m, { role: "a", text: "Couldn't reach the AI — " + ((e && e.message) || "unknown error") }]);
    } finally {
      setAskBusy(false);
    }
  };

  // ----- favorites -----
  const toggleFav = (dKey, entryId, segId) => {
    setDays((prev) => {
      const cur = prev[dKey];
      if (!cur) return prev;
      const entries = (cur.entries || []).map((en) =>
        en.id === entryId
          ? { ...en, segments: en.segments.map((s) => (s.id === segId ? { ...s, fav: !s.fav } : s)) }
          : en
      );
      const next = { ...prev, [dKey]: { ...cur, entries } };
      saveJSON(STORAGE_KEY, next);
      return next;
    });
  };

  // ----- privacy lock -----
  const setPin = async () => {
    const p = pinField.trim();
    if (p.length < 4) { setError("PIN needs at least 4 digits."); return; }
    localStorage.setItem(PIN_KEY, await hashPin(p));
    setHasPin(true); setPinField(""); setError("");
  };
  const removePin = async () => {
    if ((await hashPin(pinField.trim())) === localStorage.getItem(PIN_KEY)) {
      localStorage.removeItem(PIN_KEY);
      setHasPin(false); setPinField(""); setError("");
    } else {
      setError("Enter your current PIN to remove the lock.");
    }
  };

  // ----- edit -----
  const startEdit = (item) => { setEditingId(item.id); setEditText(item.text || ""); };
  const saveEdit = (dKey, entryId) => {
    const newText = editText.trim();
    setDays((prev) => {
      const cur = prev[dKey];
      if (!cur) return prev;
      const entries = (cur.entries || []).map((en) =>
        en.id === entryId
          ? { ...en, segments: en.segments.map((s) => (s.id === editingId ? { ...s, text: newText || s.text } : s)) }
          : en
      );
      const next = { ...prev, [dKey]: { ...cur, entries } };
      saveJSON(STORAGE_KEY, next);
      return next;
    });
    setEditingId(null); setEditText("");
  };

  // ----- delete → recently deleted -----

  const deleteItem = (dKey, entryId, segId) => {
    const dayData = days[dKey];
    if (!dayData) return;
    let removed = null;
    for (const en of dayData.entries || []) {
      if (en.id === entryId) {
        const gone = (en.segments || []).find((s) => s.id === segId);
        if (gone) removed = gone;
      }
    }
    // functional update: safe even for rapid back-to-back deletes
    setDays((prev) => {
      const cur = prev[dKey];
      if (!cur) return prev;
      const entries = (cur.entries || [])
        .map((en) => (en.id === entryId ? { ...en, segments: en.segments.filter((s) => s.id !== segId) } : en))
        .filter((en) => en.segments.length > 0);
      const next = { ...prev };
      if (entries.length === 0) delete next[dKey];
      else next[dKey] = { ...cur, entries };
      saveJSON(STORAGE_KEY, next);
      return next;
    });
    if (removed) {
      // photos stay in storage until purged forever, so they can be restored
      const entry = { tid: uid(), item: removed, topic: removed.topic || "Notes", day: dKey, deletedAt: Date.now() };
      setTrash((prevT) => {
        const nextT = [entry, ...prevT];
        saveJSON(TRASH_KEY, nextT);
        return nextT;
      });
    }
  };

  const restoreItem = (tid) => {
    const entry = trash.find((t) => t.tid === tid);
    if (!entry) return;
    const seg = { ...entry.item, topic: entry.item.topic || entry.topic };
    pushEntry(entry.day, { id: uid(), time: seg.time || "", segments: [seg] });
    setTrash((prevT) => {
      const nextT = prevT.filter((t) => t.tid !== tid);
      saveJSON(TRASH_KEY, nextT);
      return nextT;
    });
  };

  const purgeItem = (tid) => {

        /* ================= PHONE OPTIMIZATION (any skin) ================= */
        @media (max-width: 700px) {

          .xo-composer textarea { min-height: 78px; }

          .xo-composer-row { margin-top: 8px; }
          .xo-btns { width: 100%; justify-content: space-between; gap: 6px; }
          .xo-attach, .xo-mic, .xo-ask, .xo-add { padding: 10px 12px; }

          .xo-searchrow { margin-bottom: 8px; }
          .xo-topicchips { gap: 6px; margin-bottom: 10px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
          .xo-topicchips::-webkit-scrollbar { display: none; }
          .xo-topicchip { flex: 0 0 auto; }

          .xo-dayhead { padding: 12px 14px; gap: 8px; }
          .xo-daybody { padding: 0 10px 10px; }
          .xo-section { padding: 11px 12px; }
          .xo-seg { grid-template-columns: 1fr 56px; gap: 8px; }
          .xo-emolabel { font-size: 8.5px; letter-spacing: 0.05em; }
          .xo-sidetopic { max-width: 56px; }
          .xo-segacts { opacity: 1; gap: 0; }
          .xo-act { padding: 3px; font-size: 15px; }

          .xo-daycard, .xo-goal { border-radius: 16px; }

          /* touch devices: kill sticky hover-lift so nothing stays raised after a tap */
          .xo-kpi:hover, .xo-panel:hover, .xo-daycard:hover, .xo-goal:hover, .xo-wallpost:hover { transform: none; }
          .xo-gear:hover, .xo-panel-btn:hover, .xo-preset:hover, .xo-add:hover, .xo-attach:hover, .xo-mic:hover, .xo-ask:hover { transform: none; }
        }

        /* ================= DESKTOP REFINEMENTS (phone layout untouched) ================= */
        @media (min-width: 701px) {
          /* header stays reachable while scrolling a long journal */
          .xo-top {
            position: sticky; top: 0; z-index: 30;
            padding: 14px 0 12px; margin-bottom: 10px;

          /* the writing box is the main event */

          /* KPI cards get a little more presence; hero picks up an accent edge */

        /* ================= TABLET / iPad (701–1024px) ================= */
        @media (min-width: 701px) and (max-width: 1024px) {
          .xo-root { padding: calc(20px + env(safe-area-inset-top, 0px))
                              calc(22px + env(safe-area-inset-right, 0px))
                              calc(70px + env(safe-area-inset-bottom, 0px))
                              calc(22px + env(safe-area-inset-left, 0px)); }
          /* 4 KPI cards across is cramped at this width — 2×2 reads better */
          .xo-kpis { grid-template-columns: 1fr 1fr; gap: 12px; }
          .xo-kpi.hero { grid-column: span 1; }
          .xo-kpi .val { font-size: 26px; }
          .xo-kpi.hero .val { font-size: 30px; }
          .xo-tab { padding: 9px 16px; font-size: 13.5px; }
          .xo-composer textarea { min-height: 104px; }
          .xo-tagmenu { width: 300px; }
          .xo-gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

        /* ================= TOUCH DEVICES (any size) ================= */
        @media (pointer: coarse) {

          .xo-kpi:hover, .xo-panel:hover, .xo-daycard:hover, .xo-goal:hover, .xo-wallpost:hover,
          .xo-gear:hover, .xo-panel-btn:hover, .xo-preset:hover, .xo-add:hover, .xo-attach:hover,
          .xo-mic:hover, .xo-ask:hover, .xo-sched:hover, img.xo-galtile:hover, .xo-promptcard:hover,
          .xo-insight:hover, .xo-statrow.click:hover .name { transform: none; }
          .xo-shuffle:hover:not(:disabled) { transform: none; }
          /* comfortable tap targets */
          .xo-act { padding: 6px; font-size: 16px; }
          .xo-segacts { opacity: 1; gap: 2px; }
          .xo-tagopt { padding: 11px 9px; }
          .xo-tagopt .star { font-size: 15px; padding: 0 2px; }
          .xo-topicchip, .xo-tag { padding-top: 6px; padding-bottom: 6px; }
          .xo-schedcheck { width: 26px; height: 26px; }
          /* 16px inputs stop iOS/iPadOS zooming on focus */

          .xo-editbox textarea, .xo-pad, .xo-goalnew input { font-size: 16px; }

        /* wide screens: give the reading column and the dashboard rail more room */
        @media (min-width: 1001px) {

          .xo-grid2 { grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; }
        }
        @media (min-width: 1500px) {
          .xo-shell { max-width: 1400px; }
          .xo-grid2 { grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; }
        }

        /* ================= SIDEBAR STATS ================= */
        .xo-weekbars { display: flex; gap: 6px; height: 92px; }

        .xo-weekbars .wbfill { width: 100%; border-radius: 5px; background: linear-gradient(180deg, var(--accent), rgba(var(--accent-rgb), 0.45)); min-height: 3px; }
        .xo-weekbars .wb span { font-size: 9px; color: var(--faint); text-transform: uppercase; text-align: center; }
        .xo-statrow { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
        .xo-statrow:last-child { margin-bottom: 0; }
        .xo-statrow .name { font-size: 12px; color: var(--body); width: 82px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .xo-statrow .bar { flex: 1; height: 6px; border-radius: 99px; background: var(--inputbg); overflow: hidden; display: block; }
        .xo-statrow .fill { display: block; height: 100%; border-radius: 99px; }
        .xo-statrow .n { font-size: 11px; color: var(--faint); width: 26px; text-align: right; flex: none; }
        .xo-statrow.click { cursor: pointer; }
        .xo-statrow.click:hover .name { color: var(--accent); }

        /* ---------- rewind / photos / chat / pixels ---------- */
        .xo-rewindtext { font-size: 13.5px; color: var(--body); line-height: 1.65; white-space: pre-wrap; }
        .xo-photostrip { display: flex; gap: 6px; flex-wrap: wrap; }
        .xo-photostrip .xo-photo { height: 62px; width: 62px; object-fit: cover; margin: 0; }
        .xo-photostrip .xo-photo-big { height: auto; width: 100%; }

        /* ---------- Photos tab: gallery + lightbox ---------- */
        .xo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .xo-galtile { aspect-ratio: 1; width: 100%; height: 100%; object-fit: cover; border-radius: 14px; border: 1px solid var(--line); background: var(--inputbg); cursor: zoom-in; display: block; transition: transform .18s, border-color .18s; }
        img.xo-galtile:hover { transform: translateY(-2px); border-color: rgba(var(--accent-rgb), 0.5); }
        .xo-galtile.loading { animation: xoshimmerbg 1.4s ease-in-out infinite; }
        .xo-galtile.fail { cursor: default; }
        @keyframes xoshimmerbg { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.85; } }
        @media (prefers-reduced-motion: reduce) { .xo-galtile.loading { animation: none; } }
        .xo-lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(3, 4, 6, 0.92); backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; cursor: zoom-out; animation: xofade .18s ease both; }
        @keyframes xofade { from { opacity: 0; } to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .xo-lightbox { animation: none; } }
        .xo-lightimg { max-width: min(920px, 94vw); max-height: 82dvh; border-radius: 14px; border: 1px solid rgba(var(--accent-rgb), 0.35); box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6); cursor: default; object-fit: contain; }

        .xo-lightclose { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(18px + env(safe-area-inset-right, 0px)); width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .xo-lightclose:hover { color: var(--accent); border-color: rgba(var(--accent-rgb), 0.5); }
        .xo-chat { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; max-height: min(55dvh, 460px); overflow-y: auto; scrollbar-width: thin; }
        .xo-msg { padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
        .xo-msg.u { align-self: flex-end; background: var(--soft); border: 1px solid rgba(var(--accent-rgb), 0.35); max-width: 85%; color: var(--ink); }
        .xo-msg.a { align-self: flex-start; background: var(--inputbg); border: 1px solid var(--line); max-width: 92%; color: var(--body); }
        .xo-chatrow { display: flex; gap: 8px; }
        .xo-yearpixels { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 10px); grid-auto-columns: 10px; gap: 3px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
        .xo-yearpixels i { width: 10px; height: 10px; border-radius: 3px; background: var(--inputbg); border: 1px solid var(--line); box-sizing: border-box; display: block; }

        .xo-yearpixels i.pad { visibility: hidden; }
        .xo-promptcard { position: relative; padding-right: 44px; }
        .xo-shuffle { position: absolute; top: 10px; right: 10px; border: 1px solid var(--line); background: transparent; color: var(--faint); width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 13px; line-height: 1; transition: all .2s; }
        .xo-shuffle:hover:not(:disabled) { color: var(--accent); border-color: rgba(var(--accent-rgb), 0.5); transform: rotate(180deg); }
        .xo-shuffle:disabled { opacity: 0.4; cursor: default; }
        .xo-act.star.on { color: var(--accent); }

        /* ---------- schedule ---------- */
        .xo-schednew { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .xo-schednew > .xo-search { flex: 1; min-width: 220px; }
        .xo-schedwhen { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .xo-schedwhen .xo-search { flex: none; width: auto; min-width: 130px; }
        .xo-sched { display: flex; align-items: flex-start; gap: 12px; background: var(--card); border: 1px solid var(--line);
          border-left: 3px solid rgba(var(--accent-rgb), 0.55); border-radius: 14px; padding: 13px 15px; margin-bottom: 10px;
          transition: border-color .2s, opacity .2s; }
        .xo-sched:hover { border-color: var(--dash); border-left-color: rgba(var(--accent-rgb), 0.55); }

        .xo-schedcheck { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 7px; cursor: pointer;
          border: 1px solid var(--dash); background: var(--inputbg); color: var(--btn-text); font-size: 13px; line-height: 1;
          display: flex; align-items: center; justify-content: center; transition: all .2s; }
        .xo-schedcheck:hover { border-color: var(--accent); }
        .xo-sched.done .xo-schedcheck { background: var(--accent); border-color: var(--accent); }
        .xo-schedbody { flex: 1; min-width: 0; }
        .xo-schedtitle { font-size: 14.5px; color: var(--ink); font-weight: 500; word-break: break-word; }

        /* ---------- web-search sources ---------- */
        .xo-sources { display: flex; flex-direction: column; gap: 3px; margin-top: 10px;
          padding-top: 8px; border-top: 1px dashed var(--dash); }

          color: var(--faint); margin-bottom: 2px; }

          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.9; }
        .xo-sources a:hover { opacity: 1; text-decoration: underline; }

        .xo-weberr { margin-top: 8px; font-size: 11.5px; color: #ff8b96; line-height: 1.5; }

        /* ---------- filter bar + tag dropdown ---------- */
        .xo-filterbar { display: flex; gap: 10px; margin: 0 0 12px; align-items: stretch; flex-wrap: wrap; }
        .xo-filterbar > .xo-search { flex: 1; min-width: 180px; }
        .xo-tagdrop { position: relative; flex: none; }
        .xo-tagdropbtn { display: inline-flex; align-items: center; gap: 8px; height: 100%; min-height: 38px;
          background: var(--card); border: 1px solid var(--line); border-radius: 10px; color: var(--body);
          font: 500 13.5px var(--bodyfont); padding: 8px 14px; cursor: pointer; transition: border-color .2s;
          max-width: 230px; }

          box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5); animation: xorise .16s ease both; }
        .xo-tagmenu > .xo-search { width: 100%; box-sizing: border-box; margin-bottom: 6px; }
        .xo-tagmenulist { max-height: 300px; overflow-y: auto; scrollbar-width: thin; }
        .xo-tagopt { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;

          color: var(--body); font: 500 13px var(--bodyfont); transition: background .15s; }
        .xo-tagopt:hover { background: rgba(var(--strong-rgb), 0.06); }

        .xo-tagopt.clear { color: var(--faint); }
        .xo-tagopt .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .xo-tagopt .star.on { color: var(--accent); }
        .xo-tagopt .star:hover { color: var(--accent); }
        .xo-tagnone { padding: 12px 9px; color: var(--faint); font-size: 12.5px; }

        .xo-padstate { font: 500 11px var(--bodyfont); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); flex: none; }

          border: none; outline: none; color: var(--ink); caret-color: var(--accent);

          border-radius: 12px; padding: 6px; background: var(--inputbg); }

          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ---------- desktop layout editor ---------- */

        .xo-panel-btn.on { color: var(--accent); border-color: rgba(var(--accent-rgb), 0.55); background: var(--soft); }
        .xo-ptitle { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }

        /* ================= ALBUM MOTIFS — ambient set dressing per accent theme ================= */
