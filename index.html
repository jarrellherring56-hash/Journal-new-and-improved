// ================= cloud storage (same API the app already uses) =================
// Every query is scoped to user_id as well as key. Row Level Security already
// enforces that, but being explicit keeps maybeSingle() deterministic and makes
// the upsert's conflict target unambiguous on the composite (user_id, key) key.
function makeCloudStorage(sb, userId) {
  return {
    async get(key) {
      const { data, error } = await sb
        .from("kv").select("value,updated_at")
        .eq("user_id", userId).eq("key", key).maybeSingle();
      if (error) throw error;
      if (!data) throw new Error("not found");
      return { key, value: data.value, updatedAt: data.updated_at || null };
    },
    // Read the stored timestamp back rather than trusting our own clock: the
    // table stamps it server-side, and the offline queue compares those stamps
    // to decide whose copy is newer. A device with a wrong clock stays honest.
    async set(key, value) {
      const { data, error } = await sb
        .from("kv")
        .upsert({ user_id: userId, key, value, updated_at: new Date().toISOString() }, { onConflict: "user_id,key" })
        .select("updated_at")
        .maybeSingle();
      if (error) throw error;
      return { key, value, updatedAt: (data && data.updated_at) || null };
    },
    async delete(key) {
      const { error } = await sb.from("kv").delete().eq("user_id", userId).eq("key", key);
      if (error) throw error;
      return { key, deleted: true };
    },
    async list(prefix = "") {
      const { data, error } = await sb
        .from("kv").select("key")
        .eq("user_id", userId).like("key", (prefix || "") + "%");
      if (error) throw error;
      return { keys: (data || []).map((r) => r.key) };
    },
    // cheap "has anyone else written this since?" probe for the flush guard
    async stamp(key) {
      const { data, error } = await sb
        .from("kv").select("updated_at")
        .eq("user_id", userId).eq("key", key).maybeSingle();
      if (error) throw error;
      return data ? (data.updated_at || null) : null;
    },
  };
}

// ================= offline layer =================
// Write-through localStorage mirror around cloud storage: reads fall back to the
// mirror when offline, and writes that failed offline retry when the network
// returns. Each mirrored entry records the cloud timestamp it was based on, so a
// queued write can never overwrite something a different device wrote later.
function makeOfflineStorage(cloud, userId) {
  const pre = "daybook:mirror:" + userId + ":";
  const dirtyKey = "daybook:dirty:" + userId;
  // Photos are large base64 blobs — never mirror them to localStorage, or a handful
  // would exhaust the ~5MB quota and starve the essential text/settings cache.
  const isBig = (k) => k.startsWith(IMG_PREFIX);

  // mirror entries are {v: value, t: cloud updated_at we based on}. Older builds
  // stored a bare string, so tolerate that shape on read.
  const readMirror = (key) => {
    let raw = null;
    try { raw = localStorage.getItem(pre + key); } catch (e) { return null; }
    if (raw === null) return null;
    try {
      const o = JSON.parse(raw);
      if (o && typeof o === "object" && typeof o.v === "string") return { v: o.v, t: o.t || null };
    } catch (e) { /* legacy plain string */ }
    return { v: raw, t: null };
  };
  const writeMirror = (key, value, t) => {
    if (isBig(key)) return;
    try { localStorage.setItem(pre + key, JSON.stringify({ v: value, t: t || null })); } catch (e) { /* quota */ }
  };

  const getDirty = () => { try { return JSON.parse(localStorage.getItem(dirtyKey) || "[]"); } catch (e) { return []; } };
  const setDirty = (arr) => { try { localStorage.setItem(dirtyKey, JSON.stringify([...new Set(arr)])); } catch (e) { /* quota */ } };

  const flush = async () => {
    const dirty = getDirty();
    if (!dirty.length) return;
    const left = [];
    for (const k of dirty) {
      if (isBig(k)) continue; // photos aren't mirrored, so never sync them through the queue
      const m = readMirror(k);
      try {
        if (m === null) { await cloud.delete(k); continue; } // queued delete
        // Whoever wrote last wins ONLY if they wrote after us. If the cloud copy
        // changed since this device last saw it, another device is ahead — drop
        // our queued write rather than destroying their entries.
        const cloudStamp = await cloud.stamp(k);
        if (cloudStamp && (!m.t || cloudStamp > m.t)) continue;
        const r = await cloud.set(k, m.v);
        writeMirror(k, m.v, r.updatedAt);
      } catch (e) { left.push(k); }
    }
    setDirty(left);
  };
  window.addEventListener("online", flush);
  setInterval(flush, 60000);
  flush();

  return {
    flush,
    async get(key) {
      try {
        const r = await cloud.get(key);
        writeMirror(key, r.value, r.updatedAt);
        return r;
      } catch (err) {
        if (err && err.message === "not found") throw err;
        const m = readMirror(key); // offline: fall back to the local copy
        if (m) return { key, value: m.v };
        throw err;
      }
    },
    async set(key, value) {
      const base = readMirror(key);
      try {
        const r = await cloud.set(key, value);
        writeMirror(key, value, r.updatedAt);
        setDirty(getDirty().filter((k) => k !== key)); // success clears any stale queued write
        return r;
      } catch (err) {
        // offline: keep the value locally with the base stamp so flush can compare
        writeMirror(key, value, base ? base.t : null);
        if (!isBig(key)) setDirty([...getDirty(), key]); // photos are best-effort (can't recover the blob)
        return { key, value, queued: !isBig(key) };
      }
    },
    async delete(key) {
      try { localStorage.removeItem(pre + key); } catch (e) { }
      try {
        const r = await cloud.delete(key);
        setDirty(getDirty().filter((k) => k !== key));
        return r;
      } catch (err) { setDirty([...getDirty(), key]); return { key, deleted: true, queued: true }; }
    },
    async list(prefix) {
      try { return await cloud.list(prefix); }
      catch (err) {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const kk = localStorage.key(i);
          if (kk && kk.startsWith(pre)) {
            const rest = kk.slice(pre.length);
            if (rest.startsWith(prefix || "")) keys.push(rest);
          }
        }
        return { keys };
      }
    },
  };
}

// ================= login screen =================
function Login({ onDone }) {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [invite, setInvite] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  const go = async () => {
    if (busy) return;
    setBusy(true); setMsg("");
    try {
      if (mode === "signup") {
        const { error } = await window.__sb.auth.signUp({
          email: email.trim(),
          password: pw,
          options: { data: { invite: invite.trim() } },
        });
        if (error) throw error;
        const { error: e2 } = await window.__sb.auth.signInWithPassword({ email: email.trim(), password: pw });
        if (e2) { setMsg("Account created — now sign in."); setMode("signin"); }
        else onDone();
      } else {
        const { error } = await window.__sb.auth.signInWithPassword({ email: email.trim(), password: pw });
        if (error) throw error;
        onDone();
      }
    } catch (e) {
      setMsg(e.message || "Something went wrong");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="lg-root">
      <style>{LG_CSS}</style>
      <div className="lg-card">
        <p className="lg-title">Journal<span>/ ai</span></p>
        <p className="lg-sub">{mode === "signup" ? "Create your private journal" : "Welcome back"}</p>
        <label>Email</label>
        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" autoComplete="email" />
        <label>Password</label>
        <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} placeholder="••••••••"
          autoComplete={mode === "signup" ? "new-password" : "current-password"}
          onKeyDown={(e) => { if (e.key === "Enter" && mode === "signin") go(); }} />
        {mode === "signup" && (
          <>
            <label>Invite code</label>
            <input type="text" value={invite} onChange={(e) => setInvite(e.target.value)} placeholder="From whoever sent you here"
              onKeyDown={(e) => { if (e.key === "Enter") go(); }} />
          </>
        )}
        <button className="lg-go" onClick={go} disabled={busy || !email.trim() || pw.length < 6}>
          {busy ? "One sec…" : mode === "signup" ? "Create account" : "Sign in"}
        </button>

        {msg && <div className="lg-msg">{msg}</div>}
        <div className="lg-alt">
          {mode === "signup" ? (
            <>Already have an account?<button onClick={() => { setMode("signin"); setMsg(""); }}>Sign in</button></>
          ) : (
            <>First time here?<button onClick={() => { setMode("signup"); setMsg(""); }}>Create account</button></>
          )}
        </div>
      </div>
    </div>
  );
}

// ================= root: session gate =================
function AuthRoot() {
  const [session, setSession] = useState(undefined); // undefined = checking

  const refresh = async () => {
    const { data } = await window.__sb.auth.getSession();
    setSession(data.session || null);
  };

  useEffect(() => {
    refresh();
    const { data: sub } = window.__sb.auth.onAuthStateChange((_e, s) => setSession(s || null));
    return () => { sub && sub.subscription && sub.subscription.unsubscribe(); };
  }, []);

  // Native: keep the splash up until React has decided auth, then fade it out.
  useEffect(() => {
    if (session === undefined) return;
    const SP = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen;
    if (SP) SP.hide({ fadeOutDuration: 250 }).catch(() => {});
  }, [session]);

  if (session === undefined) {
    return <div style={{ minHeight: "100vh", background: "#0a0b0e", color: "#7c8390",
      display: "flex", alignItems: "center", justifyContent: "center",
      fontFamily: "Inter, system-ui, sans-serif" }}>Opening your journal…</div>;
  }
  if (!session) return <Login onDone={refresh} />;

  window.__session = session;
  if (window.__storageFor !== session.user.id) {
    window.storage = makeOfflineStorage(makeCloudStorage(window.__sb, session.user.id), session.user.id);
    window.__storageFor = session.user.id;
  }
  window.__signOut = async () => { await window.__sb.auth.signOut(); };

  return <XOJournal key={session.user.id} />;
}

const __CLEAN_URL = (function(){ try { return new URL(SUPABASE_URL).origin; } catch (e) { return String(SUPABASE_URL).replace(/\/(rest|auth)\/v1\/?$/, "").replace(/\/+$/, ""); } })();
window.__sb = supabase.createClient(__CLEAN_URL, SUPABASE_ANON_KEY);
ReactDOM.createRoot(document.getElementById("root")).render(<AuthRoot />);

</script>
<script>
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function(){}); }
</script>
